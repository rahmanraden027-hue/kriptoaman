<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020713"><title>Transaction · KAM Explorer</title><style>
:root{--bg:#020713;--panel:#08162bd9;--line:#4fa7ff33;--text:#eef7ff;--muted:#8ea6c0;--cyan:#20d7ff;--green:#29f2a2;--red:#ff7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#083b7938,transparent 32%),linear-gradient(180deg,#020713,#030916);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}a{color:var(--cyan);text-decoration:none}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:14px 0 36px}.glass{background:linear-gradient(145deg,#0a1934dc,#040b19eb);border:1px solid var(--line);box-shadow:0 20px 70px #001f5733}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:20px}.brand{display:flex;align-items:center;gap:11px;color:var(--text)}.brand img{width:42px;height:42px}.brand strong,.brand span{display:block}.brand span{color:#77b9ff;font-size:12px}.nav a{display:inline-block;padding:9px 11px;border:1px solid #74b0ff22;border-radius:11px;color:#bcd1e7;margin-left:5px}.hero{margin:12px 0;padding:22px;border-radius:24px}.eyebrow{color:#74dbff;font-size:11px;letter-spacing:.18em;font-weight:900}.hero h1{margin:8px 0;font-size:clamp(27px,5vw,44px)}.sub{color:var(--muted)}.hash{overflow-wrap:anywhere;font-family:ui-monospace,monospace;color:var(--cyan)}.panel{padding:18px;border-radius:22px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:15px;border-radius:17px}.card span,.row dt{color:var(--muted);font-size:12px}.card b{display:block;font-size:20px;margin-top:7px}.rows{margin:0}.row{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid #538fd117}.row dd{margin:0;overflow-wrap:anywhere}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#29f2a214;color:var(--green);border:1px solid #29f2a244}.copy{border:1px solid var(--line);background:#0b1b33;color:#bfe8ff;border-radius:8px;padding:5px 8px;cursor:pointer;margin-left:6px}.footer{color:#6f89a5;font-size:11px;padding:18px 4px}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:5px}.nav a:not(:first-child){display:none}.shell{width:calc(100% - 16px)}}
</style></head><body><main class="shell" data-kam-transaction-detail-version="1.0.0"><header class="glass"><a class="brand" href="/"><img src="https://kriptoaman.com/brand/kriptoaman-mark.svg" alt="KriptoAman logo"><div><strong>KAM Explorer</strong><span>KriptoAman Mainnet</span></div></a><nav class="nav"><a href="/txs">Transactions</a><a href="/blocks">Blocks</a><a href="/api-docs">API</a></nav></header><section class="hero glass"><div class="eyebrow">KAM NETWORK · TRANSACTION DETAIL</div><h1>Transaction</h1><div id="hash" class="hash">Loading verified transaction…</div></section><section class="grid"><article class="card glass"><span>Status</span><b id="status">Checking</b></article><article class="card glass"><span>Confirmations</span><b id="confirmations">—</b></article><article class="card glass"><span>Value</span><b id="value">—</b></article></section><section class="panel glass"><dl class="rows" id="details"></dl></section><footer class="footer">KAM Explorer · Chain ID 22028 · Public read-only network data</footer></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=new Intl.NumberFormat('en-US'),kam=v=>{try{const x=BigInt(v||0),w=x/1000000000000000000n,f=(x%1000000000000000000n).toString().padStart(18,'0').slice(0,6).replace(/0+$/,'');return`${fmt.format(w)}${f?'.'+f:''} KAM`}catch{return'—'}},link=(type,v)=>v?`<a class="hash" href="/${type}/${esc(v)}">${esc(v)}</a><button class="copy" data-copy="${esc(v)}">Copy</button>`:'—',row=(k,v)=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`;async function load(){const hash=location.pathname.split('/').filter(Boolean).pop();$('hash').textContent=hash||'Invalid transaction';try{if(!/^0x[0-9a-f]{64}$/i.test(hash))throw Error('Invalid transaction hash');const r=await fetch(`/api/v2/transactions/${hash}`,{cache:'no-store'});if(!r.ok)throw Error('Transaction unavailable');const x=await r.json();$('status').textContent=x.status==='ok'?'● Success':x.status||'Unavailable';$('status').style.color=x.status==='ok'?'var(--green)':'var(--red)';$('confirmations').textContent=x.confirmations!=null?fmt.format(x.confirmations):'—';$('value').textContent=kam(x.value);$('details').innerHTML=[row('Transaction hash',link('tx',x.hash)),row('Block',x.block_number!=null?`<a href="/block/${x.block_number}">${fmt.format(x.block_number)}</a>`:'—'),row('Timestamp',x.timestamp?esc(new Date(x.timestamp).toLocaleString()):'—'),row('From',link('address',x.from?.hash)),row('To',link('address',x.to?.hash||x.created_contract?.hash)),row('Transaction fee',kam(x.fee?.value)),row('Gas used / limit',`${esc(x.gas_used)} / ${esc(x.gas_limit)}`),row('Gas price',`${esc(x.gas_price)} wei`),row('Nonce',esc(x.nonce)),row('Type',esc(x.transaction_types?.join(', ')||x.type)),row('Method',esc(x.method||'Native transfer / unavailable')),row('Input',`<span class="hash">${esc(x.raw_input||'0x')}</span>`),row('Event logs',x.has_logs===true?'Available through indexed API':x.has_logs===false?'None':'Unavailable')].join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied'})}catch(e){$('status').textContent='Unavailable';$('status').style.color='var(--red)';$('details').innerHTML=row('Data status','Transaction data is temporarily unavailable. No values are estimated.')}}load()})();
</script></body></html>
