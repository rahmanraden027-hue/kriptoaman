<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020713"><title>Block · KAM Explorer</title><style>
:root{--bg:#020713;--line:#4fa7ff33;--text:#eef7ff;--muted:#8ea6c0;--cyan:#20d7ff;--green:#29f2a2;--gold:#e8bf63;--gold2:#ffd983;--shadow:0 24px 90px rgba(0,24,68,.32)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 82% -10%,rgba(28,112,255,.22),transparent 34%),radial-gradient(circle at 8% 2%,rgba(232,191,99,.09),transparent 28%),linear-gradient(180deg,#020713,#071226 52%,#01040b);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}a{color:var(--cyan);text-decoration:none}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:14px 0 36px}.glass{background:linear-gradient(145deg,rgba(10,25,52,.88),rgba(4,11,25,.94));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}header{position:sticky;top:8px;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:20px}.brand{display:flex;align-items:center;gap:11px;color:var(--text)}.brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(232,191,99,.2))}.brand strong,.brand span{display:block}.brand span,.muted,dt{color:var(--muted);font-size:12px}.nav{display:flex;gap:5px}.nav a{display:inline-block;padding:9px;border:1px solid var(--line);border-radius:10px;color:#bcd1e7;white-space:nowrap}.nav a:hover,.nav a.active{border-color:rgba(232,191,99,.5);background:rgba(232,191,99,.06);color:#fff}.hero,.panel{margin-top:12px;padding:20px;border-radius:22px}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-145px;top:-220px;border:1px solid rgba(232,191,99,.18);box-shadow:0 0 100px rgba(33,116,255,.1)}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:.18em;font-weight:900}.hero h1{position:relative;z-index:1;font-size:clamp(28px,5vw,44px);margin:8px 0}.pager{position:relative;z-index:1;display:flex;gap:8px;margin-top:14px}.pager a{padding:8px 11px;border:1px solid rgba(232,191,99,.2);border-radius:10px;background:rgba(232,191,99,.05);color:#f3d58f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{padding:15px;border-radius:17px;border-top-color:rgba(232,191,99,.25)}.card b{display:block;font-size:20px;margin-top:7px}.rows{margin:0}.row{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid #538fd117}.row dd{margin:0;overflow-wrap:anywhere}.hash{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.tx{display:block;padding:11px 0;border-bottom:1px solid #538fd117}.footer{color:#6f89a5;font-size:11px;padding:18px 4px}@media(max-width:720px){header{flex-wrap:wrap}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:5px}.nav{width:100%;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.shell{width:calc(100% - 16px)}}
</style></head><body><main class="shell" data-kam-block-detail-version="1.0.0"><header class="glass"><a class="brand" href="/"><img src="https://kriptoaman.com/brand/kriptoaman-mark.svg" alt="KriptoAman logo"><div><strong>KAM Explorer</strong><span>KriptoAman Mainnet</span></div></a><nav class="nav"><a class="active" href="/blocks">Blocks</a><a href="/txs">Transactions</a><a href="/addresses">Addresses</a><a href="/api-docs">API</a></nav></header><section class="hero glass"><div class="eyebrow">KAM NETWORK · BLOCK DETAIL</div><h1>Block <span id="number">—</span></h1><div class="muted" id="state">Loading verified block…</div><div class="pager" id="pager"></div></section><section class="grid"><article class="card glass"><span class="muted">Transactions</span><b id="count">—</b></article><article class="card glass"><span class="muted">Gas used</span><b id="gas">—</b></article><article class="card glass"><span class="muted">Timestamp</span><b id="time">—</b></article></section><section class="panel glass"><dl class="rows" id="details"></dl></section><section class="panel glass"><strong>Transactions in this block</strong><div id="txs" class="muted" style="margin-top:10px">Loading…</div></section><footer class="footer">KAM Explorer · Chain ID 22028 · Public read-only network data</footer></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=new Intl.NumberFormat('en-US'),row=(k,v)=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`;async function load(){const id=location.pathname.split('/').filter(Boolean).pop();try{if(!/^(\d+|0x[0-9a-f]{64})$/i.test(id))throw Error('Invalid block');const [br,tr]=await Promise.all([fetch(`/api/v2/blocks/${id}`,{cache:'no-store'}),fetch(`/api/v2/blocks/${id}/transactions`,{cache:'no-store'})]);if(!br.ok)throw Error('Block unavailable');const b=await br.json(),t=tr.ok?await tr.json():{items:[]};$('number').textContent=fmt.format(b.height??b.number??id);$('state').textContent='Verified indexed block';$('count').textContent=fmt.format(b.tx_count??t.items?.length??0);$('gas').textContent=b.gas_used!=null?fmt.format(Number(b.gas_used)):'—';$('time').textContent=b.timestamp?new Date(b.timestamp).toLocaleString():'—';const n=Number(b.height??b.number);if(Number.isSafeInteger(n))$('pager').innerHTML=`${n>0?`<a href="/block/${n-1}">← Previous</a>`:''}<a href="/block/${n+1}">Next →</a>`;$('details').innerHTML=[row('Block hash',`<span class="hash">${esc(b.hash)}</span>`),row('Parent hash',b.parent_hash?`<a class="hash" href="/block/${esc(b.parent_hash)}">${esc(b.parent_hash)}</a>`:'—'),row('Proposer / miner',b.miner?.hash?`<a class="hash" href="/address/${esc(b.miner.hash)}">${esc(b.miner.hash)}</a>`:'—'),row('Gas used / limit',`${esc(b.gas_used)} / ${esc(b.gas_limit)}`),row('Size',b.size!=null?`${fmt.format(Number(b.size))} bytes`:'—'),row('Burnt fee',b.burnt_fees!=null?`${esc(b.burnt_fees)} wei`:'—')].join('');$('txs').innerHTML=(t.items||[]).map(x=>`<a class="tx hash" href="/tx/${esc(x.hash)}">${esc(x.hash)}</a>`).join('')||'No indexed transactions returned.'}catch(e){$('state').textContent='Block data is temporarily unavailable. No values are estimated.';$('txs').textContent='Unavailable'}}load()})();
</script></body></html>
