<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020713"><title>Address · KAM Explorer</title><style>
:root{--panel:#08162bd9;--line:#4fa7ff33;--text:#eef7ff;--muted:#8ea6c0;--cyan:#20d7ff;--green:#29f2a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#083b7938,transparent 32%),linear-gradient(180deg,#020713,#030916);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}a{color:var(--cyan);text-decoration:none}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:14px 0 36px}.glass{background:linear-gradient(145deg,#0a1934dc,#040b19eb);border:1px solid var(--line)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:20px}.brand{display:flex;align-items:center;gap:11px;color:var(--text)}.brand img{width:42px;height:42px}.brand strong,.brand span{display:block}.brand span,.muted{color:var(--muted);font-size:12px}.nav a{display:inline-block;padding:9px;border:1px solid var(--line);border-radius:10px;color:#bcd1e7;margin-left:5px}.hero,.panel{margin-top:12px;padding:20px;border-radius:22px}.eyebrow{color:#74dbff;font-size:11px;letter-spacing:.18em;font-weight:900}.hero h1{font-size:clamp(28px,5vw,44px);margin:8px 0}.hash{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.copy{border:1px solid var(--line);background:#0b1b33;color:#bfe8ff;border-radius:8px;padding:6px 9px;cursor:pointer;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{padding:15px;border-radius:17px}.card b{display:block;font-size:20px;margin-top:7px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#07152a;color:#aecaE5;cursor:pointer}.tabs button.active{color:white;border-color:#20d7ff88}.item{display:block;padding:12px 0;border-bottom:1px solid #538fd117}.footer{color:#6f89a5;font-size:11px;padding:18px 4px}@media(max-width:720px){.grid{grid-template-columns:1fr}.nav a:not(:first-child){display:none}.shell{width:calc(100% - 16px)}}
</style></head><body><main class="shell" data-kam-address-detail-version="1.0.0"><header class="glass"><a class="brand" href="/"><img src="https://kriptoaman.com/brand/kriptoaman-mark.svg" alt="KriptoAman logo"><div><strong>KAM Explorer</strong><span>KriptoAman Mainnet</span></div></a><nav class="nav"><a href="/addresses">Addresses</a><a href="/txs">Transactions</a><a href="/blocks">Blocks</a></nav></header><section class="hero glass"><div class="eyebrow">KAM NETWORK · ADDRESS DETAIL</div><h1>Address</h1><div id="address" class="hash">Loading verified address…</div><button class="copy" id="copy">Copy address</button></section><section class="grid"><article class="card glass"><span class="muted">KAM balance</span><b id="balance">—</b></article><article class="card glass"><span class="muted">Address type</span><b id="type">Checking</b></article><article class="card glass"><span class="muted">Verification</span><b id="verified">—</b></article></section><section class="panel glass"><div class="tabs"><button data-view="transactions" class="active">Transactions</button><button data-view="token-balances">Token holdings</button><button data-view="internal-transactions">Internal transactions</button></div><div id="list" class="muted">Loading verified activity…</div></section><footer class="footer">KAM Explorer · Chain ID 22028 · Public read-only network data</footer></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=new Intl.NumberFormat('en-US'),kam=v=>{try{const x=BigInt(v||0),w=x/1000000000000000000n,f=(x%1000000000000000000n).toString().padStart(18,'0').slice(0,6).replace(/0+$/,'');return`${fmt.format(w)}${f?'.'+f:''} KAM`}catch{return'—'}};let address='';async function activity(view){$('list').textContent='Loading verified data…';try{const r=await fetch(`/api/v2/addresses/${address}/${view}`,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),items=Array.isArray(d)?d:(d.items||[]);$('list').innerHTML=items.slice(0,50).map(x=>{if(view==='token-balances')return`<div class="item"><strong>${esc(x.token?.symbol||x.token?.name||'Token')}</strong> · ${esc(x.value??x.token?.holders_count??'—')}</div>`;const h=x.hash||x.transaction_hash;return`<div class="item">${h?`<a class="hash" href="/tx/${esc(h)}">${esc(h)}</a>`:esc(x.type||'Internal operation')}</div>`}).join('')||'No indexed records returned.'}catch{$('list').textContent='This indexed data is currently unavailable. No values are estimated.'}}async function load(){address=location.pathname.split('/').filter(Boolean).pop();$('address').textContent=address;$('copy').onclick=async()=>{await navigator.clipboard.writeText(address);$('copy').textContent='Copied'};try{if(!/^0x[0-9a-f]{40}$/i.test(address))throw Error();const r=await fetch(`/api/v2/addresses/${address}`,{cache:'no-store'});if(!r.ok)throw Error();const x=await r.json();$('balance').textContent=kam(x.coin_balance);$('type').textContent=x.is_contract?'Contract':'EOA';$('verified').textContent=x.is_contract?(x.is_verified?'Verified contract':'Not verified'):'Not applicable';await activity('transactions')}catch{$('type').textContent='Unavailable';$('list').textContent='Address data is temporarily unavailable. No values are estimated.'}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activity(b.dataset.view)});load()})();
</script></body></html>
