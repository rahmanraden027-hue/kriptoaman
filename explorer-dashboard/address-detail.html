<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020713"><title>Address · KAM Explorer</title><style>
:root{--bg:#020713;--line:#4fa7ff33;--text:#eef7ff;--muted:#8ea6c0;--cyan:#20d7ff;--green:#29f2a2;--gold:#e8bf63;--gold2:#ffd983;--shadow:0 24px 90px rgba(0,24,68,.32)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 82% -10%,rgba(28,112,255,.22),transparent 34%),radial-gradient(circle at 8% 2%,rgba(232,191,99,.09),transparent 28%),linear-gradient(180deg,#020713,#071226 52%,#01040b);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}a{color:var(--cyan);text-decoration:none}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:14px 0 36px}.glass{background:linear-gradient(145deg,rgba(10,25,52,.88),rgba(4,11,25,.94));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}header{position:sticky;top:8px;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:20px}.brand{display:flex;align-items:center;gap:11px;color:var(--text)}.brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(232,191,99,.2))}.brand strong,.brand span{display:block}.brand span,.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:5px}.nav a{display:inline-block;padding:9px;border:1px solid var(--line);border-radius:10px;color:#bcd1e7;white-space:nowrap}.nav a:hover,.nav a.active{border-color:rgba(232,191,99,.5);background:rgba(232,191,99,.06);color:#fff}.hero,.panel{margin-top:12px;padding:20px;border-radius:22px}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-145px;top:-220px;border:1px solid rgba(232,191,99,.18);box-shadow:0 0 100px rgba(33,116,255,.1)}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:.18em;font-weight:900}.hero h1{position:relative;z-index:1;font-size:clamp(28px,5vw,44px);margin:8px 0}.hash{position:relative;z-index:1;font-family:ui-monospace,monospace;overflow-wrap:anywhere}.copy{position:relative;z-index:1;border:1px solid rgba(232,191,99,.22);background:rgba(232,191,99,.06);color:#f5d58c;border-radius:8px;padding:6px 9px;cursor:pointer;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{padding:15px;border-radius:17px;border-top-color:rgba(232,191,99,.25)}.card b{display:block;font-size:20px;margin-top:7px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#07152a;color:#aecae5;cursor:pointer}.tabs button.active{color:#fff;border-color:rgba(232,191,99,.55);background:rgba(232,191,99,.07)}.item{display:block;padding:12px 0;border-bottom:1px solid #538fd117}.footer{color:#6f89a5;font-size:11px;padding:18px 4px}@media(max-width:720px){header{flex-wrap:wrap}.grid{grid-template-columns:1fr}.nav{width:100%;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.shell{width:calc(100% - 16px)}}
</style></head><body><main class="shell" data-kam-address-detail-version="1.0.0"><header class="glass"><a class="brand" href="/"><img src="https://kriptoaman.com/brand/kriptoaman-mark.svg" alt="KriptoAman logo"><div><strong>KAM Explorer</strong><span>KriptoAman Mainnet</span></div></a><nav class="nav"><a class="active" href="/addresses">Addresses</a><a href="/txs">Transactions</a><a href="/blocks">Blocks</a><a href="/contracts">Contracts</a></nav></header><section class="hero glass"><div class="eyebrow">KAM NETWORK · ADDRESS DETAIL</div><h1>Address</h1><div id="address" class="hash">Loading verified address…</div><button class="copy" id="copy">Copy address</button></section><section class="grid"><article class="card glass"><span class="muted">KAM balance</span><b id="balance">—</b></article><article class="card glass"><span class="muted">Address type</span><b id="type">Checking</b></article><article class="card glass"><span class="muted">Verification</span><b id="verified">—</b></article></section><section class="panel glass"><div class="tabs"><button data-view="transactions" class="active">Transactions</button><button data-view="token-balances">Token holdings</button><button data-view="internal-transactions">Internal transactions</button></div><div id="list" class="muted">Loading verified activity…</div></section><footer class="footer">KAM Explorer · Chain ID 22028 · Public read-only network data</footer></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=new Intl.NumberFormat('en-US'),kam=v=>{try{const x=BigInt(v||0),w=x/1000000000000000000n,f=(x%1000000000000000000n).toString().padStart(18,'0').slice(0,6).replace(/0+$/,'');return`${fmt.format(w)}${f?'.'+f:''} KAM`}catch{return'—'}};let address='';async function activity(view){$('list').textContent='Loading verified data…';try{const r=await fetch(`/api/v2/addresses/${address}/${view}`,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),items=Array.isArray(d)?d:(d.items||[]);$('list').innerHTML=items.slice(0,50).map(x=>{if(view==='token-balances')return`<div class="item"><strong>${esc(x.token?.symbol||x.token?.name||'Token')}</strong> · ${esc(x.value??x.token?.holders_count??'—')}</div>`;const h=x.hash||x.transaction_hash;return`<div class="item">${h?`<a class="hash" href="/tx/${esc(h)}">${esc(h)}</a>`:esc(x.type||'Internal operation')}</div>`}).join('')||'No indexed records returned.'}catch{$('list').textContent='This indexed data is currently unavailable. No values are estimated.'}}async function load(){address=location.pathname.split('/').filter(Boolean).pop();$('address').textContent=address;$('copy').onclick=async()=>{await navigator.clipboard.writeText(address);$('copy').textContent='Copied'};try{if(!/^0x[0-9a-f]{40}$/i.test(address))throw Error();const r=await fetch(`/api/v2/addresses/${address}`,{cache:'no-store'});if(!r.ok)throw Error();const x=await r.json();$('balance').textContent=kam(x.coin_balance);$('type').textContent=x.is_contract?'Contract':'EOA';$('verified').textContent=x.is_contract?(x.is_verified?'Verified contract':'Not verified'):'Not applicable';await activity('transactions')}catch{$('type').textContent='Unavailable';$('list').textContent='Address data is temporarily unavailable. No values are estimated.'}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activity(b.dataset.view)});load()})();
</script></body></html>
