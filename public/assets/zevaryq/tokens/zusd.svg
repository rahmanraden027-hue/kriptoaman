    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91f7ff"/>
      <stop offset=".38" stop-color="#22c7ff"/>
      <stop offset="1" stop-color="#1670ff"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9fff0"/>
