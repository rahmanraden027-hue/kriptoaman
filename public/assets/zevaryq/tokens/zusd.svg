<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ZUSD premium token icon</title><desc id="desc">ZEVARYQ USD planned ecosystem asset identity</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#12365f"/>
      <stop offset=".52" stop-color="#071b31"/>
      <stop offset="1" stop-color="#020813"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b5"/>
      <stop offset=".22" stop-color="#ffd866"/>
      <stop offset=".52" stop-color="#e2a42a"/>
      <stop offset=".78" stop-color="#ffdf72"/>
      <stop offset="1" stop-color="#b97308"/>
