<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">KriptoAman Official Mark</title>
  <desc id="desc">Official KriptoAman identity: a dimensional gold and electric-blue K with a network ring, orbital sweep, diamond nodes, and a luminous network sphere.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%"><stop offset="0" stop-color="#092A53"/><stop offset="0.55" stop-color="#061B36"/><stop offset="1" stop-color="#020A16"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6B0"/><stop offset="0.22" stop-color="#FFD95C"/><stop offset="0.55" stop-color="#E7B438"/><stop offset="0.8" stop-color="#B87813"/><stop offset="1" stop-color="#FFE683"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8EFAFF"/><stop offset="0.28" stop-color="#00D7FF"/><stop offset="0.62" stop-color="#0878E8"/><stop offset="1" stop-color="#032D6F"/></linearGradient>
    <radialGradient id="orb" cx="38%" cy="34%" r="72%"><stop offset="0" stop-color="#C7FFFF"/><stop offset="0.22" stop-color="#00E9FF"/><stop offset="0.58" stop-color="#0867D5"/><stop offset="1" stop-color="#03162F"/></radialGradient>
