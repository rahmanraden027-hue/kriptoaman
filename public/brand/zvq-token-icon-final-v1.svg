<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZVQ Token Icon</title>
  <desc id="desc">Official ZVQ native token icon with gold Z, electric blue halo, and ZVQ mark.</desc>
  <defs>
    <radialGradient id="coinBg" cx=".46" cy=".34" r=".74">
      <stop offset="0" stop-color="#102b52"/>
      <stop offset=".48" stop-color="#07192e"/>
