<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 480" role="img" aria-labelledby="title desc">
  <title id="title">KriptoAman Explorer — KAM Mainnet</title>
  <desc id="desc">Official KriptoAman Explorer horizontal identity using the 2026 gold K and electric-blue blockchain orbit.</desc>
  <defs>
    <radialGradient id="bg" cx="36%" cy="42%" r="95%"><stop offset="0" stop-color="#0a2549"/><stop offset=".52" stop-color="#06162e"/><stop offset="1" stop-color="#020711"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset=".22" stop-color="#ffe36a"/><stop offset=".52" stop-color="#f2b932"/><stop offset=".78" stop-color="#c77b12"/><stop offset="1" stop-color="#7b4106"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8ffff"/><stop offset=".25" stop-color="#1eeeff"/><stop offset=".58" stop-color="#00a9ff"/><stop offset="1" stop-color="#0648d8"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#e8eef6"/><stop offset="1" stop-color="#9eafc5"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".82"/></filter>
  </defs>

  <rect width="1536" height="480" rx="34" fill="url(#bg)"/>

  <g transform="translate(38 22) scale(.85)" filter="url(#shadow)">
    <circle cx="256" cy="256" r="196" fill="none" stroke="#00aaff" stroke-width="6" opacity=".72"/>
    <g fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="square">
      <path d="M292 63A196 196 0 0 1 393 114"/><path d="M432 174A196 196 0 0 1 449 290"/>
      <path d="M436 341A196 196 0 0 1 349 427"/><path d="M219 449A196 196 0 0 1 171 439"/>
      <path d="M91 386A196 196 0 0 1 64 280"/><path d="M70 220A196 196 0 0 1 112 132"/>
      <path d="M158 91A196 196 0 0 1 220 65"/>
    </g>
    <path d="M126 118 181 91v130l95-88 86-9-112 121 121 136-72 29-118-115v125l-55 29z" fill="url(#gold)" stroke="#fff0a0" stroke-width="3"/>
    <path d="M149 139 168 128v279l-19 14z" fill="#061b38" stroke="url(#cyan)" stroke-width="4"/>
    <path d="m184 243 102-95 45-5-105 112 105 119-30 14-96-97v51l-23-23v-45z" fill="#061b38" stroke="url(#cyan)" stroke-width="5"/>
    <g transform="rotate(-17 256 256)" fill="none" stroke-linecap="round">
      <ellipse cx="256" cy="256" rx="229" ry="82" stroke="#00bfff" stroke-width="9" opacity=".7" filter="url(#glow)"/>
      <ellipse cx="256" cy="256" rx="229" ry="82" stroke="url(#gold)" stroke-width="10"/>
    </g>
    <g transform="translate(256 55)"><path d="M0-26 25 0 0 31-25 0Z" fill="#061a38" stroke="url(#gold)" stroke-width="7"/><path d="M0-14 13 0 0 16-13 0Z" fill="url(#cyan)"/></g>
    <g transform="translate(256 457)"><path d="M0-27 25 0 0 31-25 0Z" fill="#061a38" stroke="url(#gold)" stroke-width="7"/><path d="M0-14 13 0 0 16-13 0Z" fill="url(#cyan)"/></g>
    <g transform="translate(431 174)"><circle r="32" fill="#06162f" stroke="url(#gold)" stroke-width="9"/><circle r="20" fill="#063d7a" stroke="url(#cyan)" stroke-width="3"/></g>
  </g>

  <g transform="translate(510 96)" filter="url(#shadow)">
    <text x="0" y="86" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="1" fill="url(#silver)">Kripto</text>
    <text x="292" y="86" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="1" fill="url(#gold)">Aman</text>
    <line x1="0" y1="135" x2="910" y2="135" stroke="#163e65" stroke-width="2"/>
    <text x="0" y="215" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="14" fill="url(#cyan)">EXPLORER</text>
    <text x="3" y="294" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="11" fill="url(#gold)">KAM MAINNET</text>
    <circle cx="830" cy="278" r="7" fill="#1eeeff" filter="url(#glow)"/>
    <text x="855" y="289" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#b9c7d8">NETWORK EXPLORER</text>
