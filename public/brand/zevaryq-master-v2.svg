<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ZEVARYQ master emblem</title>
<desc id="desc">Premium ZEVARYQ network emblem with a gold Z, electric blue network globe and midnight navy field.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff2a8"/><stop offset=".28" stop-color="#ffd166"/><stop offset=".62" stop-color="#d99a2b"/><stop offset="1" stop-color="#ffef9c"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
