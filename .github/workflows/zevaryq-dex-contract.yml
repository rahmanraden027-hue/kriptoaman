name: ZEVARYQ DEX Contract Candidate

on:
  pull_request:
    paths:
      - 'chain/zevaryq-mainnet/trading/**'
      - 'src/services/zevaryqSwap.js'
      - 'tests/zevaryq-dex-candidate.test.mjs'
      - '.github/workflows/zevaryq-dex-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'chain/zevaryq-mainnet/trading/**'
      - 'src/services/zevaryqSwap.js'
      - 'tests/zevaryq-dex-candidate.test.mjs'
      - '.github/workflows/zevaryq-dex-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chain/zevaryq-mainnet/trading
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format check
        run: forge fmt --check

      - name: Build Paris-compatible candidate bytecode
        run: forge build --sizes --evm-version paris

      - name: Unit and wallet ABI tests
        run: forge test --match-path test/ZVQDEX.t.sol -vvv --evm-version paris

      - name: Fuzz and invariant hardening
        run: forge test --match-path test/ZVQDEXFuzzInvariant.t.sol -vvv --evm-version paris

      - name: Deployment simulation
        run: forge test --match-path test/ZVQDEXDeploymentSimulation.t.sol -vvv --evm-version paris

      - name: Verify candidate remains non-broadcasting
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='chain/zevaryq-mainnet/trading/script/PrepareZVQDEXDeployment.s.sol'

          # The only allowed script is the reviewed public-address simulation.
          mapfile -t scripts < <(find chain/zevaryq-mainnet/trading -type f -name '*.s.sol' -print)
          test "${#scripts[@]}" -eq 1
          test "${scripts[0]}" = "$SCRIPT"

          # Simulation may record transactions from a public address, but it may
          # never read a signing secret or broadcast from CI.
          grep -q 'envAddress("DEPLOYER_ADDRESS")' "$SCRIPT"
          grep -q 'startBroadcast(deployer)' "$SCRIPT"
          ! grep -R -n -E 'DEPLOYER_PRIVATE_KEY|LIQUIDITY_PRIVATE_KEY|PRIVATE_KEY|MNEMONIC' chain/zevaryq-mainnet/trading
          ! grep -R -n -- '--broadcast' chain/zevaryq-mainnet/trading
          test -z "$(find chain/zevaryq-mainnet/trading -type f \( -name '*deploy*.mjs' -o -name '*deploy*.js' \) -print -quit)"

      - name: Assert CI has no signing secrets
        run: |
          test -z "${DEPLOYER_PRIVATE_KEY:-}"
          test -z "${LIQUIDITY_PRIVATE_KEY:-}"
          test -z "${PRIVATE_KEY:-}"
