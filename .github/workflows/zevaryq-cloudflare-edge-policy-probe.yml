name: Zevaryq Cloudflare Edge Policy Probe

on:
  push:
    branches:
      - feature/zevaryq-explorer-production
    paths:
      - '.github/workflows/zevaryq-cloudflare-edge-policy-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: kriptoaman.com
    steps:
      - name: Inspect Explorer DNS and edge policy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${CF_API_TOKEN:-}"
          echo "::add-mask::${CF_API_TOKEN}"

          zones="$(curl --fail-with-body -sS --get 'https://api.cloudflare.com/client/v4/zones' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json' \
            --data-urlencode "name=${ZONE_NAME}" --data-urlencode "account.id=${CF_ACCOUNT_ID}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zones}")"
          test -n "${zone_id}"

          echo '=== DNS explorer/rpc ==='
          curl --fail-with-body -sS --get "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json' \
            --data-urlencode 'per_page=100' | jq -r '.result[] | select(.name=="explorer.kriptoaman.com" or .name=="rpc.kriptoaman.com") | {id,name,type,content,proxied,ttl}'

          echo '=== Zone rulesets ==='
          rulesets="$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json')"
          jq -r '.result[] | [.id,.name,.phase,.kind] | @tsv' <<<"${rulesets}"

          while IFS=$'\t' read -r id name phase kind; do
            case "${phase}" in
              http_ratelimit|http_request_firewall_custom|http_request_firewall_managed|http_request_transform|http_request_dynamic_redirect)
                echo "=== RULESET ${name} phase=${phase} id=${id} ==="
                detail="$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets/${id}" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json')"
                jq -r '.result.rules[]? | {id,action,expression,description,enabled,ratelimit}' <<<"${detail}"
                ;;
            esac
          done < <(jq -r '.result[] | [.id,.name,.phase,.kind] | @tsv' <<<"${rulesets}")

          echo '=== Legacy rate limits (if available) ==='
          curl -sS "https://api.cloudflare.com/client/v4/zones/${zone_id}/rate_limits?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json' | jq '{success,result}' || true

          echo '=== Public Explorer response headers ==='
          curl -sS -D - -o /dev/null --connect-timeout 10 --max-time 20 \
            -A 'Mozilla/5.0 (compatible; ZevaryqEdgePolicyProbe/1.0)' \
            https://explorer.kriptoaman.com/ | tr -d '\r' | sed -n '1,40p' || true
