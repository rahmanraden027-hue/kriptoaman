name: ZVQ Public Read-only Same-block Balance Proof

on:
  pull_request:
    paths:
      - scripts/verify-zvq-same-block-balances.mjs
      - tests/verify-zvq-same-block-balances.test.mjs
      - .github/workflows/zvq-readonly-balance-proof.yml
  push:
    branches: [main]
    paths:
      - scripts/verify-zvq-same-block-balances.mjs
      - tests/verify-zvq-same-block-balances.test.mjs
      - .github/workflows/zvq-readonly-balance-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zvq-public-readonly-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readonly-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce no transaction methods and regression-test independent proof
        run: |
          set -euo pipefail
          node --check scripts/verify-zvq-same-block-balances.mjs
          node --test tests/verify-zvq-same-block-balances.test.mjs
      - name: Observe two public RPC endpoints at the exact same confirmed block
        run: |
          set -euo pipefail
          node scripts/verify-zvq-same-block-balances.mjs | tee /tmp/zvq-readonly-balance-evidence.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const d=JSON.parse(readFileSync("/tmp/zvq-readonly-balance-evidence.json","utf8"));
            if(d.chain_id!==22028 || !d.both_rpc_heads_advanced
              || d.balances.length!==2 || !d.balances.every(x=>x.providers_agree && !x.ownership_verified)
              || d.transactions_sent!==0)process.exit(1);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: zvq-public-readonly-same-block-evidence
          path: /tmp/zvq-readonly-balance-evidence.json
          if-no-files-found: error
          retention-days: 14
