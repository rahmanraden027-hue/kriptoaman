name: KAM Explorer V2 Deploy

on:
  pull_request:
    paths:
      - 'explorer-dashboard/**'
      - 'scripts/deploy-kam-explorer-v2.sh'
      - 'tests/kam-explorer-v2-dashboard.test.mjs'
      - '.github/workflows/kam-explorer-v2-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'explorer-dashboard/**'
      - 'scripts/deploy-kam-explorer-v2.sh'
      - 'tests/kam-explorer-v2-dashboard.test.mjs'
      - '.github/workflows/kam-explorer-v2-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kam-explorer-v2-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate dashboard integrity
        run: node --test tests/kam-explorer-v2-dashboard.test.mjs
      - name: Validate deploy script syntax
        run: bash -n scripts/deploy-kam-explorer-v2.sh
      - name: Verify public Explorer core before deployment
        run: node scripts/diagnose-blockscout.mjs

  host-permission-preflight:
    needs: preflight
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 5
    steps:
      - name: Verify Explorer host and isolated proxy mount access
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/blockscout/docker-compose
          PROXY_DIR="$BASE/proxy"
          TEMPLATE="$PROXY_DIR/default.conf.template"
          test -d "$PROXY_DIR"
          test -f "$TEMPLATE"
          cd "$BASE"
          PROXY_ID="$(docker compose ps -q proxy)"
          test -n "$PROXY_ID"
          PROXY_IMAGE="$(docker inspect "$PROXY_ID" --format '{{.Config.Image}}')"
          test -n "$PROXY_IMAGE"
          docker image inspect "$PROXY_IMAGE" >/dev/null
          docker run --rm --network none \
            -v "$PROXY_DIR:/target" \
            "$PROXY_IMAGE" sh -c 'test -r /target/default.conf.template && test -w /target'
          docker compose config --services | grep -qx proxy
          echo 'filesystem_mode=isolated_docker_proxy_mount'
          echo 'host_permission_preflight=verified'

      - name: Inspect legacy Blockscout route dependencies read-only
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/blockscout/docker-compose
          FRONTEND_ENV="$BASE/envs/common-frontend.env"
          TEMPLATE="$BASE/proxy/default.conf.template"
          cd "$BASE"

          echo '=== EXPLORER SERVICES ==='
          docker compose ps frontend proxy backend stats || true

          echo '=== SAFE FRONTEND PUBLIC API CONFIG ==='
          grep -E '^(NEXT_PUBLIC_(API_(HOST|PROTOCOL|BASE_PATH)|STATS_API_(HOST|BASE_PATH)|NAVIGATION_LAYOUT|HOMEPAGE_(CHARTS|STATS)|GAS_TRACKER_ENABLED))=' "$FRONTEND_ENV" || true

          STATS_HOST="$(grep '^NEXT_PUBLIC_STATS_API_HOST=' "$FRONTEND_ENV" | tail -n 1 | cut -d= -f2- | tr -d '\r' | sed -e "s/^['\"]//" -e "s/['\"]$//")"
          STATS_BASE="$(grep '^NEXT_PUBLIC_STATS_API_BASE_PATH=' "$FRONTEND_ENV" | tail -n 1 | cut -d= -f2- | tr -d '\r' | sed -e "s/^['\"]//" -e "s/['\"]$//")"
          echo "stats_api_host=${STATS_HOST:-<unset>}"
          echo "stats_api_base_path=${STATS_BASE:-<unset>}"

          echo '=== PROXY STATS ROUTES ==='
          grep -nEi 'stats|api/v1' "$TEMPLATE" | head -n 120 || true

          if [[ -n "$STATS_HOST" ]]; then
            echo '=== STATS ENDPOINT STATUS ==='
            for endpoint in /health /api/v1/counters /api/v1/lines /api/v1/pages/main /api/v1/pages/transactions; do
              url="${STATS_HOST%/}${STATS_BASE%/}${endpoint}"
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)"
              echo "$endpoint=$code"
            done
          fi

          echo '=== PUBLIC LEGACY ROUTE HTTP STATUS ==='
          for path in /stats /tokens /txs /api-docs /blocks; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://explorer.kriptoaman.com${path}" || true)"
            echo "$path=$code"
          done

          echo '=== PUBLIC ERC20 TOKEN INDEX SAMPLE ==='
          curl -L -fsS --max-time 20 'https://explorer.kriptoaman.com/api/v2/tokens?type=ERC-20' | python3 -c 'import json,sys; d=json.load(sys.stdin); items=d.get("items",[])[:20]; print("token_count_sample=",len(items)); [print({"address":(x.get("address") or x.get("address_hash")),"name":x.get("name"),"symbol":x.get("symbol"),"holders":x.get("holders_count"),"type":x.get("type")}) for x in items]'

  deploy-homepage-only:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [preflight, host-permission-preflight]
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
      - name: Verify dedicated Explorer host boundary
        run: |
          set -euo pipefail
          test -d /opt/blockscout/docker-compose/proxy
          test -f /opt/blockscout/docker-compose/proxy/default.conf.template
          test -f explorer-dashboard/index.html
      - name: Deploy KAM Explorer V2 root dashboard
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-kam-explorer-v2.sh
          bash scripts/deploy-kam-explorer-v2.sh

  public-post-verify:
    if: ${{ github.event_name != 'pull_request' }}
    needs: deploy-homepage-only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
      - name: Verify V2 homepage marker and headers
        run: |
          set -euo pipefail
          HTML="$(curl -L -fsS --max-time 20 https://explorer.kriptoaman.com/)"
          printf '%s' "$HTML" | grep -q 'data-kam-explorer-version="2.0.0"'
          printf '%s' "$HTML" | grep -q 'Verified-data only'
          curl -L -sSI --max-time 20 https://explorer.kriptoaman.com/ | grep -Ei '^x-kam-explorer-version: *2' >/dev/null
      - name: Verify Blockscout APIs remain intact
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/blocks | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("items"), list) and len(d["items"])>0'
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/transactions | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("items"), list)'
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/stats | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "total_transactions" in d and "average_block_time" in d'
      - name: Verify detail routing remains on Blockscout
        run: |
          set -euo pipefail
          TX='0x9854d90159013d488190d0f1847596a5dfb7582812f880102f167a1b172b163a'
          curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com/tx/$TX" | grep -Eqi 'transaction|details|0x9854d901'
      - name: Re-run public core diagnostic
        run: node scripts/diagnose-blockscout.mjs
