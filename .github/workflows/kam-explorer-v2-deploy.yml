name: KAM Explorer V2 Deploy

on:
  pull_request:
    paths:
      - 'explorer-dashboard/**'
      - 'scripts/deploy-kam-explorer-v2.sh'
      - 'tests/kam-explorer-v2-dashboard.test.mjs'
      - '.github/workflows/kam-explorer-v2-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'explorer-dashboard/**'
      - 'scripts/deploy-kam-explorer-v2.sh'
      - 'tests/kam-explorer-v2-dashboard.test.mjs'
      - '.github/workflows/kam-explorer-v2-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kam-explorer-v2-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate V2 surfaces and rollback contract
        run: node --test tests/kam-explorer-v2-dashboard.test.mjs
      - name: Validate deploy script syntax
        run: bash -n scripts/deploy-kam-explorer-v2.sh
      - name: Verify public Explorer core before deployment
        run: node scripts/diagnose-blockscout.mjs
      - name: Verify existing public detail routes
        run: |
          set -euo pipefail
          TX='0x9854d90159013d488190d0f1847596a5dfb7582812f880102f167a1b172b163a'
          CANONICAL_WKAM='0x0d8848CE88BB09a81a4248Efdd574d50B98b544A'
          SECONDARY_WKAM='0x36a416d3C74A5d4AF9Fd4826e010CE9B00289fc7'
          curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com/tx/$TX" >/dev/null
          curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com/token/$CANONICAL_WKAM" >/dev/null
          for path in /blocks /txs /api-docs; do curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com$path" >/dev/null; done
          code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://explorer.kriptoaman.com/token/$SECONDARY_WKAM" || true)"
          echo "secondary_wkam_detail_http=$code"

  host-permission-preflight:
    needs: preflight
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 5
    steps:
      - name: Verify dedicated Explorer host boundary and isolated proxy mount
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/blockscout/docker-compose
          PROXY_DIR="$BASE/proxy"
          TEMPLATE="$PROXY_DIR/default.conf.template"
          test -d "$PROXY_DIR"
          test -f "$TEMPLATE"
          cd "$BASE"
          PROXY_ID="$(docker compose ps -q proxy)"
          test -n "$PROXY_ID"
          PROXY_IMAGE="$(docker inspect "$PROXY_ID" --format '{{.Config.Image}}')"
          test -n "$PROXY_IMAGE"
          docker image inspect "$PROXY_IMAGE" >/dev/null
          docker run --rm --network none -v "$PROXY_DIR:/target" "$PROXY_IMAGE" sh -c 'test -r /target/default.conf.template && test -w /target'
          echo 'host_permission_preflight=verified'

  deploy-public-surfaces:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [preflight, host-permission-preflight]
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
      - name: Deploy exact KAM Explorer V2 presentation routes
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-kam-explorer-v2.sh
          bash scripts/deploy-kam-explorer-v2.sh

  public-post-verify:
    if: ${{ github.event_name != 'pull_request' }}
    needs: deploy-public-surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
      - name: Verify all KAM Explorer public presentation routes
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          HEADERS="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS"' EXIT
          verify_body() {
            local path="$1" marker="$2"
            : > "$BODY"
            curl -L -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 25 -o "$BODY" "https://explorer.kriptoaman.com$path"
            grep -Fq "$marker" "$BODY"
          }
          verify_header() {
            local path="$1" pattern="$2"
            : > "$HEADERS"
            curl -L -sSIf --retry 5 --retry-delay 2 --retry-all-errors --max-time 25 -o "$HEADERS" "https://explorer.kriptoaman.com$path"
            grep -Eqi "$pattern" "$HEADERS"
          }
          verify_body '/' 'data-kam-explorer-version="2.0.0"'
          verify_body '/stats' 'data-kam-stats-version="2.0.0"'
          ! grep -Fq 'Placeholder Counter' "$BODY"
          ! grep -Eqi 'amount in ETH|>ETH<' "$BODY"
          verify_body '/tokens' 'data-kam-tokens-version="2.0.0"'
          verify_body '/developer' 'data-kam-developer-version="1.0.0"'
          verify_body '/addresses' 'data-kam-addresses-version="1.0.0"'
          verify_body '/validators' 'data-kam-validators-version="1.0.0"'
          verify_body '/contracts' 'data-kam-contracts-version="1.0.0"'
          verify_body '/status' 'data-kam-status-version="1.0.0"'
          verify_header '/' '^x-kam-explorer-version: *1'
          verify_header '/stats' '^x-kam-explorer-stats-version: *1'
          verify_header '/developer' '^x-kam-explorer-developer-version: *1'
          verify_header '/addresses' '^x-kam-explorer-addresses-version: *1'
          verify_header '/contracts' '^x-kam-explorer-contracts-version: *1'
      - name: Verify core data APIs remain intact
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/blocks | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("items"), list) and len(d["items"])>0'
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/transactions | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("items"), list)'
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/stats | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "total_transactions" in d and "average_block_time" in d'
          curl -fsS --max-time 15 https://explorer.kriptoaman.com/api/v2/stats/charts/transactions | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin),(dict,list))'
          curl -fsS --max-time 15 'https://explorer.kriptoaman.com/api/v2/tokens?type=ERC-20' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("items"),list)'
      - name: Verify Blockscout detail routing remains intact
        run: |
          set -euo pipefail
          TX='0x9854d90159013d488190d0f1847596a5dfb7582812f880102f167a1b172b163a'
          WKAM='0x0d8848CE88BB09a81a4248Efdd574d50B98b544A'
          curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com/tx/$TX" >/dev/null
          curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com/token/$WKAM" >/dev/null
          for path in /blocks /txs /api-docs; do curl -L -fsS --max-time 20 "https://explorer.kriptoaman.com$path" >/dev/null; done
      - name: Re-run public core diagnostic
        run: node scripts/diagnose-blockscout.mjs
