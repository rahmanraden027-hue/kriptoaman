name: Android Release Artifacts

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed Play AAB/APK for KriptoAman Platform and ZEVARYQ Wallet'
        required: false
        default: true
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/android-play.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/android-play.yml'
    tags:
      - 'android-v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PLAY_KEYSTORE_BASE64 != '' && secrets.PLAY_KEYSTORE_PASSWORD != '' && secrets.PLAY_KEY_ALIAS != '' && secrets.PLAY_KEY_PASSWORD != '') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - run: npm ci --legacy-peer-deps

      - name: Run release regression tests
        run: npm run test

      - name: Validate dual Android application identities
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.kriptoaman.app"' android/app/build.gradle
          grep -q 'applicationId "com.kriptoaman.wallet"' android/app/build.gradle
          grep -q 'versionCode 13' android/app/build.gradle
          grep -q 'versionName "1.5.6"' android/app/build.gradle
          grep -q 'versionCode 11' android/app/build.gradle
          grep -q 'versionName "1.0.10"' android/app/build.gradle
          grep -q '"appId": "com.kriptoaman.app"' android/app/src/platform/assets/capacitor.config.json
          grep -q '"appId": "com.kriptoaman.wallet"' android/app/src/wallet/assets/capacitor.config.json
          grep -q 'https://kriptoaman.com/wallet-app' android/app/src/wallet/assets/capacitor.config.json
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q '<string name="launcher_name">KriptoAman</string>' android/app/src/main/res/values/strings.xml
          grep -q '<string name="launcher_name">ZVQ Wallet</string>' android/app/src/wallet/res/values/strings.xml
          grep -q 'android:label="@string/launcher_name"' android/app/src/main/AndroidManifest.xml

      - name: Build web app and sync Capacitor
        run: npm run android:sync

      - name: Build unsigned dual-app preflight artifacts
        if: env.SIGNED_RELEASE != 'true'
        working-directory: android
        run: ./gradlew bundlePlatformRelease assemblePlatformRelease bundleWalletRelease assembleWalletRelease

      - name: Verify unsigned dual-app preflight artifacts
        if: env.SIGNED_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find android/app/build/outputs/bundle/platformRelease -name '*.aab' -print -quit)"
          test -n "$(find android/app/build/outputs/apk/platform/release -name '*.apk' -print -quit)"
          test -n "$(find android/app/build/outputs/bundle/walletRelease -name '*.aab' -print -quit)"
          test -n "$(find android/app/build/outputs/apk/wallet/release -name '*.apk' -print -quit)"
          find android/app/build/outputs/bundle/platformRelease android/app/build/outputs/apk/platform/release android/app/build/outputs/bundle/walletRelease android/app/build/outputs/apk/wallet/release -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Verify built APK package identities
        if: env.SIGNED_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          platform_apk="$(find android/app/build/outputs/apk/platform/release -name '*.apk' -print -quit)"
          wallet_apk="$(find android/app/build/outputs/apk/wallet/release -name '*.apk' -print -quit)"
          test -n "$platform_apk"
          test -n "$wallet_apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          test "$("$APKANALYZER" manifest application-id "$platform_apk")" = "com.kriptoaman.app"
          test "$("$APKANALYZER" manifest application-id "$wallet_apk")" = "com.kriptoaman.wallet"

      - name: Upload KriptoAman Platform preflight AAB
        if: env.SIGNED_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kriptoaman-preflight-aab
          path: android/app/build/outputs/bundle/platformRelease/*.aab
          if-no-files-found: error

      - name: Upload KriptoAman Platform preflight APK
        if: env.SIGNED_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kriptoaman-preflight-apk
          path: android/app/build/outputs/apk/platform/release/*.apk
          if-no-files-found: error

      - name: Upload ZEVARYQ Wallet preflight AAB
        if: env.SIGNED_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zevaryq-wallet-preflight-aab
          path: android/app/build/outputs/bundle/walletRelease/*.aab
          if-no-files-found: error

      - name: Upload ZEVARYQ Wallet preflight APK
        if: env.SIGNED_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zevaryq-wallet-preflight-apk
          path: android/app/build/outputs/apk/wallet/release/*.apk
          if-no-files-found: error

      - name: Validate Play signing configuration
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PLAY_KEYSTORE_BASE64:?Missing PLAY_KEYSTORE_BASE64 secret}"
          : "${PLAY_KEYSTORE_PASSWORD:?Missing PLAY_KEYSTORE_PASSWORD secret}"
          : "${PLAY_KEY_ALIAS:?Missing PLAY_KEY_ALIAS secret}"
          : "${PLAY_KEY_PASSWORD:?Missing PLAY_KEY_PASSWORD secret}"

      - name: Restore and verify Play signing key
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          normalized_keystore_base64="$(printf '%s' "$PLAY_KEYSTORE_BASE64" | tr -d '\r\n\t ')"
          if ! printf '%s' "$normalized_keystore_base64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo 'PLAY_KEYSTORE_BASE64 contains characters outside standard Base64.' >&2
            exit 1
          fi
          if (( ${#normalized_keystore_base64} % 4 != 0 )); then
            echo 'PLAY_KEYSTORE_BASE64 has an invalid encoded length.' >&2
            exit 1
          fi
          printf '%s' "$normalized_keystore_base64" | base64 --decode > android/app/kriptoaman-release.jks
          test -s android/app/kriptoaman-release.jks
          keytool -list -keystore android/app/kriptoaman-release.jks -storepass "$PLAY_KEYSTORE_PASSWORD" -alias "$PLAY_KEY_ALIAS" >/dev/null

      - name: Build signed dual-app release AAB and APK
        if: env.SIGNED_RELEASE == 'true'
        working-directory: android
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: ./gradlew bundlePlatformRelease assemblePlatformRelease bundleWalletRelease assembleWalletRelease -PKRIPTOAMAN_KEYSTORE_FILE=kriptoaman-release.jks -PKRIPTOAMAN_KEYSTORE_PASSWORD="$PLAY_KEYSTORE_PASSWORD" -PKRIPTOAMAN_KEY_ALIAS="$PLAY_KEY_ALIAS" -PKRIPTOAMAN_KEY_PASSWORD="$PLAY_KEY_PASSWORD"

      - name: Verify signed dual-app release artifacts
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find android/app/build/outputs/bundle/platformRelease -name '*.aab' -print -quit)"
          test -n "$(find android/app/build/outputs/apk/platform/release -name '*.apk' -print -quit)"
          test -n "$(find android/app/build/outputs/bundle/walletRelease -name '*.aab' -print -quit)"
          test -n "$(find android/app/build/outputs/apk/wallet/release -name '*.apk' -print -quit)"
          find android/app/build/outputs/bundle/platformRelease android/app/build/outputs/apk/platform/release android/app/build/outputs/bundle/walletRelease android/app/build/outputs/apk/wallet/release -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Verify signed APK package identities
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          platform_apk="$(find android/app/build/outputs/apk/platform/release -name '*.apk' -print -quit)"
          wallet_apk="$(find android/app/build/outputs/apk/wallet/release -name '*.apk' -print -quit)"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$APKANALYZER" manifest application-id "$platform_apk")" = "com.kriptoaman.app"
          test "$("$APKANALYZER" manifest application-id "$wallet_apk")" = "com.kriptoaman.wallet"

      - name: Create APK checksums
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for apk in android/app/build/outputs/apk/platform/release/*.apk android/app/build/outputs/apk/wallet/release/*.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Upload signed KriptoAman Platform Play AAB
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kriptoaman-play-aab
          path: android/app/build/outputs/bundle/platformRelease/*.aab
          if-no-files-found: error

      - name: Verify KriptoAman web-distribution release contract
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          platform_apk="$(find android/app/build/outputs/apk/platform/release -name '*.apk' -print -quit)"
          test -n "$platform_apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          test "$("$APKANALYZER" manifest application-id "$platform_apk")" = "com.kriptoaman.app"
          test "$("$APKANALYZER" manifest version-code "$platform_apk")" = "13"
          "$APKSIGNER" verify --verbose --print-certs "$platform_apk"
          test -s "$platform_apk.sha256"
          sha256sum -c "$platform_apk.sha256"
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Upload signed KriptoAman Platform direct APK
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kriptoaman-direct-apk
          path: |
            android/app/build/outputs/apk/platform/release/*.apk
            android/app/build/outputs/apk/platform/release/*.sha256
          if-no-files-found: error

      - name: Upload signed ZEVARYQ Wallet Play AAB
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zevaryq-wallet-play-aab
          path: android/app/build/outputs/bundle/walletRelease/*.aab
          if-no-files-found: error

      - name: Upload signed ZEVARYQ Wallet direct APK
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zevaryq-wallet-direct-apk
          path: |
            android/app/build/outputs/apk/wallet/release/*.apk
            android/app/build/outputs/apk/wallet/release/*.sha256
          if-no-files-found: error

      - name: Publish Android build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const signed = '${{ env.SIGNED_RELEASE }}' === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: signed ? 'kriptoaman/android-signed-release' : 'kriptoaman/android-preflight',
              description: succeeded
                ? (signed ? 'Platform + Wallet signed AAB/APK built successfully' : 'Platform + Wallet preflight AAB/APK built successfully')
                : (signed ? 'Dual-app signed Android release failed; inspect Actions' : 'Dual-app Android preflight failed; inspect Actions'),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });


  publish-android-release:
    name: Publish stable Android APK
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified signed KriptoAman APK
        uses: actions/download-artifact@v8
        with:
          name: kriptoaman-direct-apk
          path: dist

      - name: Verify and normalize release files
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find dist -type f -name '*.apk' -print -quit)"
          checksum="$(find dist -type f -name '*.sha256' -print -quit)"
          test -n "$apk"
          test -n "$checksum"
          expected="$(awk '{print $1}' "$checksum")"
          test "$expected" = "$(sha256sum "$apk" | awk '{print $1}')"
          cp "$apk" KriptoAman-1.5.6.apk
          sha256sum KriptoAman-1.5.6.apk > KriptoAman-1.5.6.apk.sha256

      - name: Publish immutable versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v1.5.6"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving immutable published release."
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease --jq '.'
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')" = "$tag"
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false"
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "false"
            echo "Existing immutable release verified; no overwrite or republish attempted."
            exit 0
          fi
          gh release create "$tag"             KriptoAman-1.5.6.apk             KriptoAman-1.5.6.apk.sha256             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "KriptoAman Android 1.5.6"             --notes "Signed KriptoAman Platform Android release. Package: com.kriptoaman.app. versionCode: 13. Verify the accompanying SHA-256 file before installation."
