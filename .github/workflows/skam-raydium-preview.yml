name: sKAM Raydium Liquidity Preview

on:
  pull_request:
    paths:
      - '.github/workflows/skam-raydium-preview.yml'
      - 'chain/solana-liquidity/add-raydium-liquidity.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chain/solana-liquidity
    env:
      RPC_URL: https://api.mainnet-beta.solana.com
      LIQUIDITY_QUOTE_UI: '0.005'
      MAX_LIQUIDITY_QUOTE_UI: '0.005'
      MIN_OPERATOR_SOL_RESERVE: '0.025'
      LIQUIDITY_FEE_BUFFER_SOL: '0.001'
      LIQUIDITY_SLIPPAGE_BPS: '100'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated Solana liquidity dependencies
        run: npm install --no-audit --no-fund
      - name: Parse preview script
        run: node --check add-raydium-liquidity.mjs
      - name: Run Raydium preview only
        run: |
          set -o pipefail
          mkdir -p artifacts
          node add-raydium-liquidity.mjs | tee artifacts/skam-raydium-preview.log
      - name: Verify no execution result exists
        run: |
          test ! -f artifacts/skam-liquidity-stage-result.json
          test -f artifacts/skam-liquidity-stage-preview.json
      - name: Upload non-secret preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: skam-raydium-preview
          path: |
            chain/solana-liquidity/artifacts/skam-liquidity-stage-preview.json
            chain/solana-liquidity/artifacts/skam-raydium-preview.log
          if-no-files-found: error
          retention-days: 30
