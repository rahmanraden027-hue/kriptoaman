name: sKAM Node Tooling

on:
  pull_request:
    paths:
      - 'chain/solana-liquidity/**'
      - 'src/lib/skamToken2022Builder.js'
      - 'src/lib/skamAuthorityRevocationBuilder.js'
      - 'src/components/skam/SKAMAuthorityRevokePanel.jsx'
      - 'src/pages/AdminSKAMLaunch.jsx'
      - 'src/pages/AdminSKAMLaunchV2.jsx'
      - 'src/pages.config.js'
      - 'tests/skam-mainnet-orchestrator.test.mjs'
      - 'tests/skam-phantom-authority-revoke.test.mjs'
      - '.github/workflows/skam-node-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-termux-compatible-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci --legacy-peer-deps

      - name: Install isolated Solana liquidity dependencies
        working-directory: chain/solana-liquidity
        run: npm install --no-audit --no-fund

      - name: Verify required JavaScript exports
        working-directory: chain/solana-liquidity
        run: |
          node --input-type=module <<'NODE'
          const web3 = await import('@solana/web3.js');
          const token = await import('@solana/spl-token');
          const metadata = await import('@solana/spl-token-metadata');
          const raydium = await import('@raydium-io/raydium-sdk-v2');
          for (const [name, value] of Object.entries({
            Connection: web3.Connection,
            Keypair: web3.Keypair,
            sendAndConfirmTransaction: web3.sendAndConfirmTransaction,
            TOKEN_2022_PROGRAM_ID: token.TOKEN_2022_PROGRAM_ID,
            ExtensionType: token.ExtensionType,
            getMintLen: token.getMintLen,
            createInitializeMetadataPointerInstruction: token.createInitializeMetadataPointerInstruction,
            createInitializeMintInstruction: token.createInitializeMintInstruction,
            createAssociatedTokenAccountInstruction: token.createAssociatedTokenAccountInstruction,
            createMintToCheckedInstruction: token.createMintToCheckedInstruction,
            createSetAuthorityInstruction: token.createSetAuthorityInstruction,
            AuthorityType: token.AuthorityType,
            createInitializeInstruction: metadata.createInitializeInstruction,
            pack: metadata.pack,
            Raydium: raydium.Raydium,
            Percent: raydium.Percent,
            TxVersion: raydium.TxVersion,
          })) {
            if (value == null) throw new Error(`Missing required export: ${name}`);
          }
          console.log('Required Node Solana/Token-2022/Raydium exports verified.');
          NODE

      - name: Compare browser Token-2022 instructions with official SPL encoders
        working-directory: chain/solana-liquidity
        run: |
          node verify-browser-token-builder.mjs
          node verify-browser-authority-revoke.mjs

      - name: Parse all operator scripts and browser builders
        run: |
          node --check src/lib/skamToken2022Builder.js
          node --check src/lib/skamAuthorityRevocationBuilder.js
          node --check chain/solana-liquidity/create-token-2022.mjs
          node --check chain/solana-liquidity/create-raydium-pool.mjs
          node --check chain/solana-liquidity/add-raydium-liquidity.mjs
          node --check chain/solana-liquidity/smoke-swap.mjs
          node --check chain/solana-liquidity/verify-dexscreener.mjs
          node --check chain/solana-liquidity/revoke-skam-authorities.mjs
          bash -n chain/solana-liquidity/launch-skam-mainnet.sh

      - name: Run sKAM regression tests
        run: |
          node --test tests/skam-mainnet-orchestrator.test.mjs
          node --test tests/skam-phantom-authority-revoke.test.mjs
