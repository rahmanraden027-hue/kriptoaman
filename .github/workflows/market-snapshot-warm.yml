name: Market Snapshot Warm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/api/market-snapshot.js'
      - 'functions/api/market-snapshot-page.js'
      - 'functions/api/market-quality.js'
      - 'scripts/check-market-health.mjs'
      - '.github/workflows/market-snapshot-warm.yml'
  schedule:
    # Staggered ten-minute cadence is intentionally retained. GitHub schedule
    # delivery can drift, so public UI separately distinguishes delayed data;
    # an active refresh must not be cancelled just to chase a tighter cadence.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: market-snapshot-warm-production
  cancel-in-progress: false

jobs:
  warm-market-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Warm KriptoAman market snapshot and ensure chunks
        shell: bash
        run: |
          set -euo pipefail

          # A push-triggered run is primarily a deployment/migration proof. The
          # snapshot itself is operationally fresh for 15 minutes, while the
          # recurring/manual warm gate keeps the stricter <=5 minute evidence.
          max_age_ms=300000
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            max_age_ms=900000
            sleep 35
          fi

          body="$(mktemp)"
          for attempt in 1 2 3 4; do
            code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              -H 'Cache-Control: no-cache' \
              -o "$body" -w '%{http_code}' \
              'https://kriptoaman.com/api/market-snapshot?health=1&refresh=1')"
            if [ "$code" = "200" ] && node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (p.chunkReady === undefined) process.exit(1)" "$body"; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Market snapshot warm endpoint did not expose the current chunk contract after retries."
              cat "$body"
              exit 1
            fi
            sleep $((attempt * 15))
          done

          node - "$body" "$max_age_ms" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const maxAgeMs = Number(process.argv[3]);
          if (!Number.isFinite(Number(payload.assetCount)) || Number(payload.assetCount) < 4500) {
            console.error(`Invalid market asset count: ${payload.assetCount}`);
            process.exit(1);
          }
          if (!Number.isFinite(Number(payload.capturedAt)) || Number(payload.capturedAt) <= 0) {
            console.error('Missing capturedAt');
            process.exit(1);
          }
          if (!Number.isFinite(Number(payload.ageMs)) || Number(payload.ageMs) > maxAgeMs) {
            console.error(`Market snapshot exceeds event freshness policy: ${payload.ageMs}ms > ${maxAgeMs}ms`);
            process.exit(1);
          }
          if (payload.healthy !== true) {
            console.error('Market snapshot endpoint reported unhealthy state');
            process.exit(1);
          }
          if (payload.chunkReady !== true) {
            console.error(`Market chunk coverage is not ready: ${JSON.stringify({ chunkCount: payload.chunkCount, expectedChunks: payload.expectedChunks, chunkBackfilled: payload.chunkBackfilled })}`);
            process.exit(1);
          }
          if (!Number.isFinite(Number(payload.chunkCount)) || Number(payload.chunkCount) < Number(payload.expectedChunks) || Number(payload.expectedChunks) < 45) {
            console.error(`Invalid market chunk coverage: ${payload.chunkCount}/${payload.expectedChunks}`);
            process.exit(1);
          }
          console.log(`Market snapshot verified: ${payload.assetCount} assets; source=${payload.source}; ageMs=${payload.ageMs}; maxAgeMs=${maxAgeMs}; chunks=${payload.chunkCount}/${payload.expectedChunks}; chunkBackfilled=${payload.chunkBackfilled}; refreshPerformed=${payload.refreshPerformed}`);
          NODE

      - name: Verify market data quality contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -o "$body" -w '%{http_code}' \
            "https://kriptoaman.com/api/market-quality?ts=$(date +%s)")"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const score = Number(payload.score);
          const assets = Number(payload.assetCount);
          if (!Number.isFinite(score) || score < 60) {
            console.error(`Market quality score below minimum integrity gate: ${payload.score}`);
            process.exit(1);
          }
          if (!Number.isFinite(assets) || assets < 4500) {
            console.error(`Market quality coverage below public minimum: ${payload.assetCount}`);
            process.exit(1);
          }
          if (payload.freshness?.veryStale === true || payload.status === 'stale') {
            console.error(`Market quality endpoint reports stale data: ${JSON.stringify(payload.freshness)}`);
            process.exit(1);
          }
          const anomalies = payload.anomalies || {};
          if (Number(anomalies.negativeMarketCaps || 0) > 0 || Number(anomalies.negativeVolumes || 0) > 0) {
            console.error(`Invalid negative market observations detected: ${JSON.stringify(anomalies)}`);
            process.exit(1);
          }
          console.log(`Market quality verified: score=${score}; status=${payload.status}; assets=${assets}; priceCompleteness=${payload.components?.priceCompletenessPct}%; volumeCompleteness=${payload.components?.volumeCompletenessPct}%; ageMs=${payload.ageMs}`);
          NODE

      - name: Verify paged market uses chunk delivery
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -o "$body" -w '%{http_code}' \
            'https://kriptoaman.com/api/market-snapshot-page?page=11&limit=300')"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(payload.data) || payload.data.length < 1 || payload.data.length > 300) process.exit(1);
          if (!Number.isFinite(Number(payload.totalAssets)) || Number(payload.totalAssets) < payload.data.length) process.exit(1);
          if (payload.delivery?.snapshotRead !== 'chunk-d1') {
            console.error(`Paged market is not using chunk delivery: ${payload.delivery?.snapshotRead}`);
            process.exit(1);
          }
          if (payload.delivery?.d1SessionRead !== true) {
            console.error('Paged market is not using the D1 Sessions-compatible path');
            process.exit(1);
          }
          console.log(`Paged market chunk delivery verified: ${payload.totalAssets} assets; chunksRead=${payload.delivery?.chunksRead}.`);
          NODE
