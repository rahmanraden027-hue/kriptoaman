name: Market Snapshot Warm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/api/market-snapshot.js'
      - 'functions/api/market-snapshot-page.js'
      - '.github/workflows/market-snapshot-warm.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  warm-market-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Warm KriptoAman market snapshot and ensure chunks
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --location --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            -o "$body" -w '%{http_code}' \
            'https://kriptoaman.com/api/market-snapshot?health=1&refresh=1')"
          if [ "$code" != "200" ]; then
            echo "Market snapshot warm endpoint returned HTTP $code"
            cat "$body"
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Number.isFinite(Number(payload.assetCount)) || Number(payload.assetCount) < 4500) {
            console.error(`Invalid market asset count: ${payload.assetCount}`);
            process.exit(1);
          }
          if (!Number.isFinite(Number(payload.capturedAt)) || Number(payload.capturedAt) <= 0) {
            console.error('Missing capturedAt');
            process.exit(1);
          }
          if (!Number.isFinite(Number(payload.ageMs)) || Number(payload.ageMs) > 5 * 60 * 1000) {
            console.error(`Market snapshot is not fresh after warm: ${payload.ageMs}ms`);
            process.exit(1);
          }
          if (payload.healthy !== true) {
            console.error('Market snapshot endpoint reported unhealthy state');
            process.exit(1);
          }
          if (payload.chunkReady !== true) {
            console.error(`Market chunk coverage is not ready: ${JSON.stringify({ chunkCount: payload.chunkCount, expectedChunks: payload.expectedChunks, chunkBackfilled: payload.chunkBackfilled })}`);
            process.exit(1);
          }
          if (!Number.isFinite(Number(payload.chunkCount)) || Number(payload.chunkCount) < Number(payload.expectedChunks) || Number(payload.expectedChunks) < 45) {
            console.error(`Invalid market chunk coverage: ${payload.chunkCount}/${payload.expectedChunks}`);
            process.exit(1);
          }
          console.log(`Market snapshot verified: ${payload.assetCount} assets; source=${payload.source}; ageMs=${payload.ageMs}; chunks=${payload.chunkCount}/${payload.expectedChunks}; chunkBackfilled=${payload.chunkBackfilled}; refreshPerformed=${payload.refreshPerformed}`);
          NODE

      - name: Verify paged market uses chunk delivery
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -o "$body" -w '%{http_code}' \
            'https://kriptoaman.com/api/market-snapshot-page?page=11&limit=300')"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(payload.data) || payload.data.length < 1 || payload.data.length > 300) process.exit(1);
          if (!Number.isFinite(Number(payload.totalAssets)) || Number(payload.totalAssets) < payload.data.length) process.exit(1);
          if (payload.delivery?.snapshotRead !== 'chunk-d1') {
            console.error(`Paged market is not using chunk delivery: ${payload.delivery?.snapshotRead}`);
            process.exit(1);
          }
          if (payload.delivery?.d1SessionRead !== true) {
            console.error('Paged market is not using the D1 Sessions-compatible path');
            process.exit(1);
          }
          console.log(`Paged market chunk delivery verified: ${payload.totalAssets} assets; chunksRead=${payload.delivery?.chunksRead}.`);
          NODE
