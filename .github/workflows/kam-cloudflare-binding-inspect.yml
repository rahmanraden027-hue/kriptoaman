name: KAM Cloudflare Binding Inspect

on:
  push:
    branches: [ops/kam-readonly-20260918]
    paths:
      - '.github/workflows/kam-cloudflare-binding-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect Worker binding names and types only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kam-mainnet-public-rpc"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/settings" -o /tmp/settings.json
          node - /tmp/settings.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!p.success) throw new Error(JSON.stringify(p.errors));
          const bindings=(p.result?.bindings||[]).map(b=>({name:b.name,type:b.type}));
          console.log(JSON.stringify({bindings},null,2));
          NODE
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/secrets" -o /tmp/secrets.json
          node - /tmp/secrets.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!p.success) throw new Error(JSON.stringify(p.errors));
          const secrets=(p.result||[]).map(s=>({name:s.name,type:s.type}));
          console.log(JSON.stringify({secrets},null,2));
          NODE
