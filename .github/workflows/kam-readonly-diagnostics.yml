name: KAM Readonly Diagnostics

on:
  push:
    branches: [ops/kam-readonly-20260918]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public KAM paths
        shell: bash
        run: |
          set +e
          show_get() {
            url="$1"
            echo "=== GET $url"
            code="$(curl -sS -o /tmp/body --connect-timeout 8 --max-time 15 -w '%{http_code}' "$url" || true)"
            echo "http=$code"
            head -c 800 /tmp/body 2>/dev/null || true
            echo
          }
          show_post() {
            url="$1"
            method="$2"
            echo "=== POST $url $method"
            code="$(curl -sS -o /tmp/body --connect-timeout 8 --max-time 15 -w '%{http_code}' -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":[]}" "$url" || true)"
            echo "http=$code"
            head -c 800 /tmp/body 2>/dev/null || true
            echo
          }
          show_get https://rpc.kriptoaman.com/health
          show_get https://rpc.kriptoaman.com/ready
          show_post https://rpc.kriptoaman.com eth_chainId
          show_post https://rpc.kriptoaman.com eth_blockNumber
          show_get https://explorer.kriptoaman.com/
          show_get https://explorer.kriptoaman.com/api/v2/blocks
          echo '=== recovery droplet public probes'
          show_get http://152.42.199.82/
          show_post http://152.42.199.82:8545 eth_chainId
          show_post http://152.42.199.82:8545 eth_blockNumber

  host:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 6
    steps:
      - name: Read-only host inventory
        shell: bash
        run: |
          set +e
          echo '=== host'
          hostname
          date -u
          uname -a
          echo '=== docker'
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          echo '=== blockscout compose'
          if [ -d /opt/blockscout/docker-compose ]; then
            cd /opt/blockscout/docker-compose
            docker compose ps || true
            docker compose ps --services || true
          else
            echo 'blockscout_dir=missing'
          fi
