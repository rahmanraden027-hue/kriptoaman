name: KAM RPC Transport Diagnostic

on:
  push:
    branches: [fix/kam-rpc-transport-diagnostic-20260918]
    paths:
      - 'chain/kam-mainnet/public-rpc-gateway/**'
      - '.github/workflows/kam-rpc-transport-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Deploy diagnostic build preserving recovery origin
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.134.0 deploy \
            --keep-vars \
            --var 'KAM_RPC_ORIGIN:http://152-42-199-82.sslip.io/rpc' \
            --message 'Temporary transport diagnostic for verified KAM recovery origin'
      - name: Capture Cloudflare edge transport classification
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS --max-time 30 https://rpc.kriptoaman.com/transport-diagnostic -o /tmp/transport.json
          cat /tmp/transport.json
          node - /tmp/transport.json <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!Array.isArray(p.checks) || p.checks.length < 5) process.exit(1);
          for (const x of p.checks) console.log(`${x.label}: ok=${x.ok} status=${x.status} durationMs=${x.durationMs} error=${x.errorName||''}:${x.errorMessage||''}`);
          NODE
