name: ZVQ Indexer Runner Read-Only Probe

on:
  pull_request:
    paths:
      - '.github/workflows/zvq-indexer-runner-readonly-probe.yml'
      - '.github/workflows/kriptoaman-first-party-indexer.yml'
      - 'services/kriptoaman-indexer/**'
      - 'scripts/deploy-kriptoaman-zvq-indexer.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zvq-indexer-runner-readonly-probe.yml'
      - '.github/workflows/kriptoaman-first-party-indexer.yml'
      - 'services/kriptoaman-indexer/**'
      - 'scripts/deploy-kriptoaman-zvq-indexer.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 6
    steps:
      - name: Prove private VPC JSON-RPC and WebSocket path
        shell: bash
        run: |
          set -euo pipefail
          rpc='http://10.104.0.2:8545'
          chain="$(curl -fsS --connect-timeout 4 --max-time 8 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$rpc" | jq -er '.result')"
          b1="$(curl -fsS --connect-timeout 4 --max-time 8 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' "$rpc" | jq -er '.result')"
          sleep 4
          b2="$(curl -fsS --connect-timeout 4 --max-time 8 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' "$rpc" | jq -er '.result')"
          test "$chain" = 0x560c
          test $((16#${b2#0x})) -gt $((16#${b1#0x}))

          node <<'NODE'
          const url = 'ws://10.104.0.2:8546';
          const timeout = setTimeout(() => { console.error('websocket_probe=timeout'); process.exit(2); }, 12000);
          const ws = new WebSocket(url);
          let subscription = null;
          ws.addEventListener('open', () => {
            ws.send(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_subscribe', params: ['newHeads'] }));
          });
          ws.addEventListener('message', (event) => {
            const payload = JSON.parse(String(event.data));
            if (payload?.id === 1 && typeof payload.result === 'string') {
              subscription = payload.result;
              return;
            }
            if (payload?.method === 'eth_subscription' && payload?.params?.subscription === subscription && payload?.params?.result?.number) {
              clearTimeout(timeout);
              console.log('websocket_subscription=true head=' + payload.params.result.number);
              ws.close();
              setTimeout(() => process.exit(0), 50);
            }
          });
          ws.addEventListener('error', () => {
            clearTimeout(timeout);
            console.error('websocket_probe=error');
            process.exit(3);
          });
          NODE

          echo "probe_mode=read_only_private_vpc"
          echo "chain_id=$chain block_1=$b1 block_2=$b2"
          echo "zvq_indexer_runner_readonly_probe=pass"
