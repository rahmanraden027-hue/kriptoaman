name: RPC Sentry Readonly Diagnosis

on:
  push:
    branches:
      - ops/rpc-sentry-diagnose-20260922
    paths:
      - '.github/workflows/rpc-sentry-readonly-diagnosis.yml'

permissions:
  contents: read

jobs:
  diagnose-rpc-sentry:
    runs-on: [self-hosted, linux, x64, kam-mainnet-evidence]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Inspect RPC sentry without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15 'bash -s' <<'REMOTE' > artifacts/rpc-sentry-diagnosis.txt
          set -u
          echo "hostname=$(hostname)"
          echo "time=$(date -u +%FT%TZ)"
          echo "--- uptime ---"
          uptime || true
          echo "--- service candidates ---"
          systemctl list-units --type=service --all --no-legend 2>/dev/null | grep -Ei 'besu|geth|erigon|nethermind|kam|zevaryq|rpc|nginx|caddy|haproxy' || true
          echo "--- listeners ---"
          ss -lntp 2>/dev/null | grep -E '(:22|:80|:443|:8545|:8546|:8648|:30303|:9545)' || true
          echo "--- docker containers ---"
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null || true
          echo "--- process candidates ---"
          ps -eo pid,comm,args --sort=comm | grep -Ei 'besu|geth|erigon|nethermind|nginx|caddy|haproxy' | grep -v grep || true
          echo "--- common paths ---"
          for p in /opt/kam /opt/zevaryq /opt/besu /var/lib/besu /etc/besu /etc/nginx /etc/caddy; do
            if [ -e "$p" ]; then
              stat -c '%F %a %U:%G %n' "$p" 2>/dev/null || true
            fi
          done
          echo "--- localhost RPC probes ---"
          for port in 8545 8648 9545; do
            printf 'port_%s=' "$port"
            curl -sS --connect-timeout 2 --max-time 5 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "http://127.0.0.1:$port" 2>/dev/null || echo unavailable
          done
          REMOTE
          sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[redacted-ip]/g' artifacts/rpc-sentry-diagnosis.txt > artifacts/rpc-sentry-diagnosis-redacted.txt
          rm artifacts/rpc-sentry-diagnosis.txt
          cat artifacts/rpc-sentry-diagnosis-redacted.txt
      - name: Upload sanitized diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-sentry-readonly-diagnosis
          path: artifacts/rpc-sentry-diagnosis-redacted.txt
          if-no-files-found: error
          retention-days: 7
