name: Temporary Global Markets Preview Smoke

on:
  push:
    branches:
      - fix/global-markets-resilience-20260918
    paths:
      - '.github/workflows/tmp-preview-global-markets-smoke.yml'
      - 'functions/api/global-markets.js'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Frankfurter reference source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 'https://api.frankfurter.dev/v2/rates?base=usd&quotes=eur,gbp,jpy,chf,aud,cad,nzd,xau' -o /tmp/frankfurter.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/frankfurter.json'))
          assert isinstance(d,list)
          quotes={str(x.get('quote','')).upper() for x in d}
          required={'EUR','GBP','JPY','CHF','AUD','CAD','NZD','XAU'}
          assert required <= quotes, (required-quotes)
          print('frankfurter_quotes_verified=',len(quotes))
          PY
      - name: Verify deployed Cloudflare branch preview API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fix-global-markets-resilienc.kriptoaman.pages.dev/api/global-markets?preview-smoke=1'
          for i in 1 2 3 4 5; do
            code="$(curl -sS -L --max-time 20 -H 'Accept: application/json' -H 'Cache-Control: no-cache' -o /tmp/global.json -w '%{http_code}' "$URL" || true)"
            echo "attempt=$i http=$code"
            if [ "$code" = 200 ]; then break; fi
            sleep 10
          done
          test "$code" = 200
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/global.json'))
          req={'EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','USD/CAD','NZD/USD','XAU/USD'}
          items=d.get('instruments') or []
          got={x.get('symbol') for x in items if isinstance(x,dict)}
          assert req <= got, req-got
          assert d.get('providerMode') in {'professional','fallback-reference'}
          assert d.get('marketUse')=='information-only'
          for x in items:
            if x.get('symbol') in req:
              assert float(x.get('price') or 0)>0
          print('provider=',d.get('provider'),'mode=',d.get('providerMode'),'instruments=',len(items))
          PY
