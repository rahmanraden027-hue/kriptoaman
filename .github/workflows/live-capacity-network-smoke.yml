name: Live Capacity & Network Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-capacity-network-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 35

      - name: Verify live market snapshot capacity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 40 \
              'https://kriptoaman.com/api/market-snapshot?health=1' -o /tmp/market.json; then
              if node -e "const p=require('/tmp/market.json'); if(Number(p.assetCount)<4500) process.exit(2); console.log('assetCount=',p.assetCount,'source=',p.source,'healthy=',p.healthy);"; then
                break
              fi
            fi
            if [ "$attempt" = 5 ]; then
              echo 'Live market snapshot did not reach 4,500 verified assets.' >&2
              cat /tmp/market.json 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done

      - name: Verify live multi-chain coverage
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Multi-chain live verification attempt ${attempt}/4"
            if curl --fail --silent --show-error --max-time 45 \
              "https://kriptoaman.com/api/network-health?refresh=1&attempt=${attempt}" \
              -o /tmp/networks.json; then
              if node <<'NODE'
          const p = require('/tmp/networks.json');
          const online = Number(p?.summary?.online || 0);
          const total = Number(p?.summary?.total || 0);
          const target = Number(p?.summary?.minimum_active_target || 12);
          const degraded = Number(p?.summary?.degraded || 0);
          console.log('online=', online, 'degraded=', degraded, 'total=', total, 'target=', target, 'checked_at=', p?.checked_at);
          console.log('active=', (p.networks || []).filter(n => n.status === 'online').map(n => n.name).join(', '));
          const unavailable = (p.networks || [])
            .filter(n => n.status !== 'online')
            .map(n => `${n.name}:${n.status}:${(n.providers_tried || []).map(x => `${x.provider}/${x.reason}`).join('|') || 'no-provider-detail'}`);
          if (unavailable.length) console.log('unavailable=', unavailable.join(', '));
          if (target !== 12) throw new Error(`unexpected minimum target ${target}`);
          if (online < 12) process.exit(2);
          NODE
              then
                echo 'Multi-chain minimum target satisfied.'
                exit 0
              fi
            fi

            if [ "$attempt" = 4 ]; then
              echo 'Live multi-chain coverage remained below 12 verified networks after four fresh probes.' >&2
              cat /tmp/networks.json 2>/dev/null || true
              exit 1
            fi
            sleep $((attempt * 5))
          done
