name: KAM Mainnet 24x7 Read-Only Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: kam-mainnet-24x7-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify KriptoAman network-status contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://kriptoaman.com/api/kam/network-status' -o /tmp/kam-status.json
          node <<'NODE'
          const p = require('/tmp/kam-status.json');
          console.log('status=', p.status, 'live=', p.live, 'verified=', p.verified, 'chainId=', p.chainId, 'block=', p.blockNumber, 'checkedAt=', p.checkedAt);
          if (Number(p.chainId) !== 22028) process.exit(2);
          if (String(p.chainIdHex).toLowerCase() !== '0x560c') process.exit(3);
          if (p.rpcUrl !== 'https://rpc.kriptoaman.com') process.exit(4);
          if (p.explorerUrl !== 'https://explorer.kriptoaman.com') process.exit(5);
          if (p.live !== true || p.verified !== true) process.exit(6);
          if (!Number.isInteger(Number(p.blockNumber)) || Number(p.blockNumber) < 0) process.exit(7);
          NODE

      - name: Verify public RPC chain ID and block progress
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://rpc.kriptoaman.com'
          rpc() {
            curl --fail --silent --show-error --max-time 15 \
              -H 'Content-Type: application/json' \
              --data "$1" "$RPC"
          }

          CHAIN=$(rpc '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | jq -r '.result // empty')
          test "${CHAIN,,}" = '0x560c'

          B1_HEX=$(rpc '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":2}' | jq -r '.result // empty')
          test -n "$B1_HEX"
          B1=$((16#${B1_HEX#0x}))
          sleep 15
          B2_HEX=$(rpc '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":3}' | jq -r '.result // empty')
          test -n "$B2_HEX"
          B2=$((16#${B2_HEX#0x}))

          echo "KAM_CHAIN_ID=$CHAIN"
          echo "KAM_BLOCK_START=$B1"
          echo "KAM_BLOCK_END=$B2"
          if (( B2 <= B1 )); then
            echo 'KAM block height did not advance during the observation window.' >&2
            exit 8
          fi

      - name: Probe explorer availability
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            'https://explorer.kriptoaman.com/' || true)
          echo "KAM_EXPLORER_HTTP=$code"
          case "$code" in
            200|301|302|307|308) ;;
            *) echo 'Explorer is not currently reachable; RPC verification remains the authoritative chain check.' ;;
          esac
