name: ZEVARYQ RPC and Explorer 24x7 Verified Monitor

on:
  pull_request:
    paths:
      - '.github/workflows/kam-mainnet-24x7-monitor.yml'
      - 'scripts/assess-zevaryq-public-proof.mjs'
      - 'tests/zevaryq-public-proof.test.mjs'
      - 'tests/zvq-monitor-evidence.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: kam-mainnet-24x7-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify public-monitor policy unit tests
        run: node --test tests/zevaryq-public-proof.test.mjs tests/zvq-monitor-evidence.test.mjs

      - name: Verify KriptoAman network-status contract
        id: status_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --silent --show-error --max-time 20 \
            'https://kriptoaman.com/api/kam/network-status' -o artifacts/kam-network-status.json
          node <<'NODE'
          const p = require('./artifacts/kam-network-status.json');
          console.log('status=', p.status, 'live=', p.live, 'verified=', p.verified, 'chainId=', p.chainId, 'block=', p.blockNumber, 'checkedAt=', p.checkedAt);
          if (Number(p.chainId) !== 22028) process.exit(2);
          if (String(p.chainIdHex).toLowerCase() !== '0x560c') process.exit(3);
          if (p.rpcUrl !== 'https://rpc.kriptoaman.com') process.exit(4);
          if (p.explorerUrl !== 'https://explorer.kriptoaman.com') process.exit(5);
          if (p.live !== true || p.verified !== true) process.exit(6);
          if (!Number.isInteger(Number(p.blockNumber)) || Number(p.blockNumber) < 0) process.exit(7);
          NODE

      - name: Run independent public RPC and Explorer proof
        id: public_proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Preserve the original strict gateway report as immutable evidence.
          # In DNS-only mode, GET /health and /ready may correctly be 404 even
          # while POST / and Blockscout are fully operational.
          node chain/kam-mainnet/scripts/verify-public-endpoints.mjs \
            > artifacts/kam-mainnet-24x7-audit.json || audit_status=$?
          node scripts/assess-zevaryq-public-proof.mjs \
            artifacts/kam-mainnet-24x7-audit.json | tee artifacts/zevaryq-public-proof.json

      - name: Upload KAM monitoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-mainnet-24x7-audit
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30

      # A degraded public status must stay an alert, but it must not suppress
      # the independent chain/Explorer probe or its diagnostic artifact.
      - name: Enforce both public health contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.status_contract.outcome }}" != success ]]; then
            echo '::error::The public network-status endpoint is degraded or violates its contract.'
          fi
          if [[ "${{ steps.public_proof.outcome }}" != success ]]; then
            echo '::error::The independent RPC and Explorer proof failed.'
          fi
          [[ "${{ steps.status_contract.outcome }}" == success ]]
          [[ "${{ steps.public_proof.outcome }}" == success ]]
