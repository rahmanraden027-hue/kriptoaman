name: KAM Mainnet 24x7 Read-Only Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: kam-mainnet-24x7-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify KriptoAman network-status contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://kriptoaman.com/api/kam/network-status' -o /tmp/kam-status.json
          node <<'NODE'
          const p = require('/tmp/kam-status.json');
          console.log('status=', p.status, 'live=', p.live, 'verified=', p.verified, 'chainId=', p.chainId, 'block=', p.blockNumber, 'checkedAt=', p.checkedAt);
          if (Number(p.chainId) !== 22028) process.exit(2);
          if (String(p.chainIdHex).toLowerCase() !== '0x560c') process.exit(3);
          if (p.rpcUrl !== 'https://rpc.kriptoaman.com') process.exit(4);
          if (p.explorerUrl !== 'https://explorer.kriptoaman.com') process.exit(5);
          if (p.live !== true || p.verified !== true) process.exit(6);
          if (!Number.isInteger(Number(p.blockNumber)) || Number(p.blockNumber) < 0) process.exit(7);
          NODE

      - name: Run full public RPC and explorer security audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node chain/kam-mainnet/scripts/verify-public-endpoints.mjs \
            2>&1 | tee artifacts/kam-mainnet-24x7-audit.json

      - name: Upload KAM monitoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-mainnet-24x7-audit
          path: artifacts/kam-mainnet-24x7-audit.json
          if-no-files-found: error
          retention-days: 30
