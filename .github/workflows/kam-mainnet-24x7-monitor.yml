name: KAM Mainnet 24x7 Read-Only Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: kam-mainnet-24x7-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare monitoring evidence directory
        shell: bash
        run: mkdir -p artifacts

      - name: Verify KriptoAman network-status contract
        id: network_status
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://kriptoaman.com/api/kam/network-status' \
            -o artifacts/kam-network-status.json
          node <<'NODE'
          const p = require('./artifacts/kam-network-status.json');
          console.log('status=', p.status, 'live=', p.live, 'verified=', p.verified, 'chainId=', p.chainId, 'block=', p.blockNumber, 'checkedAt=', p.checkedAt);
          if (Number(p.chainId) !== 22028) process.exit(2);
          if (String(p.chainIdHex).toLowerCase() !== '0x560c') process.exit(3);
          if (p.rpcUrl !== 'https://rpc.kriptoaman.com') process.exit(4);
          if (p.explorerUrl !== 'https://explorer.kriptoaman.com') process.exit(5);
          if (p.live !== true || p.verified !== true) process.exit(6);
          if (!Number.isInteger(Number(p.blockNumber)) || Number(p.blockNumber) < 0) process.exit(7);
          NODE

      - name: Run full public RPC and explorer security audit
        id: public_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node chain/kam-mainnet/scripts/verify-public-endpoints.mjs \
            2>&1 | tee artifacts/kam-mainnet-24x7-audit.json

      - name: Upload KAM monitoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-mainnet-24x7-audit
          path: |
            artifacts/kam-network-status.json
            artifacts/kam-mainnet-24x7-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail monitor when a verification failed
        if: always()
        shell: bash
        env:
          NETWORK_STATUS_OUTCOME: ${{ steps.network_status.outcome }}
          PUBLIC_AUDIT_OUTCOME: ${{ steps.public_audit.outcome }}
        run: |
          set -euo pipefail
          echo "network_status_outcome=$NETWORK_STATUS_OUTCOME"
          echo "public_audit_outcome=$PUBLIC_AUDIT_OUTCOME"
          if [[ "$NETWORK_STATUS_OUTCOME" != "success" || "$PUBLIC_AUDIT_OUTCOME" != "success" ]]; then
            exit 1
          fi
