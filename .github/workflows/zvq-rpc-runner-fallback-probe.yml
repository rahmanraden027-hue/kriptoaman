name: ZVQ RPC Explorer Runner Probe

on:
  pull_request:
    paths:
      - '.github/workflows/zvq-rpc-runner-fallback-probe.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zvq-rpc-runner-fallback-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 6
    steps:
      - name: Read-only SSH probe to RPC sentry
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new)
          host=root@206.189.36.15
          ssh "${ssh_opts[@]}" "$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "probe_mode=read_only"
          hostname
          nginx -t
          upstream=$(python3 - <<'PY'
          import re
          p='/etc/nginx/sites-enabled/zevaryq-rpc'
          text=open(p,encoding='utf-8').read()
          m=re.findall(r'^\s*proxy_pass\s+(http://10(?:\.\d{1,3}){3}/rpc);\s*$',text,re.M)
          if len(m)!=1: raise SystemExit(1)
          print(m[0])
          PY
          )
          chain=$(curl -fsS --connect-timeout 4 --max-time 10 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$upstream" | jq -er '.result')
          block=$(curl -fsS --connect-timeout 4 --max-time 10 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' "$upstream" | jq -er '.result')
          test "$chain" = 0x560c
          echo "chain_id=$chain block=$block"
          echo "explorer_runner_probe=pass"
          REMOTE
