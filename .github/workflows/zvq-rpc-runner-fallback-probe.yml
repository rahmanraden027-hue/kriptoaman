name: ZVQ RPC Explorer Runner Probe

on:
  pull_request:
    paths:
      - '.github/workflows/zvq-rpc-runner-fallback-probe.yml'
      - 'services/kriptoaman-indexer/**'
      - 'scripts/zvq-rpc-allowlist-gateway.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zvq-rpc-runner-fallback-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 6
    steps:
      - name: Read-only direct HTTPS probe to RPC sentry
        shell: bash
        run: |
          set -euo pipefail
          origin='https://rpc.kriptoaman.com/'
          resolve='rpc.kriptoaman.com:443:206.189.36.15'
          headers=(-H 'Content-Type: application/json' -H 'Origin: https://explorer.kriptoaman.com')

          chain=$(curl --noproxy '*' -fsS --connect-timeout 5 --max-time 15 \
            --resolve "$resolve" "${headers[@]}" \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$origin" | jq -er '.result')

          block=$(curl --noproxy '*' -fsS --connect-timeout 5 --max-time 15 \
            --resolve "$resolve" "${headers[@]}" \
            --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' "$origin" | jq -er '.result')

          test "$chain" = 0x560c
          [[ "$block" =~ ^0x[0-9a-fA-F]+$ ]]

          echo "probe_mode=read_only_direct_https"
          echo "chain_id=$chain block=$block"
          echo "explorer_runner_probe=pass"

      - name: Prove private VPC RPC and WebSocket reachability
        shell: bash
        run: |
          set -euo pipefail
          private_rpc='10.104.0.2'
          timeout 4 bash -c "cat < /dev/null > /dev/tcp/$private_rpc/8545"
          timeout 4 bash -c "cat < /dev/null > /dev/tcp/$private_rpc/8546"
          chain="$(curl --noproxy '*' -fsS --connect-timeout 4 --max-time 8 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            "http://$private_rpc:8545" | jq -er '.result')"
          test "$chain" = 0x560c
          echo "private_rpc_chain=$chain"
          echo "private_rpc_http=reachable"
          echo "private_rpc_websocket_tcp=reachable"
