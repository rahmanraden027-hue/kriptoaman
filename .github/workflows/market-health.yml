name: Market health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-health-production
  cancel-in-progress: true

jobs:
  verify-production-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify 2,001+ assets and snapshot freshness
        run: node scripts/check-market-health.mjs
