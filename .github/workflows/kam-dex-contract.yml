name: KAM DEX Contract

on:
  pull_request:
    paths:
      - 'chain/kam-mainnet/trading/dex/**'
      - 'chain/kam-mainnet/trading/test/KAMDEX.t.sol'
      - 'chain/kam-mainnet/trading/test/MockToken.sol'
      - 'chain/kam-mainnet/trading/foundry.toml'
      - '.github/workflows/kam-dex-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chain/kam-mainnet/trading
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format check
        run: forge fmt --check
      - name: Build Paris-compatible bytecode
        run: forge build --sizes --evm-version paris
      - name: DEX tests
        run: forge test --match-path test/KAMDEX.t.sol -vvv --evm-version paris
      - name: Ensure CI has no deployer secret
        run: test -z "${DEPLOYER_PRIVATE_KEY:-}"
