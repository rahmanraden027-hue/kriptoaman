name: KriptoAman Direct Static Preview

on:
  push:
    branches:
      - ops/kriptoaman-direct-preview-20260922
    paths:
      - '.github/workflows/kriptoaman-direct-static-preview.yml'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build latest reviewed web UI
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --legacy-peer-deps
          npm run build
          test -s dist/index.html
      - name: Publish isolated static preview on port 8080
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -s <<'ROOT'
          set -Eeuo pipefail
          name=kriptoaman-direct-preview
          root=/opt/kriptoaman-direct-preview
          mkdir -p "$root/site"
          rm -rf "$root/site"/*
          cp -a "$GITHUB_WORKSPACE/dist/." "$root/site/"
          cat > "$root/default.conf" <<'NGINX'
          server {
            listen 80 default_server;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location / {
              try_files $uri $uri/ /index.html;
            }
            location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
              try_files $uri =404;
              expires 5m;
              add_header Cache-Control "public, max-age=300";
            }
          }
          NGINX
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" --restart unless-stopped             -p 8080:80             -v "$root/site:/usr/share/nginx/html:ro"             -v "$root/default.conf:/etc/nginx/conf.d/default.conf:ro"             nginx:alpine
          ROOT
      - name: Verify local and direct-IP rendering
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 2
          local_code="$(curl -sS --connect-timeout 3 --max-time 10 -o /tmp/ka-local.html -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "local_http=$local_code"
          test "$local_code" = "200"
          grep -qi '<div id="root"' /tmp/ka-local.html
          public_code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ka-public.html -w '%{http_code}' http://146.190.93.254:8080/ || true)"
          echo "direct_ip_http=$public_code"
