name: ZEVARYQ Public Routing Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zevaryq-public-routing-inventory.yml'

permissions:
  contents: read

jobs:
  cloudflare-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read current Explorer zone, Worker routes and DNS without changing anything
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_API_TOKEN:-}" ]]; then
            echo "cloudflare_inventory=credentials_unavailable"; exit 0
          fi
          echo "::add-mask::${CF_API_TOKEN}"
          zones="$(curl -fsS --get 'https://api.cloudflare.com/client/v4/zones' -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json' --data-urlencode 'name=kriptoaman.com' --data-urlencode "account.id=${CF_ACCOUNT_ID}")"
          zone_id="$(jq -er '.result | if length == 1 then .[0].id else empty end' <<<"${zones}")"
          echo "::add-mask::${zone_id}"
          routes="$(curl -fsS "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json')"
          echo "EXPLORER_WORKER_ROUTES:"
          jq -r '.result[] | select(.pattern | startswith("explorer.kriptoaman.com")) | [.pattern, (.script // "<none>")] | @tsv' <<<"${routes}"
          dns="$(curl -fsS --get "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Accept: application/json' --data-urlencode 'per_page=100')"
          echo "EXPLORER_DNS_RECORDS:"
          jq -r '.result[] | select(.name == "explorer.kriptoaman.com" or .name == "explorer-new.kriptoaman.com") | [.name,.type,.content,(.proxied|tostring)] | @tsv' <<<"${dns}"
          echo "cloudflare_inventory=read_only_completed"

  routing-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public and prior cutover upstream without cache-busting false positives
        shell: bash
        run: |
          set -uo pipefail
          for host in explorer.kriptoaman.com explorer-new.kriptoaman.com; do
            for path in / /api/v2/blocks; do
              h="$(mktemp)"; b="$(mktemp)"
              code="$(curl -LsS --connect-timeout 7 --max-time 20 -D "$h" -o "$b" -w '%{http_code}' "https://${host}${path}" || true)"
              version="$(grep -o 'data-zevaryq-explorer-version="[^"]*"' "$b" | head -1 || true)"
              old="$(grep -o 'data-zevaryq-explorer-version="1.0.0"' "$b" | head -1 || true)"
              zvq=0; grep -Fq 'class="logo logo-zvq"' "$b" && zvq=1 || true
              echo "${host}${path}: http=${code} version=${version:-none} zvq=${zvq} legacy=${old:-none}"
              grep -iE '^(cache-control|age|cf-cache-status|x-kam-explorer-origin|x-kam-explorer-cutover|server|location):' "$h" || true
              rm -f "$h" "$b"
            done
          done
          echo "routing_probes=read_only_completed"
