name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare non-breaking dependency remediation
        shell: bash
        run: |
          npm audit fix --omit=dev --package-lock-only --legacy-peer-deps || true
          npm ci --legacy-peer-deps

      - name: Persist remediated lockfile on PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already reflects the verified dependency remediation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: apply verified dependency security lockfile'
          git push origin HEAD:${{ github.head_ref }}

      - name: Security regression tests
        run: npm run test

      - name: Lint release-critical security surfaces
        run: >-
          npx eslint server/auth/*.js functions/api/auth/*.js functions/api/market-snapshot.js
          functions/api/auth/google/*.js src/lib/kriptoAuth.js src/lib/AuthContext.jsx
          src/api/base44Client.js src/Layout.jsx src/pages.config.js src/main.jsx
          src/pages/Login.jsx src/pages/Register.jsx src/pages/ForgotPassword.jsx src/pages/ResetPassword.jsx
          src/pages/Home.jsx src/pages/Market.jsx src/pages/Wallet.jsx src/pages/SecurityHub.jsx
          src/pages/KYC.jsx src/pages/Settings.jsx src/pages/PortfolioOverview.jsx
          src/components/security/TOTP2FA.jsx src/components/market/useLivePrices.jsx
          src/components/home/useCoinMarkets.js src/components/LanguageSwitcher.jsx
          src/lib/LanguageContext.jsx src/components/pwa/PWAInstallPrompt.jsx
          scripts/check-market-health.mjs scripts/check-system-health.mjs public/sw.js --quiet

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify no private keys are committed
        shell: bash
        run: |
          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!package-lock.json'; then
            echo 'Private key material detected in tracked files.' >&2
            exit 1
          fi

      - name: Verify security headers contract
        shell: bash
        run: |
          grep -q 'Strict-Transport-Security' public/_headers
          grep -q 'Content-Security-Policy' public/_headers
          grep -q "frame-ancestors 'none'" public/_headers
          grep -q 'X-Frame-Options: DENY' public/_headers
