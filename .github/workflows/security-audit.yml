name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Security regression tests
        run: npm run test

      - name: Lint release-critical security surfaces
        run: >-
          npx eslint server/auth/*.js functions/api/auth/*.js functions/api/market-snapshot.js
          functions/api/auth/google/*.js src/lib/kriptoAuth.js src/lib/AuthContext.jsx
          src/api/base44Client.js src/Layout.jsx src/pages.config.js src/main.jsx
          src/pages/Login.jsx src/pages/Register.jsx src/pages/ForgotPassword.jsx src/pages/ResetPassword.jsx
          src/pages/Home.jsx src/pages/Market.jsx src/pages/Wallet.jsx src/pages/SecurityHub.jsx
          src/pages/KYC.jsx src/pages/Settings.jsx src/pages/PortfolioOverview.jsx
          src/components/security/TOTP2FA.jsx src/components/market/useLivePrices.jsx
          src/components/home/useCoinMarkets.js src/components/LanguageSwitcher.jsx
          src/lib/LanguageContext.jsx src/components/pwa/PWAInstallPrompt.jsx
          scripts/audit-production-deps.mjs scripts/check-market-health.mjs scripts/check-system-health.mjs public/sw.js --quiet

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: node scripts/audit-production-deps.mjs

      - name: Verify no private keys are committed
        shell: bash
        run: |
          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!package-lock.json'; then
            echo 'Private key material detected in tracked files.' >&2
            exit 1
          fi

      - name: Verify secret files and signing material are not tracked
        shell: bash
        run: |
          bad_files="$(git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(jks|keystore|p12|pfx|pem|key)$)' || true)"
          if [ -n "$bad_files" ]; then
            echo 'Sensitive file type detected in tracked files:' >&2
            echo "$bad_files" >&2
            exit 1
          fi

      - name: Verify API cross-origin write protection
        shell: bash
        run: |
          grep -q "SAFE_METHODS" functions/api/_middleware.js
          grep -q "Cross-origin request blocked" functions/api/_middleware.js
          grep -q "capacitor://localhost" functions/api/_middleware.js
          grep -q "TRACE" functions/api/_middleware.js
          grep -q "TRACK" functions/api/_middleware.js
          grep -q "CONNECT" functions/api/_middleware.js

      - name: Verify security headers contract
        shell: bash
        run: |
          grep -q 'Strict-Transport-Security' public/_headers
          grep -q 'Content-Security-Policy' public/_headers
          grep -q "frame-ancestors 'none'" public/_headers
          grep -q 'X-Frame-Options: DENY' public/_headers
          grep -q 'X-Content-Type-Options: nosniff' public/_headers
          grep -q 'Permissions-Policy:' public/_headers
          if grep -q "'unsafe-eval'" public/_headers; then
            echo "CSP must not enable unsafe-eval." >&2
            exit 1
          fi

      - name: Verify KAM protected network profile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('chain/kam-mainnet/network-profile.json', 'utf8'));
          const expected = {
            status: 'mainnet-candidate-not-public',
            candidateChainId: 22028,
            candidateChainIdHex: '0x560c',
            consensus: 'QBFT',
            validatorCount: 4,
            blockPeriodSeconds: 3,
            rpcTarget: 'https://rpc.kriptoaman.com',
            explorerTarget: 'https://explorer.kriptoaman.com',
            reuseTestnetKeys: false,
            publicRpcDirectValidatorExposure: false,
            commercialLaunchEnabled: false,
          };
          const changed = Object.entries(expected).filter(([key, value]) => p[key] !== value);
          if (changed.length) {
            console.error('Protected KAM network profile changed:', changed);
            process.exit(1);
          }
          console.log('KAM protected network profile unchanged.');
          NODE

      - name: Publish production security status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION='Production security and KAM integrity gate passed'
          else
            STATE=failure
            DESCRIPTION='Production security or KAM integrity gate failed'
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"kriptoaman/production-security\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
