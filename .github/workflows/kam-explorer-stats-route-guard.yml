name: KAM Explorer Stats Route Guard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'explorer-dashboard/stats.html'
      - 'scripts/deploy-kam-explorer-v2.sh'
      - 'explorer-seo/**'
      - 'scripts/apply-kam-explorer-seo.sh'
      - 'tests/kam-explorer-seo-indexing.test.mjs'
      - '.github/workflows/kam-explorer-stats-route-guard.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: kam-explorer-stats-route-guard
  cancel-in-progress: false

jobs:
  verify-and-heal-stats-route:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate SEO guard source
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/apply-kam-explorer-seo.sh
          node --test tests/kam-explorer-seo-indexing.test.mjs

      - name: Probe canonical KAM statistics route
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          HEADERS="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS"' EXIT

          probe_url="https://explorer.kriptoaman.com/stats?route_guard=$(date +%s)"
          healthy=true

          if ! curl -L -fsS \
            -H 'Cache-Control: no-cache, no-store' \
            -H 'Pragma: no-cache' \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 25 \
            -D "$HEADERS" -o "$BODY" "$probe_url"; then
            healthy=false
          fi

          if ! grep -Fq 'data-kam-stats-version="2.0.0"' "$BODY"; then healthy=false; fi
          if grep -Fq 'Placeholder Counter' "$BODY"; then healthy=false; fi
          if grep -Eqi 'amount in ETH|>ETH<' "$BODY"; then healthy=false; fi
          if ! grep -Eqi '^x-kam-explorer-stats-version: *2' "$HEADERS"; then healthy=false; fi

          TX_JSON="$(mktemp)"
          BLOCKS_JSON="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS" "$TX_JSON" "$BLOCKS_JSON"' EXIT
          if ! curl -fsS --max-time 20 'https://explorer.kriptoaman.com/api/v2/transactions' -o "$TX_JSON"; then healthy=false; fi
          if ! curl -fsS --max-time 20 'https://explorer.kriptoaman.com/api/v2/blocks' -o "$BLOCKS_JSON"; then healthy=false; fi
          TX="$(python3 - "$TX_JSON" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1], encoding='utf-8')); items=d.get('items',[])
              print((items[0].get('hash') or '') if items else '')
          except Exception:
              print('')
          PY
          )"
          BLOCK="$(python3 - "$BLOCKS_JSON" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1], encoding='utf-8')); items=d.get('items',[])
              print(items[0].get('height','') if items else '')
          except Exception:
              print('')
          PY
          )"
          ADDRESS="$(python3 - "$BLOCKS_JSON" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1], encoding='utf-8')); items=d.get('items',[])
              print((((items[0].get('miner') or {}).get('hash')) or '') if items else '')
          except Exception:
              print('')
          PY
          )"
          probe_detail() {
            local label="$1" path="$2"
            if [ -z "$path" ]; then
              echo "${label}=unavailable_no_indexed_source"
              healthy=false
              return
            fi
            local code
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://explorer.kriptoaman.com$path" || true)"
            echo "${label}_http=$code"
            if [ "$code" != '200' ]; then healthy=false; fi
          }
          probe_detail transaction_detail "/tx/$TX"
          probe_detail block_detail "/block/$BLOCK"
          probe_detail address_detail "/address/$ADDRESS"

          if [[ "$healthy" == "true" ]]; then
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            echo 'stats_route=healthy'
          else
            echo 'drift=true' >> "$GITHUB_OUTPUT"
            echo 'stats_route=drift_detected'
            echo '--- headers ---'
            cat "$HEADERS" || true
            echo '--- first public body lines ---'
            sed -n '1,80p' "$BODY" || true
          fi

      - name: Re-apply reviewed Explorer routes when drift is detected
        if: ${{ steps.probe.outputs.drift == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-kam-explorer-v2.sh
          bash scripts/deploy-kam-explorer-v2.sh

      - name: Verify dynamic detail routes after drift healing
        shell: bash
        run: |
          set -euo pipefail
          TX_JSON="$(mktemp)"
          BLOCKS_JSON="$(mktemp)"
          trap 'rm -f "$TX_JSON" "$BLOCKS_JSON"' EXIT
          curl -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20             'https://explorer.kriptoaman.com/api/v2/transactions' -o "$TX_JSON"
          curl -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20             'https://explorer.kriptoaman.com/api/v2/blocks' -o "$BLOCKS_JSON"
          TX="$(python3 - "$TX_JSON" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding='utf-8')); items=d.get('items',[])
          print((items[0].get('hash') or '') if items else '')
          PY
          )"
          BLOCK="$(python3 - "$BLOCKS_JSON" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding='utf-8')); items=d.get('items',[])
          print(items[0].get('height','') if items else '')
          PY
          )"
          ADDRESS="$(python3 - "$BLOCKS_JSON" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding='utf-8')); items=d.get('items',[])
          print((((items[0].get('miner') or {}).get('hash')) or '') if items else '')
          PY
          )"
          test -n "$TX" && test -n "$BLOCK" && test -n "$ADDRESS"
          curl -L -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20 "https://explorer.kriptoaman.com/tx/$TX" >/dev/null
          curl -L -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20 "https://explorer.kriptoaman.com/block/$BLOCK" >/dev/null
          curl -L -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20 "https://explorer.kriptoaman.com/address/$ADDRESS" >/dev/null
          echo 'dynamic_detail_routes=healthy'

      - name: Probe Explorer canonical indexing signals
        id: seo_probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          healthy=true

          if ! curl -L -fsS --max-time 25 -o "$BODY" 'https://explorer.kriptoaman.com/stats'; then
            healthy=false
          fi
          if ! grep -Fq '<link rel="canonical" href="https://explorer.kriptoaman.com/stats" />' "$BODY"; then healthy=false; fi
          if ! grep -Fq 'meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' "$BODY"; then healthy=false; fi

          if ! curl -L -fsS --max-time 25 -o "$BODY" 'https://explorer.kriptoaman.com/robots.txt'; then
            healthy=false
          fi
          if ! grep -Fq 'Sitemap: https://explorer.kriptoaman.com/sitemap.xml' "$BODY"; then healthy=false; fi

          if ! curl -L -fsS --max-time 25 -o "$BODY" 'https://explorer.kriptoaman.com/sitemap.xml'; then
            healthy=false
          fi
          if ! grep -Fq '<loc>https://explorer.kriptoaman.com/stats</loc>' "$BODY"; then healthy=false; fi

          if [[ "$healthy" == "true" ]]; then
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            echo 'seo_signals=healthy'
          else
            echo 'drift=true' >> "$GITHUB_OUTPUT"
            echo 'seo_signals=drift_detected'
          fi

      - name: Apply reviewed Explorer SEO signals when drift is detected
        if: ${{ steps.seo_probe.outputs.drift == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/apply-kam-explorer-seo.sh
          bash scripts/apply-kam-explorer-seo.sh

      - name: Verify canonical and cache-busted stats surfaces
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          HEADERS="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS"' EXIT

          verify() {
            local url="$1"
            : > "$BODY"
            : > "$HEADERS"
            curl -L -fsS \
              -H 'Cache-Control: no-cache, no-store' \
              -H 'Pragma: no-cache' \
              --retry 5 --retry-delay 2 --retry-all-errors --max-time 25 \
              -D "$HEADERS" -o "$BODY" "$url"
            grep -Fq 'data-kam-stats-version="2.0.0"' "$BODY"
            ! grep -Fq 'Placeholder Counter' "$BODY"
            ! grep -Eqi 'amount in ETH|>ETH<' "$BODY"
            grep -Eqi '^x-kam-explorer-stats-version: *2' "$HEADERS"
            grep -Fq '<link rel="canonical" href="https://explorer.kriptoaman.com/stats" />' "$BODY"
            grep -Fq 'meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' "$BODY"
          }

          verify 'https://explorer.kriptoaman.com/stats'
          verify "https://explorer.kriptoaman.com/stats?verified=$(date +%s)"

          curl -fsS --retry 3 --retry-all-errors --max-time 15 \
            'https://explorer.kriptoaman.com/api/v2/stats' |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert "total_transactions" in d and "average_block_time" in d'

          curl -L -fsS --max-time 20 'https://explorer.kriptoaman.com/robots.txt' | grep -Fq 'Sitemap: https://explorer.kriptoaman.com/sitemap.xml'
          curl -L -fsS --max-time 20 'https://explorer.kriptoaman.com/sitemap.xml' | grep -Fq '<loc>https://explorer.kriptoaman.com/stats</loc>'

          echo 'stats_route_and_seo_guard=verified'

      - name: Publish Explorer route-guard status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Explorer routes, dynamic details and SEO guard verified"
          else
            state="failure"
            description="Explorer route guard failed; inspect run evidence"
          fi
          python3 - "$state" "$description" "$RUN_URL" > /tmp/status.json <<'PY'
          import json,sys
          state,description,target=sys.argv[1:4]
          print(json.dumps({
              "state": state,
              "context": "kriptoaman/explorer-route-guard",
              "description": description[:140],
              "target_url": target,
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @/tmp/status.json >/dev/null

