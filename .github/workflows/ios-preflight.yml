name: iOS App Store Preflight

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/ios-preflight.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/ios-preflight.yml'

jobs:
  ios-preflight:
    runs-on: macos-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci --legacy-peer-deps

      - name: Install matching Capacitor iOS platform for preflight
        run: npm install --no-save --legacy-peer-deps @capacitor/ios@8.5.0

      - name: Run release regression tests
        run: npm run test

      - name: Build web application
        run: npm run build

      - name: Generate iOS Capacitor project
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Validate iOS release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"appId": "com.kriptoaman.app"' capacitor.config.json
          test -d ios/App
          test -f ios/App/App.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.kriptoaman.app' ios/App/App.xcodeproj/project.pbxproj

      - name: Resolve Xcode build settings
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -showBuildSettings >/tmp/kriptoaman-ios-build-settings.txt

      - name: Compile unsigned iOS release preflight
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish iOS preflight status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'kriptoaman/ios-preflight',
              description: succeeded
                ? 'Unsigned iOS App Store preflight compiled successfully'
                : 'iOS preflight failed; inspect Actions',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
