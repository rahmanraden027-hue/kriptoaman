name: Phase 7 Device-Class Visual Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/components/landing/GLandingHeader.jsx'
      - 'src/components/landing/GLandingHero.jsx'
      - 'src/components/landing/GLandingHeroConsole.jsx'
      - 'src/components/landing/global-landing.css'
      - 'src/components/pwa/PWAInstallPrompt.jsx'
      - 'src/components/home/LiveBlockFlow3D.jsx'
      - 'src/components/home/NodePropagation3D.jsx'
      - '.github/scripts/phase7-device-class-browser.mjs'
      - '.github/workflows/phase7-device-class-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/landing/GLandingHeader.jsx'
      - 'src/components/landing/GLandingHero.jsx'
      - 'src/components/landing/GLandingHeroConsole.jsx'
      - 'src/components/landing/global-landing.css'
      - 'src/components/pwa/PWAInstallPrompt.jsx'
      - 'src/components/home/LiveBlockFlow3D.jsx'
      - 'src/components/home/NodePropagation3D.jsx'
      - '.github/scripts/phase7-device-class-browser.mjs'
      - '.github/workflows/phase7-device-class-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-device-class:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install production device-class browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live production at 390px and 430px
        run: node .github/scripts/phase7-device-class-browser.mjs
      - name: Upload device-class evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase7-device-class-production-evidence
          path: device-class-evidence
          retention-days: 30
          if-no-files-found: warn
