name: ZVQ Canonical RPC Final Gate 2026-09-29
on:
  push:
    branches: ['ops/zvq-rpc-recovery-20260929']
    paths: ['.github/workflows/zvq-canonical-rpc-final-gate.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Run repository verifier with official DNS-only assessor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          legacy_rc=0
          node chain/kam-mainnet/scripts/verify-public-endpoints.mjs > artifacts/public-audit.json || legacy_rc=$?
          node scripts/assess-zevaryq-public-proof.mjs artifacts/public-audit.json | tee artifacts/public-proof.json
          echo "legacy_strict_verifier_rc=$legacy_rc"
          jq -e '.ok == true and .checks.chainId == true and .checks.blockProgress == true and .checks.sensitiveMethodsBlocked == true and .checks.explorer == true and .checks.explorerHeight == true' artifacts/public-proof.json >/dev/null
      - name: Verify canonical and direct-SNI blocked policy from reviewed method list
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t methods < <(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import repair_zvq_domain_rpc as m
          for method in m.BLOCKED_METHODS:
              print(method)
          PY
          )
          test "${#methods[@]}" -ge 6
          payload() { jq -nc --arg m "$1" '{jsonrpc:"2.0",id:"final-gate",method:$m,params:[]}'; }
          for i in "${!methods[@]}"; do
            method="${methods[$i]}"
            params='[]'
            # The first reviewed BLOCKED_METHODS entry is the write probe.
            # Use the same intentionally invalid, non-signable marker as the official guarded workflow.
            if [[ "$i" = 0 ]]; then params='["0x01"]'; fi
            body="$(jq -nc --arg m "$method" --argjson p "$params" '{jsonrpc:"2.0",id:"final-gate",method:$m,params:$p}')"
            public_body="$(mktemp)"; direct_body="$(mktemp)"
            public_code="$(curl -sS --connect-timeout 6 --max-time 15 -o "$public_body" -w '%{http_code}' -H 'content-type: application/json' --data "$body" https://rpc.kriptoaman.com/)"
            direct_code="$(curl --noproxy '*' --resolve rpc.kriptoaman.com:443:206.189.36.15 -sS --connect-timeout 6 --max-time 15 -o "$direct_body" -w '%{http_code}' -H 'content-type: application/json' --data "$body" https://rpc.kriptoaman.com/)"
            for pair in "public:$public_code:$public_body" "direct_sni:$direct_code:$direct_body"; do
              IFS=: read -r label code file <<<"$pair"
              err_code="$(jq -r '.error.code // "none"' "$file" 2>/dev/null || echo malformed)"
              err_msg="$(jq -r '.error.message // "none"' "$file" 2>/dev/null || echo malformed)"
              echo "policy_method=$method target=$label http=$code rpc_error=$err_code message=$err_msg"
              node --input-type=module - "$code" "$file" <<'NODE'
              import fs from 'node:fs';
              import { isAdminRpcBlocked } from './chain/kam-mainnet/scripts/rpc-security.mjs';
              const status=Number(process.argv[2]);
              const payload=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
              if(!isAdminRpcBlocked(status,payload)) process.exit(1);
NODE
            done
            rm -f "$public_body" "$direct_body"
          done
      - name: Verify direct-SNI identity and advancing blocks
        shell: bash
        run: |
          set -euo pipefail
          rpc() {
            curl --noproxy '*' --resolve rpc.kriptoaman.com:443:206.189.36.15 -fsS --connect-timeout 6 --max-time 15               -H 'content-type: application/json' --data "$1" https://rpc.kriptoaman.com/
          }
          chain="$(rpc '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' | jq -er .result)"
          test "$chain" = 0x560c
          h1="$(rpc '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' | jq -er .result)"
          sleep 12
          h2="$(rpc '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' | jq -er .result)"
          (( h2 > h1 ))
          echo "direct_sni_chain=$chain blocks=$h1->$h2"
          timeout 12 openssl s_client -connect 206.189.36.15:443 -servername rpc.kriptoaman.com </dev/null 2>/dev/null |
            openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          echo 'canonical_rpc_final_gate=PASS'
