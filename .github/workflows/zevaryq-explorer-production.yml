name: Zevaryq Explorer Production Deploy
on:
  pull_request:
    paths:
      - "explorer-dashboard/zevaryq-production.html"
      - "explorer-dashboard/assets/**"
      - "scripts/deploy-zevaryq-explorer.sh"
      - "tests/zevaryq-explorer-production.test.mjs"
      - "tests/zevaryq-explorer-official-logo.test.mjs"
      - ".github/workflows/zevaryq-explorer-production.yml"
  push:
    branches: [main]
    paths:
      - "explorer-dashboard/zevaryq-production.html"
      - "explorer-dashboard/assets/**"
      - "scripts/deploy-zevaryq-explorer.sh"
      - "tests/zevaryq-explorer-production.test.mjs"
      - "tests/zevaryq-explorer-official-logo.test.mjs"
      - ".github/workflows/zevaryq-explorer-production.yml"
  workflow_dispatch:
    inputs:
      confirm_explorer_only:
        description: "Type DEPLOY-ZEVARYQ-EXPLORER"
        required: true
permissions:
  contents: read
  statuses: write
concurrency:
  group: zevaryq-explorer-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Publish dedicated Explorer deployment start
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc --arg target "$target" '{state:"pending", context:"kriptoaman/zvq-explorer-origin-deploy", description:"Guarded origin deployment started; refer to workflow run", target_url:$target}')"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

  diagnose-assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 5
    steps:
      - name: Inspect NGINX asset route and actual bytes without changing production
        shell: bash
        run: |
          set -uo pipefail
          cd /opt/blockscout/docker-compose || exit 1
          echo '::group::NGINX template static-route references'
          grep -nE 'location|kam-dashboard|zevaryq-assets|root|alias|try_files' proxy/default.conf.template | head -90 || true
          echo '::endgroup::'
          echo '::group::Deployed approved asset bytes on host'
          for asset in zevaryq-emblem.webp zevaryq-favicon.png; do
            path="proxy/kam-dashboard/zevaryq-assets/$asset"
            if [[ -f "$path" ]]; then stat -c '%n bytes=%s' "$path"; sha256sum "$path"; else echo "MISSING=$path"; fi
          done
          echo '::endgroup::'
          echo '::group::HTTP direct loopback asset responses'
          for asset in zevaryq-emblem.webp zevaryq-favicon.png; do
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' "http://127.0.0.1/zevaryq-assets/$asset" || true)"
            echo "$asset http=$code bytes=$(wc -c < "$tmp")"
            sha256sum "$tmp"
            rm -f "$tmp"
          done
          echo '::endgroup::'
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce protected-zone boundary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.confirm_explorer_only }}" = "DEPLOY-ZEVARYQ-EXPLORER"
          fi
          test -f explorer-dashboard/zevaryq-production.html
          test -f scripts/deploy-zevaryq-explorer.sh
          grep -q 'ZEVARYQ EXPLORER' explorer-dashboard/zevaryq-production.html
          grep -q "EXPECTED_CHAIN='0x560c'" explorer-dashboard/zevaryq-production.html
          ! grep -Eqi 'kriptoaman\.com/\*|cloudflare pages|genesis|private.?key|postgres.*reset|redis.*reset' scripts/deploy-zevaryq-explorer.sh
          node --test tests/zevaryq-explorer-production.test.mjs tests/zevaryq-explorer-reference-theme.test.mjs tests/zevaryq-explorer-official-logo.test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm dedicated Explorer host
        run: |
          test "$(hostname)" != ""
          test -d /opt/blockscout/docker-compose/proxy/kam-dashboard
          test -f /opt/blockscout/docker-compose/proxy/default.conf.template
      - name: Deploy Explorer homepage only
        run: sudo bash scripts/deploy-zevaryq-explorer.sh explorer-dashboard/zevaryq-production.html

  report:
    if: ${{ always() }}
    needs: [announce, validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish actual dedicated Explorer deployment result
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ needs.validate.result }}
          DEPLOY: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VALIDATE" == success && "$DEPLOY" == success ]]; then
            status=success
            desc='Guarded ZEVARYQ origin deployment and local preflight passed'
          else
            status=failure
            desc="Origin deployment incomplete (validate=$VALIDATE, deploy=$DEPLOY)"
          fi
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc --arg state "$status" --arg description "$desc" --arg target "$target" '{state:$state, context:"kriptoaman/zvq-explorer-origin-deploy", description:$description, target_url:$target}')"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
          [[ "$status" == success ]]
