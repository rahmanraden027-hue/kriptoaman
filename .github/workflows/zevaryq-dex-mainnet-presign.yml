name: ZEVARYQ DEX Mainnet Pre-Sign

on:
  pull_request:
    paths:
      - 'chain/zevaryq-mainnet/trading/script/PrepareZVQDEXDeployment.s.sol'
      - 'chain/zevaryq-mainnet/trading/contracts/**'
      - '.github/workflows/zevaryq-dex-mainnet-presign.yml'
  workflow_dispatch:
    inputs:
      deployer_address:
        description: 'Public EVM address that will sign deployment later (no private key)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  no-broadcast-live-chain-simulation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chain/zevaryq-mainnet/trading
    env:
      ZEVARYQ_RPC_URL: https://rpc.kriptoaman.com
      DEPLOYER_ADDRESS: ${{ inputs.deployer_address || '0x9D4b034758202cE555504d038F92A344540D47B0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format check
        run: forge fmt --check

      - name: Build exact Paris-compatible bytecode
        run: forge build --sizes --evm-version paris

      - name: Verify live chain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cast chain-id --rpc-url "$ZEVARYQ_RPC_URL")" = "22028"
          a="$(cast block-number --rpc-url "$ZEVARYQ_RPC_URL")"
          sleep 3
          b="$(cast block-number --rpc-url "$ZEVARYQ_RPC_URL")"
          test "$b" -ge "$a"
          echo "chainId=22028 blockBefore=$a blockAfter=$b"

      - name: Validate deployer and live pre-sign state
        shell: bash
        run: |
          set -euo pipefail
          cast address-zero >/dev/null
          cast to-check-sum-address "$DEPLOYER_ADDRESS" >/dev/null

          balance_wei="$(cast balance "$DEPLOYER_ADDRESS" --rpc-url "$ZEVARYQ_RPC_URL")"
          nonce="$(cast nonce "$DEPLOYER_ADDRESS" --rpc-url "$ZEVARYQ_RPC_URL")"
          gas_price="$(cast gas-price --rpc-url "$ZEVARYQ_RPC_URL")"
          base_fee="$(cast block latest --field baseFeePerGas --rpc-url "$ZEVARYQ_RPC_URL" 2>/dev/null || true)"

          echo "deployer=$DEPLOYER_ADDRESS"
          echo "balanceWei=$balance_wei"
          echo "nonce=$nonce"
          echo "gasPriceWei=$gas_price"
          echo "baseFeePerGasWei=${base_fee:-unavailable}"
          # Nonce is intentionally not hard-coded. The live signer state is authoritative.
          # Contract-address collision is exercised by the full fork simulation below.

      - name: Simulate WZVQ Factory Router from reviewed signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../artifacts
          forge script script/PrepareZVQDEXDeployment.s.sol:PrepareZVQDEXDeployment             --rpc-url "$ZEVARYQ_RPC_URL"             --evm-version paris             -vvvv 2>&1 | tee ../../../artifacts/zevaryq-dex-presign.log

      - name: Assert CI cannot broadcast
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DEPLOYER_PRIVATE_KEY:-}"
          test -z "${PRIVATE_KEY:-}"
          test -z "${MNEMONIC:-}"
          ! grep -v 'grep .*--broadcast' ../../../.github/workflows/zevaryq-dex-mainnet-presign.yml | grep -n -- '--broadcast'

      - name: Collect unsigned deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../artifacts/zevaryq-dex-unsigned
          cp broadcast/PrepareZVQDEXDeployment.s.sol/22028/dry-run/run-latest.json              ../../../artifacts/zevaryq-dex-unsigned/run-latest.json
          cp ../../../artifacts/zevaryq-dex-presign.log              ../../../artifacts/zevaryq-dex-unsigned/presign.log
          sha256sum ../../../artifacts/zevaryq-dex-unsigned/* |              tee ../../../artifacts/zevaryq-dex-unsigned/SHA256SUMS.txt

      - name: Upload pre-sign evidence
        uses: actions/upload-artifact@v6
        with:
          name: zevaryq-dex-presign-evidence
          path: artifacts/zevaryq-dex-unsigned/
          if-no-files-found: error
          retention-days: 30
