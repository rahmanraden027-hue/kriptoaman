name: ZEVARYQ Wallet Installable Preview APK

on:
  push:
    branches:
      - preview/zevaryq-wallet-debug-apk
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/zevaryq-wallet-preview-apk.yml'

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify wallet regression suite
        run: npm test
      - name: Build web bundle and sync Android
        run: npm run android:sync
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable wallet preview
        uses: actions/upload-artifact@v7
        with:
          name: zevaryq-wallet-installable-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
