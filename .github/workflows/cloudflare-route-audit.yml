name: Cloudflare Route Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit production Cloudflare routes
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: kriptoaman.com
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${CF_API_TOKEN:-}"

          ZONES="$(curl -fsS --get \
            'https://api.cloudflare.com/client/v4/zones' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Accept: application/json' \
            --data-urlencode "name=${ZONE_NAME}" \
            --data-urlencode "account.id=${CF_ACCOUNT_ID}")"

          test "$(jq -r '.success' <<<"$ZONES")" = "true"

          ZONE_ID="$(jq -r '.result[0].id' <<<"$ZONES")"
          test -n "$ZONE_ID"

          ROUTES="$(curl -fsS \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Accept: application/json')"

          test "$(jq -r '.success' <<<"$ROUTES")" = "true"

          echo "=== CLOUDFLARE WORKER ROUTES ==="
          jq -r '.result[] | [.pattern, (.script // "NO_SCRIPT")] | @tsv' <<<"$ROUTES"

          echo
          echo "=== EXPLORER ROUTES ONLY ==="
          jq -r '.result[]
            | select(.pattern | contains("explorer.kriptoaman.com"))
            | [.pattern, (.script // "NO_SCRIPT")]
            | @tsv' <<<"$ROUTES"
