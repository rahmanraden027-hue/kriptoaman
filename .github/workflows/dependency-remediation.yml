name: Dependency Remediation

on:
  push:
    branches:
      - design/final-kriptoaman-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-final-ui
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/final-kriptoaman-ui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply non-breaking production dependency fixes
        run: npm audit fix --omit=dev --legacy-peer-deps

      - name: Run regression tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Commit dependency lock updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No non-breaking dependency updates were available.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: apply non-breaking dependency security fixes'
          git push origin HEAD:design/final-kriptoaman-ui
