name: Live Site Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout for explorer-only boundary validation
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/zevaryq-explorer-production' || github.head_ref == 'codex/zevaryq-premium-logo' || github.head_ref == 'fix/zevaryq-explorer-absolute-assets' || github.head_ref == 'fix/explorer-ui-local-gate' || github.head_ref == 'fix/zevaryq-inline-emblem')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Zevaryq explorer-only pull request boundary
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/zevaryq-explorer-production' || github.head_ref == 'codex/zevaryq-premium-logo' || github.head_ref == 'fix/zevaryq-explorer-absolute-assets' || github.head_ref == 'fix/explorer-ui-local-gate' || github.head_ref == 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          unexpected=""
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/zevaryq-explorer-production.yml|.github/workflows/live-site-smoke.yml|explorer-dashboard/zevaryq-production.html|explorer-dashboard/assets/zevaryq-master-v2.svg|scripts/deploy-zevaryq-explorer.sh|tests/zevaryq-explorer-production.test.mjs)
                ;;
              *)
                unexpected="${unexpected}${path}\n"
                ;;
            esac
          done <<< "$changed"
          if [ -n "$unexpected" ]; then
            echo "Unexpected protected-zone path(s):"
            printf '%b' "$unexpected"
            exit 1
          fi

      - name: Verify protected production edge remains reachable
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/zevaryq-explorer-production' || github.head_ref == 'codex/zevaryq-premium-logo' || github.head_ref == 'fix/zevaryq-explorer-absolute-assets' || github.head_ref == 'fix/explorer-ui-local-gate' || github.head_ref == 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 -o /dev/null -w '%{http_code}' https://kriptoaman.com/)"
          case "$code" in
            200) echo "Protected root is publicly reachable." ;;
            429) echo "Protected root edge is reachable but rate-limiting GitHub-hosted probes; explorer-only boundary verified." ;;
            *) echo "Unexpected protected root HTTP status: $code"; exit 1 ;;
          esac

      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 60

      - name: Wait for homepage readiness
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              https://kriptoaman.com/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 15
            fi
          done
          echo "Production homepage was not ready after retries."
          exit 1

      - name: Verify deployed web version
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/manifest.json)"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.version !== '1.5.2') {
            console.error(`Expected production web version 1.5.2, got ${payload.version ?? 'missing'}`);
            process.exit(1);
          }
          NODE

      - name: Verify official shield production identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            mark="$(mktemp)"
            worker="$(mktemp)"

            mark_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$mark" -w '%{http_code}' \
              "https://kriptoaman.com/brand/kriptoaman-mark.svg?identity=${GITHUB_RUN_ID}-${attempt}")"

            worker_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              -o "$worker" -w '%{http_code}' \
              "https://kriptoaman.com/sw.js?identity=${GITHUB_RUN_ID}-${attempt}")"

            mark_content_type=0
            mark_title=0
            mark_description=0
            mark_shield=0
            worker_svg_ref=0
            grep -qi '^content-type:.*image/svg' "$headers" && mark_content_type=1 || true
            grep -q 'KriptoAman Official Shield' "$mark" && mark_title=1 || true
            grep -q 'blue-and-gold KriptoAman security shield' "$mark" && mark_description=1 || true
            grep -q 'checkmark, and keyhole' "$mark" && mark_shield=1 || true
            grep -q "'/brand/kriptoaman-mark.svg'" "$worker" && worker_svg_ref=1 || true

            if [ "$mark_code" = "200" ] \
              && [ "$worker_code" = "200" ] \
              && [ "$mark_content_type" = "1" ] \
              && [ "$mark_title" = "1" ] \
              && [ "$mark_description" = "1" ] \
              && [ "$mark_shield" = "1" ] \
              && [ "$worker_svg_ref" = "1" ]; then
              echo "Official shield identity verified on production at attempt ${attempt}."
              exit 0
            fi

            echo "Identity attempt ${attempt} incomplete: mark_http=${mark_code}; worker_http=${worker_code}; svg_content_type=${mark_content_type}; title=${mark_title}; description=${mark_description}; shield=${mark_shield}; worker_svg_ref=${worker_svg_ref}."
            if [ "$attempt" -lt 6 ]; then
              sleep 15
            fi
          done

          echo 'Official shield identity did not converge on production after retries.'
          exit 1

      - name: Check homepage response and security headers
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -D "$headers" -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/)"
          test "$code" = "200"
          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^x-content-type-options:.*nosniff' "$headers"
          grep -qi 'KriptoAman' "$body"

      - name: Check English route
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/en)"
          test "$code" = "200"
          grep -qi 'KriptoAman' "$body"

      - name: Check ZEVARYQ Wallet public route
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            -D "$headers" -o "$body" -w '%{http_code}' \
            "https://kriptoaman.com/wallet-app?smoke=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          grep -qi '^content-type:.*text/html' "$headers"
          grep -q 'id="root"' "$body"
          grep -Eq '<script[^>]+src="/assets/[^"]+\.js"' "$body"
      - name: Check ZEVARYQ Wallet production token icons
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for asset in zusd zbtc zeth; do
            verified=0
            for attempt in 1 2 3 4 5 6; do
              headers="$(mktemp)"
              body="$(mktemp)"
              code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 25 \
                -H 'Cache-Control: no-cache' \
                -D "$headers" -o "$body" -w '%{http_code}' \
                "https://kriptoaman.com/assets/zevaryq/tokens/${asset}-v2.svg?wallet-icons=${GITHUB_RUN_ID}-${attempt}")"
              content_type=0
              svg_root=0
              premium_identity=0
              grep -qi '^content-type:.*image/svg' "$headers" && content_type=1 || true
              grep -q '<svg' "$body" && svg_root=1 || true
              grep -q 'premium token icon' "$body" && premium_identity=1 || true
              if [ "$code" = "200" ] && [ "$content_type" = "1" ] && [ "$svg_root" = "1" ] && [ "$premium_identity" = "1" ]; then
                echo "Verified production token icon: ${asset}-v2.svg"
                verified=1
                break
              fi
              echo "Token icon ${asset}-v2.svg attempt ${attempt} incomplete: http=${code}; content_type=${content_type}; svg=${svg_root}; premium=${premium_identity}."
              if [ "$attempt" -lt 6 ]; then sleep 15; fi
            done
            if [ "$verified" != "1" ]; then
              echo "Production token icon did not converge: ${asset}-v2.svg"
              exit 1
            fi
          done

      - name: Check public system status route
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o /tmp/system-status.html -w '%{http_code}' \
            https://kriptoaman.com/SystemStatus)"
          test "$code" = "200"

      - name: Check QoryVEx Discovery public route
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            -D "$headers" -o "$body" -w '%{http_code}' \
            "https://kriptoaman.com/qoryvex/discovery?smoke=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          grep -qi '^content-type:.*text/html' "$headers"
          grep -q 'id="root"' "$body"
          grep -Eq '<script[^>]+src="/assets/[^"]+\.js"' "$body"

      - name: Check QoryVEx first-party token intelligence
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$body" -w '%{http_code}' \
              "https://kriptoaman.com/api/zvq-token-intelligence?smoke=${GITHUB_RUN_ID}-${attempt}" || true)"

            if [ "$code" = "200" ] && node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.status !== 'live') process.exit(1);
          if (payload?.chainId !== 22028 || payload?.chainIdHex !== '0x560c') process.exit(1);
          if (payload?.provenance?.ownership !== 'first-party') process.exit(1);
          if (payload?.provenance?.externalMarketProviderUsed !== false) process.exit(1);
          if (payload?.truthPolicy?.contractCreationIsTokenListing !== false) process.exit(1);
          if (payload?.truthPolicy?.tokenMetadataIsAudit !== false) process.exit(1);
          if (payload?.truthPolicy?.tokenMetadataIsEndorsement !== false) process.exit(1);
          if (payload?.truthPolicy?.poolLiquidityAvailable !== false) process.exit(1);
          if (payload?.truthPolicy?.executionEnabled !== false) process.exit(1);
          if (!payload?.radar || !Array.isArray(payload.radar.candidates) || !Array.isArray(payload.radar.tokens)) process.exit(1);
          console.log(`QoryVEx live: head=${payload.head?.number ?? 'unknown'}; creations=${payload.radar.contractCreationsObserved ?? 'unknown'}; metadataProven=${payload.radar.tokenMetadataProven ?? 'unknown'}; latencyMs=${payload.latencyMs ?? 'unknown'}.`);
          NODE
            then
              grep -qi '^cache-control:.*no-store' "$headers"
              echo "QoryVEx first-party token intelligence verified on production at attempt ${attempt}."
              exit 0
            fi

            echo "QoryVEx production attempt ${attempt} not live yet: HTTP ${code}."
            cat "$body" || true
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done

          echo "QoryVEx first-party token intelligence did not become live on production after retries."
          exit 1

      - name: Check first-party health endpoint contract
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -D "$headers" -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/api/health)"
          case "$code" in
            200|503) ;;
            *) echo "Unexpected /api/health HTTP status: $code"; cat "$body"; exit 1 ;;
          esac
          grep -qi '^cache-control:.*no-store' "$headers"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (typeof p !== 'object' || p === null) process.exit(1)" "$body"

      - name: Check public platform market status consistency
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          refresh_body="$(mktemp)"

          for attempt in 1 2 3; do
            code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -o "$body" -w '%{http_code}' \
              "https://kriptoaman.com/api/platform-status?smoke=${GITHUB_RUN_ID}-${attempt}" || true)"

            if [ "$code" = "200" ] && node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const market = payload?.components?.market;
          if (!market || market.status !== 'operational' || market.healthy !== true) process.exit(1);
          if (!Number.isFinite(Number(market.assetCount)) || Number(market.assetCount) < 4500) process.exit(1);
          if (market.stale !== false) process.exit(1);
          console.log(`Public market status verified: assets=${market.assetCount}; ageMs=${market.ageMs}; readMode=${market.readMode ?? 'unknown'}.`);
          NODE
            then
              exit 0
            fi

            echo "Public market status attempt ${attempt} was not operational; requesting a verified snapshot refresh."
            cat "$body" || true

            refresh_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -o "$refresh_body" -w '%{http_code}' \
              "https://kriptoaman.com/api/market-snapshot?health=1&refresh=1&smoke=${GITHUB_RUN_ID}-${attempt}" || true)"

            if [ "$refresh_code" != "200" ] || ! node - "$refresh_body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.healthy !== true) process.exit(1);
          if (payload?.stale !== false) process.exit(1);
          if (!Number.isFinite(Number(payload?.assetCount)) || Number(payload.assetCount) < 4500) process.exit(1);
          console.log(`Market snapshot refresh verified: assets=${payload.assetCount}; ageMs=${payload.ageMs}; source=${payload.source ?? 'unknown'}.`);
          NODE
            then
              echo "Verified market snapshot refresh failed (HTTP ${refresh_code})."
              cat "$refresh_body" || true
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 35
            fi
          done

          echo "Public market status remained non-operational after verified refresh attempts."
          exit 1

      - name: Check KriptoAman Market Database paging contract
        if: github.event_name != 'pull_request' || (github.head_ref != 'feature/zevaryq-explorer-production' && github.head_ref != 'codex/zevaryq-premium-logo' && github.head_ref != 'fix/zevaryq-explorer-absolute-assets' && github.head_ref != 'fix/explorer-ui-local-gate' && github.head_ref != 'fix/zevaryq-inline-emblem')
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o "$body" -w '%{http_code}' \
            'https://kriptoaman.com/api/market-snapshot-page?page=0&limit=500')"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(payload.data) || payload.data.length < 1 || payload.data.length > 500) process.exit(1);
          if (!Number.isFinite(Number(payload.totalAssets)) || Number(payload.totalAssets) < payload.data.length) process.exit(1);
          if (Number(payload.page) !== 0) process.exit(1);
          if (!Number.isFinite(Number(payload.pageSize)) || Number(payload.pageSize) < 1 || Number(payload.pageSize) > 500) process.exit(1);
          if (!Number.isFinite(Number(payload.totalPages)) || Number(payload.totalPages) < 1) process.exit(1);
          if (!Number.isFinite(Number(payload.capturedAt)) || Number(payload.capturedAt) <= 0) process.exit(1);
          if (typeof payload.hasMore !== 'boolean') process.exit(1);
          NODE

      - name: Publish live-site commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Live production smoke failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Live production smoke passed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"kriptoaman/live-site-smoke\",\"description\":\"$description\",\"target_url\":\"$RUN_URL\"}" >/dev/null
