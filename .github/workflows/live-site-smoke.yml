name: Live Site Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 60

      - name: Wait for homepage readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              https://kriptoaman.com/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 15
            fi
          done
          echo "Production homepage was not ready after retries."
          exit 1

      - name: Verify deployed web version
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/manifest.json)"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.version !== '1.5.1') {
            console.error(`Expected production web version 1.5.1, got ${payload.version ?? 'missing'}`);
            process.exit(1);
          }
          NODE

      - name: Verify official K-orbit production identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            mark="$(mktemp)"
            worker="$(mktemp)"

            mark_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$mark" -w '%{http_code}' \
              "https://kriptoaman.com/brand/kriptoaman-mark.svg?identity=${GITHUB_RUN_ID}-${attempt}")"

            worker_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              -o "$worker" -w '%{http_code}' \
              "https://kriptoaman.com/sw.js?identity=${GITHUB_RUN_ID}-${attempt}")"

            mark_content_type=0
            mark_title=0
            mark_description=0
            mark_orbit=0
            worker_svg_ref=0
            grep -qi '^content-type:.*image/svg' "$headers" && mark_content_type=1 || true
            grep -q 'KriptoAman Official Mark' "$mark" && mark_title=1 || true
            grep -q 'dimensional gold and electric-blue K with a network ring' "$mark" && mark_description=1 || true
            grep -q 'orbital sweep' "$mark" && mark_orbit=1 || true
            grep -q "'/brand/kriptoaman-mark.svg'" "$worker" && worker_svg_ref=1 || true

            if [ "$mark_code" = "200" ] \
              && [ "$worker_code" = "200" ] \
              && [ "$mark_content_type" = "1" ] \
              && [ "$mark_title" = "1" ] \
              && [ "$mark_description" = "1" ] \
              && [ "$mark_orbit" = "1" ] \
              && [ "$worker_svg_ref" = "1" ]; then
              echo "Official K-orbit identity verified on production at attempt ${attempt}."
              exit 0
            fi

            echo "Identity attempt ${attempt} incomplete: mark_http=${mark_code}; worker_http=${worker_code}; svg_content_type=${mark_content_type}; title=${mark_title}; description=${mark_description}; orbit=${mark_orbit}; worker_svg_ref=${worker_svg_ref}."
            if [ "$attempt" -lt 6 ]; then
              sleep 15
            fi
          done

          echo 'Official K-orbit identity did not converge on production after retries.'
          exit 1

      - name: Check homepage response and security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -D "$headers" -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/)"
          test "$code" = "200"
          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^x-content-type-options:.*nosniff' "$headers"
          grep -qi 'KriptoAman' "$body"

      - name: Check English route
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/en)"
          test "$code" = "200"
          grep -qi 'KriptoAman' "$body"

      - name: Check public system status route
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o /tmp/system-status.html -w '%{http_code}' \
            https://kriptoaman.com/SystemStatus)"
          test "$code" = "200"

      - name: Check first-party health endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -D "$headers" -o "$body" -w '%{http_code}' \
            https://kriptoaman.com/api/health)"
          case "$code" in
            200|503) ;;
            *) echo "Unexpected /api/health HTTP status: $code"; cat "$body"; exit 1 ;;
          esac
          grep -qi '^cache-control:.*no-store' "$headers"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (typeof p !== 'object' || p === null) process.exit(1)" "$body"

      - name: Check Global Markets Forex and XAUUSD contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            -o "$body" -w '%{http_code}' \
            "https://kriptoaman.com/api/global-markets?smoke=${GITHUB_RUN_ID}")"

          if [ "$code" != "200" ]; then
            echo "Global Markets endpoint returned HTTP ${code}."
            cat "$body" || true
            exit 1
          fi

          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const required = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'USD/CHF', 'AUD/USD', 'USD/CAD', 'NZD/USD', 'XAU/USD'];
          if (!Array.isArray(payload?.instruments)) {
            console.error('Global Markets response has no instruments array.');
            process.exit(1);
          }
          const bySymbol = new Map(payload.instruments.map(item => [item?.symbol, item]));
          const missing = required.filter(symbol => !bySymbol.has(symbol));
          if (missing.length) {
            console.error(`Global Markets missing required instruments: ${missing.join(', ')}`);
            process.exit(1);
          }
          for (const symbol of required) {
            const price = Number(bySymbol.get(symbol)?.price);
            if (!Number.isFinite(price) || price <= 0) {
              console.error(`Global Markets has invalid price for ${symbol}.`);
              process.exit(1);
            }
          }
          if (!['professional', 'fallback-reference'].includes(payload?.providerMode)) {
            console.error(`Unexpected Global Markets provider mode: ${payload?.providerMode ?? 'missing'}`);
            process.exit(1);
          }
          if (payload?.marketUse !== 'information-only') {
            console.error('Global Markets must remain information-only.');
            process.exit(1);
          }
          if (payload?.disclosure?.executionPrice !== false || payload?.disclosure?.investmentAdvice !== false || payload?.disclosure?.derivativesExecution !== false) {
            console.error('Global Markets safety disclosure contract changed.');
            process.exit(1);
          }
          console.log(`Global Markets verified: provider=${payload.provider ?? 'unknown'}; mode=${payload.providerMode}; professionalConfigured=${Boolean(payload.professionalProviderConfigured)}; instruments=${payload.instruments.length}.`);
          NODE

      - name: Check public platform market status consistency
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          refresh_body="$(mktemp)"

          for attempt in 1 2 3; do
            code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -o "$body" -w '%{http_code}' \
              "https://kriptoaman.com/api/platform-status?smoke=${GITHUB_RUN_ID}-${attempt}")"

            if [ "$code" = "200" ] && node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const market = payload?.components?.market;
          if (!market || market.status !== 'operational' || market.healthy !== true) process.exit(1);
          if (!Number.isFinite(Number(market.assetCount)) || Number(market.assetCount) < 4500) process.exit(1);
          if (market.stale !== false) process.exit(1);
          console.log(`Public market status verified: assets=${market.assetCount}; ageMs=${market.ageMs}; readMode=${market.readMode ?? 'unknown'}.`);
          NODE
            then
              exit 0
            fi

            echo "Public market status attempt ${attempt} was not operational; requesting a verified snapshot refresh."
            cat "$body" || true

            refresh_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -o "$refresh_body" -w '%{http_code}' \
              "https://kriptoaman.com/api/market-snapshot?health=1&refresh=1&smoke=${GITHUB_RUN_ID}-${attempt}")"

            if [ "$refresh_code" != "200" ] || ! node - "$refresh_body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.healthy !== true) process.exit(1);
          if (payload?.stale !== false) process.exit(1);
          if (!Number.isFinite(Number(payload?.assetCount)) || Number(payload.assetCount) < 4500) process.exit(1);
          console.log(`Market snapshot refresh verified: assets=${payload.assetCount}; ageMs=${payload.ageMs}; source=${payload.source ?? 'unknown'}.`);
          NODE
            then
              echo "Verified market snapshot refresh failed (HTTP ${refresh_code})."
              cat "$refresh_body" || true
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 35
            fi
          done

          echo "Public market status remained non-operational after verified refresh attempts."
          exit 1

      - name: Check KriptoAman Market Database paging contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --fail-with-body --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -o "$body" -w '%{http_code}' \
            'https://kriptoaman.com/api/market-snapshot-page?page=0&limit=500')"
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(payload.data) || payload.data.length < 1 || payload.data.length > 500) process.exit(1);
          if (!Number.isFinite(Number(payload.totalAssets)) || Number(payload.totalAssets) < payload.data.length) process.exit(1);
          if (Number(payload.page) !== 0) process.exit(1);
          if (!Number.isFinite(Number(payload.pageSize)) || Number(payload.pageSize) < 1 || Number(payload.pageSize) > 500) process.exit(1);
          if (!Number.isFinite(Number(payload.totalPages)) || Number(payload.totalPages) < 1) process.exit(1);
          if (!Number.isFinite(Number(payload.capturedAt)) || Number(payload.capturedAt) <= 0) process.exit(1);
          if (typeof payload.hasMore !== 'boolean') process.exit(1);
          NODE

      - name: Publish live-site commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Live production smoke failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Live production smoke passed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"kriptoaman/live-site-smoke\",\"description\":\"$description\",\"target_url\":\"$RUN_URL\"}" >/dev/null
