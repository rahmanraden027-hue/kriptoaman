name: Production Presentation Provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pages/HomeV10.jsx'
      - 'src/components/home-v10/**'
      - 'src/hooks/useMarketSurface.js'
      - 'src/components/home/useCoinMarkets.js'
      - '.github/workflows/production-presentation-provenance.yml'
  push:
    branches: [main]
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Verify current homepage presentation bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://kriptoaman.com';
          const origin = new URL(base).origin;
          // Phase 16D production contract: prove the live Phase 16C data-first
          // command center instead of legacy or pre-16C presentation copy.
          const required = [
            'MOVING NOW',
            'Top Gainer',
            'Most Active',
            'Market Direction',
            'Assets Tracked',
            'Top Movers',
            'Live Intelligence',
            'VERIFY ANYTHING',
            'Token / Contract / Wallet / Transaction / Block',
            'ON-CHAIN NOW',
            'Global Crypto Intelligence',
            'Visual topology · verified core data only',
            'ZEVARYQ evidence radar',
            'Open discovery'
          ];

          const headers = {
            'User-Agent': 'KriptoAman-Presentation-Provenance/6.0',
            'Cache-Control': 'no-cache'
          };

          const home = await fetch(base + '/', { headers });
          if (!home.ok) throw new Error(`homepage HTTP ${home.status}`);
          const html = await home.text();

          const entryScripts = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)]
            .map((match) => new URL(match[1], base).toString());
          if (!entryScripts.length) throw new Error('No JavaScript bundle discovered on homepage');

          // HomeV10 and the authenticated workspace intentionally use code splitting. Follow the
          // same-origin JavaScript chunk graph instead of assuming every production
          // presentation string lives inside the first entry bundle.
          const queue = [...entryScripts];
          const visited = new Set();
          let bundleText = '';
          const MAX_CHUNKS = 160;

          while (queue.length && visited.size < MAX_CHUNKS) {
            const url = queue.shift();
            if (visited.has(url)) continue;

            let parsed;
            try {
              parsed = new URL(url);
            } catch {
              continue;
            }
            if (parsed.origin !== origin || !parsed.pathname.endsWith('.js')) continue;

            visited.add(url);
            const response = await fetch(url, { headers });
            if (!response.ok) continue;

            const text = await response.text();
            bundleText += '\n' + text;

            const remaining = required.filter((marker) => !bundleText.includes(marker));
            if (remaining.length === 0) break;

            const refs = text.matchAll(/["'`]([^"'`\s]+\.js(?:\?[^"'`\s]*)?)["'`]/g);
            for (const match of refs) {
              try {
                const next = new URL(match[1], url);
                if (
                  next.origin === origin &&
                  next.pathname.endsWith('.js') &&
                  !visited.has(next.toString())
                ) {
                  queue.push(next.toString());
                }
              } catch {
                // Ignore non-URL JavaScript string literals.
              }
            }
          }

          const missing = required.filter((text) => !bundleText.includes(text));
          if (visited.size >= MAX_CHUNKS && queue.length && missing.length) {
            throw new Error(
              `JavaScript chunk crawl reached safety limit of ${MAX_CHUNKS} with missing markers: ${missing.join(' | ')}`
            );
          }

          if (missing.length) {
            console.error(`Production presentation is stale. Missing: ${missing.join(' | ')}`);
            console.error(`Scanned same-origin JavaScript chunks: ${visited.size}`);
            process.exit(2);
          }

          console.log(`PRODUCTION_PRESENTATION: VERIFIED · scanned ${visited.size} same-origin JavaScript chunk(s)`);
          NODE

      - name: Verify Founder, Company, and Research routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /Market /IntelligenceHub /PortfolioOverview /QoryVExDiscovery /founder /company /research /research/kam-mainnet-architecture; do
            code="$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 -o /dev/null -w '%{http_code}' "https://kriptoaman.com${route}")"
            test "$code" = "200"
          done

      - name: Publish presentation provenance status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Production presentation provenance failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Production presentation provenance verified"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"kriptoaman/production-presentation-provenance\",\"description\":\"$description\",\"target_url\":\"$RUN_URL\"}" >/dev/null
