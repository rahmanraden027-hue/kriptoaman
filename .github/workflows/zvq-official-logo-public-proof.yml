name: ZEVARYQ Official Logo Public Proof
on:
  pull_request:
    paths:
      - explorer-dashboard/zevaryq-production.html
      - explorer-dashboard/assets/**
      - tests/zevaryq-explorer-official-logo.test.mjs
      - .github/workflows/zvq-official-logo-public-proof.yml
      - scripts/repair-zevaryq-assets-nginx.sh
      - scripts/verify-zvq-logo-placement.mjs
      - tests/zvq-logo-placement-contract.test.mjs
  push:
    branches: [main]
    paths:
      - explorer-dashboard/zevaryq-production.html
      - explorer-dashboard/assets/**
      - tests/zevaryq-explorer-official-logo.test.mjs
      - .github/workflows/zvq-official-logo-public-proof.yml
      - scripts/repair-zevaryq-assets-nginx.sh
      - scripts/verify-zvq-logo-placement.mjs
      - tests/zvq-logo-placement-contract.test.mjs
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  statuses: write
concurrency:
  group: zvq-official-logo-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify approved assets, full ZVQ identity and fail-closed chain guards
        run: |
          node --test tests/zevaryq-explorer-official-logo.test.mjs tests/zevaryq-explorer-reference-theme.test.mjs tests/zevaryq-explorer-production.test.mjs tests/zvq-logo-placement-contract.test.mjs
          grep -Fq 'data-zvq-logo-integrity="sha256-a74790a590757e6f4425d384fdc0cdf40cb8030807eb7c0892ba8aaa4e6fc6cc"' explorer-dashboard/zevaryq-production.html
  public:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prove approved Identity V2 master mark on trusted origin and public domain
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          host='explorer.kriptoaman.com'
          origin='146.190.93.254'
          logo_sha='a74790a590757e6f4425d384fdc0cdf40cb8030807eb7c0892ba8aaa4e6fc6cc'
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          verify() {
            local label="$1" attempt="$2"
            local -a options=()
            if [[ "$label" == origin ]]; then options=(--resolve "$host:443:$origin"); fi
            local url="https://$host"
            curl -fLsS --connect-timeout 6 --max-time 18 -H 'Cache-Control: no-cache' "${options[@]}" "$url/" -o "$scratch/$label-default.html" || return 1
            curl -fLsS --connect-timeout 6 --max-time 18 -H 'Cache-Control: no-cache' "${options[@]}" "$url/?official_logo_proof=${GITHUB_RUN_ID}-$attempt-$label" -o "$scratch/$label-bypass.html" || return 1
            for page in default bypass; do
              grep -Fq 'data-zvq-official-logo="20261008-zevaryq-identity-v2"' "$scratch/$label-$page.html" || return 1
              grep -Fq 'data-zvq-logo-integrity="sha256-a74790a590757e6f4425d384fdc0cdf40cb8030807eb7c0892ba8aaa4e6fc6cc"' "$scratch/$label-$page.html" || return 1
              node scripts/verify-zvq-logo-placement.mjs "$scratch/$label-$page.html" || return 1
              grep -Fq "EXPECTED_CHAIN='0x560c'" "$scratch/$label-$page.html" || return 1
            done
            curl -fLsS --connect-timeout 6 --max-time 20 "${options[@]}" "$url/zevaryq-assets/zevaryq-master-v2.svg?v=20261008-zevaryq-identity-v2" -o "$scratch/$label-master.svg" || return 1
            [[ "$(sha256sum "$scratch/$label-master.svg" | cut -d' ' -f1)" == "$logo_sha" ]] || return 1
            echo "official_logo_$label=verified; placements=2; identity_v2_sha256=$logo_sha"
          }
          verified=false
          for attempt in $(seq 1 18); do
            dns="$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u || true)"
            echo "attempt=$attempt public_dns=$dns"
            if [[ "$dns" == "$origin" ]] && verify origin "$attempt" && verify public "$attempt"; then
              verified=true
              break
            fi
            if [[ "$attempt" -lt 18 ]]; then sleep 12; fi
          done
          if [[ "$verified" != true ]]; then
            echo "::error::The approved Identity V2 master mark is not yet proven on both trusted origin and public domain. No DNS, Worker, NGINX, RPC, validator or chain changes were made."
            exit 1
          fi
      - name: Diagnose exact public and origin logo after proof failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          host=explorer.kriptoaman.com
          for mode in origin public; do
            opts=()
            if [[ "$mode" == origin ]]; then opts=(--resolve "$host:443:146.190.93.254"); fi
            dir="$(mktemp -d)"
            code="$(curl -LsS --connect-timeout 6 --max-time 20 -H 'Cache-Control: no-cache' "${opts[@]}" -o "$dir/index.html" -w '%{http_code}' "https://$host/?zvq_logo_diag=$GITHUB_RUN_ID-$mode" || true)"
            marker="$(grep -o 'data-zvq-official-logo="[^"]*"' "$dir/index.html" 2>/dev/null | head -1 || true)"
            integrity="$(grep -o 'data-zvq-logo-integrity="[^"]*"' "$dir/index.html" 2>/dev/null | head -1 || true)"
            placements="$(grep -o 'class="official-emblem"' "$dir/index.html" 2>/dev/null | wc -l || true)"
            echo "logo_diagnosis route=$mode html_http=$code placements=$placements marker=$marker integrity=$integrity"
            asset=zevaryq-master-v2.svg
            code="$(curl -LsS --connect-timeout 6 --max-time 20 -H 'Cache-Control: no-cache' "${opts[@]}" -o "$dir/$asset" -w '%{http_code}' "https://$host/zevaryq-assets/$asset?v=20261008-zevaryq-identity-v2" || true)"
            actual="$(sha256sum "$dir/$asset" 2>/dev/null | cut -d' ' -f1 || true)"
            echo "logo_diagnosis route=$mode asset=$asset http=$code sha256=$actual"
            rm -rf "$dir"
          done
      - name: Publish independent logo proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROBE_OUTCOME" == success ]]; then state=success; message='Exact ZEVARYQ Identity V2 master mark verified on origin and public site'; else state=failure; message='ZEVARYQ Identity V2 public/origin proof incomplete'; fi
          payload="$(jq -nc --arg state "$state" --arg description "$message" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state, context:"kriptoaman/zvq-official-logo-public", description:$description, target_url:$target_url}')"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
