name: Cloudflare Credential Presence Gate

on:
  push:
    branches:
      - chore/cloudflare-credential-presence-gate

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credential presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=missing"
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN=present"
          fi
          if [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=missing"
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID=present"
          fi
          if [ "$missing" -ne 0 ]; then
            echo "cloudflare_provisioning_ready=false"
            exit 2
          fi
          echo "cloudflare_provisioning_ready=true"
