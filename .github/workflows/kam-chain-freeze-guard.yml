name: KAM Chain Freeze Guard

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'chain/kam-mainnet/**'
      - '.github/workflows/kam-chain-freeze-guard.yml'
  push:
    branches: ["main"]
    paths:
      - 'chain/kam-mainnet/**'
      - '.github/workflows/kam-chain-freeze-guard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kam-chain-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Test protected-path merge attribution contract
        run: node --test tests/kam-chain-freeze-guard.test.mjs

      - name: Verify KAM network remains in protected candidate state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('chain/kam-mainnet/network-profile.json','utf8'));
          const expected = {
            status: 'mainnet-candidate-not-public',
            candidateChainId: 22028,
            candidateChainIdHex: '0x560c',
            consensus: 'QBFT',
            validatorCount: 4,
            blockPeriodSeconds: 3,
            rpcTarget: 'https://rpc.kriptoaman.com',
            explorerTarget: 'https://explorer.kriptoaman.com',
            reuseTestnetKeys: false,
            publicRpcDirectValidatorExposure: false,
            commercialLaunchEnabled: false,
          };
          const bad = Object.entries(expected).filter(([k,v]) => p[k] !== v);
          if (bad.length) {
            console.error('Protected KAM profile changed:', bad);
            process.exit(1);
          }
          console.log('KAM protected profile unchanged.');
          NODE

      - name: Require reviewed KAM changes on main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- 'chain/kam-mainnet/**' '.github/workflows/kam-chain-freeze-guard.yml' || true)
          if [ -z "$CHANGED" ]; then
            echo 'No KAM protected-path files changed in this push.'
            exit 0
          fi

          echo 'KAM protected-path files changed on main:'
          echo "$CHANGED"

          # Commit-title conventions are advisory only: custom squash titles may
          # omit (#123), while a direct push could forge one. Require GitHub's
          # exact merged-PR association for the pushed commit, failing closed.
          echo 'Checking authoritative GitHub PR association for protected-path changes.'
          verified=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if pulls="$(curl --fail-with-body -sS --connect-timeout 8 --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${AFTER}/pulls")"; then
              if jq -e --arg sha "$AFTER" \
                'if type == "array" then any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) else false end' \
                <<<"$pulls" >/dev/null; then
                verified=true
                break
              fi
            fi
            if [ "$attempt" -lt 8 ]; then sleep 8; fi
          done
          if [ "$verified" != true ]; then
            echo 'Protected-path commit is not independently associated with an actual merged main PR.' >&2
            echo 'Use an isolated PR with normal review/security gates. See Issue #166.' >&2
            exit 1
          fi
          echo 'GitHub confirms this exact commit was merged by a PR into main; candidate invariants unchanged.'

      - name: Confirm isolated review path for KAM changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo 'KAM chain changes require isolated review and promotion/security gates before merge.'
          echo 'No genesis, validator, Chain ID, QBFT, RPC, explorer, or exposure change is approved by this guard alone.'
