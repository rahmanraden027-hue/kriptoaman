name: QoryVEx Streaming Production Cutover

on:
  pull_request:
    paths:
      - 'services/kriptoaman-indexer/**'
      - 'scripts/deploy-kriptoaman-zvq-indexer.sh'
      - 'scripts/zvq-rpc-allowlist-gateway.mjs'
      - 'scripts/deploy-zvq-rpc-sentry-allowlist.sh'
      - 'tests/qoryvex-discovery-model.test.mjs'
      - 'tests/zvq-rpc-allowlist-gateway.test.mjs'
      - '.github/workflows/qoryvex-streaming-cutover.yml'
  push:
    branches: [main]
    paths:
      - 'services/kriptoaman-indexer/**'
      - 'scripts/deploy-kriptoaman-zvq-indexer.sh'
      - 'scripts/zvq-rpc-allowlist-gateway.mjs'
      - 'scripts/deploy-zvq-rpc-sentry-allowlist.sh'
      - '.github/workflows/qoryvex-streaming-cutover.yml'

permissions:
  contents: read

concurrency:
  group: qoryvex-streaming-production-cutover
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate streaming layer and guarded deployment
        shell: bash
        run: |
          set -euo pipefail
          node --check services/kriptoaman-indexer/discovery-model.mjs
          node --check services/kriptoaman-indexer/zvq-listener.mjs
          node --check scripts/zvq-rpc-allowlist-gateway.mjs
          bash -n scripts/deploy-kriptoaman-zvq-indexer.sh
          bash -n scripts/deploy-zvq-rpc-sentry-allowlist.sh
          node --test tests/qoryvex-discovery-model.test.mjs tests/zvq-rpc-allowlist-gateway.test.mjs
          ! grep -REn 'eth_sendRawTransaction|personal_|admin_|debug_' services/kriptoaman-indexer
          ! grep -REn 'PRIVATE_KEY|MNEMONIC|SEED_PHRASE' services/kriptoaman-indexer scripts/deploy-kriptoaman-zvq-indexer.sh

  runner-preflight:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 8
    steps:
      - name: Read-only Explorer host and private node topology preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "kam-explorer-blockscout-01"
          sudo -n true
          cd /opt/blockscout/docker-compose
          proxy_id="$(docker compose ps -q proxy)"
          test -n "$proxy_id"
          network_mode="$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$proxy_id")"
          echo "explorer_proxy_network_mode=$network_mode"
          echo "indexer_port_8765_listeners=$(ss -H -ltn '( sport = :8765 )' | wc -l)"

          ws_probe() {
            node - "$1" <<'NODE'
          const url=process.argv[2];
          let ws,doneFlag=false;
          const finish=(code)=>{ if(doneFlag)return; doneFlag=true; clearTimeout(timer); try{ws.close()}catch{}; setTimeout(()=>process.exit(code),10); };
          const timer=setTimeout(()=>finish(1),5000);
          try{ws=new WebSocket(url)}catch{finish(1)}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})));
          ws.addEventListener('message',e=>{
            try{
              const x=JSON.parse(String(e.data));
              if(x.id===1){ if(x.result!=='0x560c') return finish(1); ws.send(JSON.stringify({jsonrpc:'2.0',id:2,method:'eth_subscribe',params:['newHeads']})); }
              else if(x.id===2 && typeof x.result==='string' && x.result) finish(0);
            }catch{finish(1)}
          });
          ws.addEventListener('error',()=>finish(1));
          ws.addEventListener('close',()=>{if(!doneFlag)finish(1)});
          NODE
          }

          found=0
          for entry in recovery:10.104.0.8 intelligence:10.104.0.6 sentry:10.104.0.2; do
            label="${entry%%:*}"
            host="${entry#*:}"
            http=no
            ws=no
            chain="$(curl --noproxy '*' -sS --connect-timeout 3 --max-time 6 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              "http://$host:8545" | jq -r '.result // empty' 2>/dev/null || true)"
            test "$chain" != 0x560c || http=yes
            if ws_probe "ws://$host:8546" >/dev/null 2>&1; then ws=yes; fi
            echo "candidate_$label http_rpc=$http websocket_subscription=$ws"
            if test "$http" = yes && test "$ws" = yes; then
              found=$((found+1))
            fi
          done
          test "$found" -ge 1
          echo "qoryvex_explorer_readonly_preflight=pass viable_private_nodes=$found"

  deploy:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'QORYVEX STREAMING CUTOVER 20260930')
    needs: validate
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - name: Stage guarded streaming artifacts
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new             services/kriptoaman-indexer/zvq-listener.mjs             services/kriptoaman-indexer/discovery-model.mjs             scripts/deploy-kriptoaman-zvq-indexer.sh             scripts/zvq-rpc-allowlist-gateway.mjs             scripts/deploy-zvq-rpc-sentry-allowlist.sh             root@206.189.36.15:/tmp/

      - name: Preview first-party WebSocket indexer
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15             "GITHUB_RUN_ID=$GITHUB_RUN_ID SOURCE=/tmp/zvq-listener.mjs MODEL_SOURCE=/tmp/discovery-model.mjs bash /tmp/deploy-kriptoaman-zvq-indexer.sh preview"

      - name: Apply loopback-only WebSocket indexer
        id: indexer_apply
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15             "GITHUB_RUN_ID=$GITHUB_RUN_ID SOURCE=/tmp/zvq-listener.mjs MODEL_SOURCE=/tmp/discovery-model.mjs bash /tmp/deploy-kriptoaman-zvq-indexer.sh apply"

      - name: Preview blue-green public gateway
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15             "ZVQ_RPC_CUTOVER_RUN_ID=$GITHUB_RUN_ID bash /tmp/deploy-zvq-rpc-sentry-allowlist.sh preview"

      - name: Apply blue-green gateway
        id: gateway_apply
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15             "ZVQ_RPC_CUTOVER_RUN_ID=$GITHUB_RUN_ID bash /tmp/deploy-zvq-rpc-sentry-allowlist.sh apply"

      - name: Roll back indexer if staging fails
        if: failure() && steps.indexer_apply.outcome == 'success'
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15             "GITHUB_RUN_ID=$GITHUB_RUN_ID SOURCE=/tmp/zvq-listener.mjs MODEL_SOURCE=/tmp/discovery-model.mjs bash /tmp/deploy-kriptoaman-zvq-indexer.sh rollback"

  external-verify:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'QORYVEX STREAMING CUTOVER 20260930')
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public RPC and WebSocket-backed discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          rpc() {
            curl -fsS --retry 2 --retry-all-errors --connect-timeout 7 --max-time 18               -H 'Origin: https://explorer.kriptoaman.com'               -H 'Content-Type: application/json'               --data "$1" https://rpc.kriptoaman.com/
          }
          test "$(rpc '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' | jq -r '.result')" = 0x560c
          a="$(rpc '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' | jq -r '.result')"
          sleep 12
          b="$(rpc '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' | jq -r '.result')"
          test $((16#${b#0x})) -gt $((16#${a#0x}))

          for method in admin_peers debug_traceTransaction eth_sendRawTransaction; do
            params='[]'; test "$method" = eth_sendRawTransaction && params='["0x00"]'
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'Origin: https://explorer.kriptoaman.com' -H 'Content-Type: application/json'               --data "{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"$method\",\"params\":$params}"               https://rpc.kriptoaman.com/)"
            test "$code" = 403
          done

          code="$(curl -sS --retry 3 --retry-all-errors --connect-timeout 7 --max-time 18             -o /tmp/qoryvex.json -w '%{http_code}'             -H 'Origin: https://kriptoaman.com' -H 'Accept: application/json'             https://rpc.kriptoaman.com/qoryvex/v1/discovery)"
          test "$code" = 200
          jq -e '
            .status=="live" and
            .version>=2 and
            .chainId==22028 and
            .chainIdHex=="0x560c" and
            .websocketSubscribed==true and
            .streamFresh==true and
            .source.ownership=="first-party" and
            .source.transport=="WebSocket+JSON-RPC" and
            (.latency.samples>=1) and
            (.events|type=="array") and
            (all(.events[]?;
              (.discovery.kind!="NEW_TOKEN") or
              (
                .discovery.passport.classification=="verified-token" and
                .discovery.passport.tokenStandard=="ERC-20" and
                .discovery.launchDNA.fingerprint.metadataProven==true
              )
            ))
          ' /tmp/qoryvex.json >/dev/null

          health="$(curl -fsS --connect-timeout 7 --max-time 18 -H 'Origin: https://kriptoaman.com' https://rpc.kriptoaman.com/qoryvex/health)"
          jq -e '.status=="live" and .version>=2 and .chainId==22028 and .websocketSubscribed==true and (.latency.samples>=1)' <<<"$health" >/dev/null

          legacy="$(curl -fsS --connect-timeout 7 --max-time 25 https://kriptoaman.com/api/zvq-token-intelligence)"
          jq -e '.status=="live" and .chainId==22028 and .provenance.ownership=="first-party" and .truthPolicy.contractCreationIsTokenListing==false' <<<"$legacy" >/dev/null
          echo "qoryvex_streaming_external_gate=pass"

  settle:
    if: always() && needs.deploy.result == 'success'
    needs: [deploy, external-verify]
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 8
    steps:
      - name: Finalize or roll back whole streaming cutover
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ needs.external-verify.result }}" = success; then
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15               "ZVQ_RPC_CUTOVER_RUN_ID=$GITHUB_RUN_ID bash /tmp/deploy-zvq-rpc-sentry-allowlist.sh finalize"
            echo "qoryvex_streaming_cutover=committed"
          else
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15               "ZVQ_RPC_CUTOVER_RUN_ID=$GITHUB_RUN_ID bash /tmp/deploy-zvq-rpc-sentry-allowlist.sh rollback" || true
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15               "GITHUB_RUN_ID=$GITHUB_RUN_ID SOURCE=/tmp/zvq-listener.mjs MODEL_SOURCE=/tmp/discovery-model.mjs bash /tmp/deploy-kriptoaman-zvq-indexer.sh rollback" || true
            exit 1
          fi
