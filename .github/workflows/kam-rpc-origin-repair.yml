name: KAM RPC Origin Repair

on:
  push:
    branches: [ops/kam-readonly-20260918]
    paths:
      - '.github/workflows/kam-rpc-origin-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Checkout reviewed production code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify recovery origin identity, progression, and RPC boundary
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='http://152.42.199.82/rpc'
          rpc() {
            local method="$1" params="${2:-[]}"
            curl -fsS --connect-timeout 5 --max-time 10 \
              -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" \
              "$ORIGIN"
          }
          CHAIN="$(rpc eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          test "$CHAIN" = '0x560c'
          B1="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          sleep 7
          B2="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          node - "$B1" "$B2" <<'NODE'
          const a=BigInt(process.argv[2]); const b=BigInt(process.argv[3]);
          if (b <= a) throw new Error(`block height did not advance: ${a} -> ${b}`);
          console.log(`origin_block_progress=${a}->${b}`);
          NODE
          for method in admin_peers debug_traceTransaction personal_listAccounts qbft_getValidatorsByBlockNumber; do
            BODY="$(rpc "$method" '["latest"]' || true)"
            node - "$BODY" <<'NODE'
          const p=JSON.parse(process.argv[2]);
          if (!p.error || ![-32601,-32604].includes(Number(p.error.code))) throw new Error(`privileged RPC not blocked: ${process.argv[2]}`);
          NODE
          done
          echo 'recovery_origin_verified=true'

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify hostname-resolved recovery origin
        shell: bash
        run: |
          set -euo pipefail
          HOST='152-42-199-82.sslip.io'
          RESOLVED="$(getent ahostsv4 "$HOST" | awk 'NR==1{print $1}' || true)"
          echo "origin_hostname_resolves_to=$RESOLVED"
          test "$RESOLVED" = '152.42.199.82'
          curl -fsS --connect-timeout 5 --max-time 10 "http://$HOST/health" -o /tmp/origin-health.json
          node - /tmp/origin-health.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!(p.status==='ok' && p.chainId==='0x560c')) throw new Error(`unexpected origin health: ${JSON.stringify(p)}`);
          NODE
          BODY="$(curl -fsS --connect-timeout 5 --max-time 10 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "http://$HOST/rpc")"
          test "$(node -e "const p=JSON.parse(process.argv[1]);process.stdout.write(p.result||'')" "$BODY")" = '0x560c'
          echo 'hostname_origin_verified=true'

      - name: Point Worker to hostname-resolved verified recovery origin
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.134.0 deploy \
            --keep-vars \
            --var 'KAM_RPC_ORIGIN:http://152-42-199-82.sslip.io/rpc' \
            --message 'Recover KAM public RPC via hostname-resolved verified recovery origin'

      - name: Verify public RPC recovered
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          for attempt in $(seq 1 18); do
            CODE="$(curl -sS --max-time 15 -o /tmp/ready.json -w '%{http_code}' https://rpc.kriptoaman.com/ready || true)"
            if [ "$CODE" = '200' ] && node - /tmp/ready.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!(p.ready===true && p.chainId==='0x560c' && Number.isInteger(p.blockNumber) && p.blockNumber>=0)) process.exit(1);
          console.log(`public_rpc_ready block=${p.blockNumber}`);
          NODE
            then READY=true; break; fi
            echo "readiness_attempt=$attempt http=$CODE body=$(cat /tmp/ready.json 2>/dev/null || true)"
            test "$attempt" -lt 18
            sleep 10
          done
          test "$READY" = true
          rpc_public() {
            local method="$1" params="${2:-[]}"
            curl -fsS --max-time 15 -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" \
              https://rpc.kriptoaman.com
          }
          test "$(rpc_public eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")" = '0x560c'
          B1="$(rpc_public eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          sleep 7
          B2="$(rpc_public eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          node - "$B1" "$B2" <<'NODE'
          const a=BigInt(process.argv[2]); const b=BigInt(process.argv[3]); if (b<=a) throw new Error(`public blocks stalled ${a}->${b}`); console.log(`public_block_progress=${a}->${b}`);
          NODE
          ADMIN_CODE="$(curl -sS -o /tmp/admin.json -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"admin_peers","params":[]}' https://rpc.kriptoaman.com)"
          test "$ADMIN_CODE" = '403'
          echo 'public_rpc_recovery_verified=true'
