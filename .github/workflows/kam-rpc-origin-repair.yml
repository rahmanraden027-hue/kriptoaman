name: KAM RPC Origin Repair

on:
  push:
    branches: [ops/kam-readonly-20260918]
    paths:
      - '.github/workflows/kam-rpc-origin-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Checkout clean production gateway
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify recovery origin before any edge change
        shell: bash
        run: |
          set -euo pipefail
          HOST='152-42-199-82.sslip.io'
          test "$(getent ahostsv4 "$HOST" | awk 'NR==1{print $1}')" = '152.42.199.82'
          curl -fsS --max-time 10 "http://$HOST/health" -o /tmp/health.json
          node - /tmp/health.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!(p.status==='ok' && p.chainId==='0x560c')) throw new Error('KAM origin health mismatch');
          NODE
          rpc(){ curl -fsS --max-time 10 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":[]}" "http://$HOST/rpc"; }
          test "$(rpc eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")" = '0x560c'
          B1="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          sleep 7
          B2="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          node - "$B1" "$B2" <<'NODE'
          const a=BigInt(process.argv[2]), b=BigInt(process.argv[3]); if (b<=a) throw new Error(`origin block stalled ${a}->${b}`); console.log(`origin_block_progress=${a}->${b}`);
          NODE

      - name: Persist verified origin as Worker secret
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' 'http://152-42-199-82.sslip.io/rpc' | npx --yes wrangler@4.134.0 secret put KAM_RPC_ORIGIN
          npx --yes wrangler@4.134.0 secret list | grep -q 'KAM_RPC_ORIGIN'
          echo 'kam_rpc_origin_secret_verified=true'

      - name: Deploy clean production gateway from main
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.134.0 deploy --message 'Final KAM public RPC recovery using verified persistent origin secret'

      - name: Verify public RPC identity, progression, and security boundary
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          for attempt in $(seq 1 12); do
            CODE="$(curl -sS --max-time 15 -o /tmp/ready.json -w '%{http_code}' https://rpc.kriptoaman.com/ready || true)"
            if [ "$CODE" = '200' ] && node - /tmp/ready.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!(p.ready===true && p.chainId==='0x560c' && Number.isInteger(p.blockNumber))) process.exit(1);
          console.log(`public_rpc_ready block=${p.blockNumber}`);
          NODE
            then READY=true; break; fi
            echo "ready_attempt=$attempt http=$CODE body=$(cat /tmp/ready.json 2>/dev/null || true)"
            sleep 5
          done
          test "$READY" = true
          rpc(){ curl -fsS --max-time 15 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":[]}" https://rpc.kriptoaman.com; }
          test "$(rpc eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")" = '0x560c'
          B1="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          sleep 7
          B2="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          node - "$B1" "$B2" <<'NODE'
          const a=BigInt(process.argv[2]), b=BigInt(process.argv[3]); if (b<=a) throw new Error(`public block stalled ${a}->${b}`); console.log(`public_block_progress=${a}->${b}`);
          NODE
          for method in admin_peers debug_traceTransaction personal_listAccounts qbft_getValidatorsByBlockNumber; do
            CODE="$(curl -sS -o /tmp/blocked.json -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":[]}" https://rpc.kriptoaman.com)"
            test "$CODE" = '403'
          done
          echo 'public_rpc_final_recovery_verified=true'
