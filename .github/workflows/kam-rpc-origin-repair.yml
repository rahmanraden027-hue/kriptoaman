name: KAM RPC Origin Repair

on:
  push:
    branches: [ops/kam-readonly-20260918]
    paths:
      - '.github/workflows/kam-rpc-origin-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout reviewed production code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify recovery origin identity, progression, and RPC boundary
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='http://152.42.199.82/rpc'
          rpc() {
            local method="$1" params="${2:-[]}"
            curl -fsS --connect-timeout 5 --max-time 10 \
              -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" \
              "$ORIGIN"
          }
          CHAIN="$(rpc eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          test "$CHAIN" = '0x560c'
          B1="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          sleep 7
          B2="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          node - "$B1" "$B2" <<'NODE'
          const a=BigInt(process.argv[2]); const b=BigInt(process.argv[3]);
          if (b <= a) throw new Error(`block height did not advance: ${a} -> ${b}`);
          console.log(`origin_block_progress=${a}->${b}`);
          NODE
          for method in admin_peers personal_listAccounts qbft_getValidatorsByBlockNumber; do
            BODY="$(rpc "$method" '["latest"]' || true)"
            node - "$BODY" <<'NODE'
          const p=JSON.parse(process.argv[2]);
          if (!p.error || ![-32601,-32604].includes(Number(p.error.code))) throw new Error(`privileged RPC not blocked: ${process.argv[2]}`);
          NODE
          done
          echo 'recovery_origin_verified=true'

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Point Worker to verified recovery origin
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'http://152.42.199.82/rpc' | npx --yes wrangler@4.36.0 secret put KAM_RPC_ORIGIN
          npx --yes wrangler@4.36.0 deploy

      - name: Verify public RPC recovered
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://rpc.kriptoaman.com/ready -o /tmp/ready.json; then
              if node - /tmp/ready.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!(p.ready===true && p.chainId==='0x560c' && Number.isInteger(p.blockNumber) && p.blockNumber>=0)) process.exit(1);
          console.log(`public_rpc_ready block=${p.blockNumber}`);
          NODE
              then break; fi
            fi
            test "$attempt" -lt 6
            sleep 10
          done
          rpc_public() {
            local method="$1" params="${2:-[]}"
            curl -fsS --max-time 15 -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" \
              https://rpc.kriptoaman.com
          }
          test "$(rpc_public eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")" = '0x560c'
          ADMIN_CODE="$(curl -sS -o /tmp/admin.json -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"admin_peers","params":[]}' https://rpc.kriptoaman.com)"
          test "$ADMIN_CODE" = '403'
          echo 'public_rpc_recovery_verified=true'
