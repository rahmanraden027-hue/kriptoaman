name: Phase 10I HomeV10 Visual Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FullAppShell.jsx'
      - 'src/pages/HomeV10.jsx'
      - 'src/components/home-v10/**'
      - 'src/hooks/useMarketSurface.js'
      - 'tests/phase10i-home-v10-preview.test.mjs'
      - '.github/workflows/phase10i-home-v10-preview.yml'

permissions:
  contents: read

jobs:
  visual-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run regression tests
        run: npm test
      - name: Build preview candidate
        run: npm run build
      - name: Start local preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ka-home-v10-preview.log 2>&1 &
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/preview/home-v10 -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ka-home-v10-preview.log || true
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture matrix and check horizontal overflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase10i-evidence
          cat > phase10i-preview.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const target = 'http://127.0.0.1:4173/preview/home-v10';
          const productionOrigin = 'https://kriptoaman.com';
          const viewports = [
            { width: 390, height: 844, label: 'mobile' },
            { width: 768, height: 1024, label: 'tablet' },
            { width: 1440, height: 1080, label: 'desktop' },
          ];

          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failed = false;

          for (const viewport of viewports) {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();

            await page.route('**/api/**', async (route) => {
              const original = new URL(route.request().url());
              const productionUrl = productionOrigin + original.pathname + original.search;
              try {
                const response = await route.fetch({
                  url: productionUrl,
                  headers: { Accept: 'application/json' },
                  timeout: 15000,
                });
                await route.fulfill({ response });
              } catch (error) {
                console.log('proxy-fallback', productionUrl, String(error));
                await route.continue();
              }
            });

            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(12000);

            const result = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollHeight: document.documentElement.scrollHeight,
              hasFeatured: document.body.innerText.includes('MOVING NOW'),
              hasMovers: document.body.innerText.includes('Top Movers'),
              hasVerify: document.body.innerText.includes('VERIFY ANYTHING'),
              marketUnavailable: document.body.innerText.includes('Market data unavailable'),
              bodyText: document.body.innerText.slice(0, 1400),
            }));

            result.label = viewport.label;
            result.width = viewport.width;
            result.height = viewport.height;
            results.push(result);
            console.log(viewport.label, JSON.stringify(result));

            await page.screenshot({
              path: `phase10i-evidence/home-v10-${viewport.label}-${viewport.width}.png`,
              fullPage: true,
            });

            if (result.scrollWidth > result.clientWidth + 1) failed = true;
            if (!result.hasFeatured || !result.hasMovers || !result.hasVerify) failed = true;
            await context.close();
          }

          writeFileSync('phase10i-evidence/preview-matrix.json', JSON.stringify(results, null, 2));
          await browser.close();
          if (failed) process.exit(1);
          JS
          node phase10i-preview.mjs
      - name: WCAG 2 AA scan
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pa11y.json <<'JSON'
          {
            "standard": "WCAG2AA",
            "timeout": 180000,
            "wait": 4500,
            "gotoOptions": { "waitUntil": "domcontentloaded" },
            "chromeLaunchConfig": { "args": ["--no-sandbox", "--disable-setuid-sandbox"] }
          }
          JSON
          npx -y pa11y@9.0.0 --config /tmp/pa11y.json --reporter json \
            http://127.0.0.1:4173/preview/home-v10 > phase10i-evidence/pa11y-home-v10.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10i-home-v10-visual-evidence
          path: phase10i-evidence
          retention-days: 14
