name: KAM RPC Durable Origin Recovery

on:
  push:
    branches: [fix/kam-rpc-origin-secret-20260918]
    paths:
      - 'chain/kam-mainnet/public-rpc-gateway/**'
      - '.github/workflows/kam-rpc-origin-secret-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify gateway tests
        run: node --test tests/kam-rpc-security.test.mjs

      - name: Set durable upstream secret
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'http://152-42-199-82.sslip.io/rpc' | npx --yes wrangler@4.134.0 secret put KAM_RPC_UPSTREAM
          npx --yes wrangler@4.134.0 secret list | grep -q 'KAM_RPC_UPSTREAM'
          echo 'durable_upstream_secret_verified=true'

      - name: Deploy clean gateway using durable secret
        working-directory: chain/kam-mainnet/public-rpc-gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.134.0 deploy --message 'KAM RPC durable origin secret recovery'

      - name: Verify public RPC end to end
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          for attempt in $(seq 1 12); do
            CODE="$(curl -sS --max-time 15 -o /tmp/ready.json -w '%{http_code}' https://rpc.kriptoaman.com/ready || true)"
            if [ "$CODE" = '200' ] && node - /tmp/ready.json <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!(p.ready===true && p.chainId==='0x560c' && Number.isInteger(p.blockNumber))) process.exit(1);
          console.log(`ready_block=${p.blockNumber}`);
          NODE
            then READY=true; break; fi
            echo "ready_attempt=$attempt http=$CODE body=$(cat /tmp/ready.json 2>/dev/null || true)"
            sleep 5
          done
          test "$READY" = true
          rpc(){ curl -fsS --max-time 15 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":[]}" https://rpc.kriptoaman.com; }
          test "$(rpc eth_chainId | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")" = '0x560c'
          B1="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          sleep 7
          B2="$(rpc eth_blockNumber | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).result||''))")"
          node - "$B1" "$B2" <<'NODE'
          const a=BigInt(process.argv[2]), b=BigInt(process.argv[3]); if (b<=a) throw new Error(`public block stalled ${a}->${b}`); console.log(`public_block_progress=${a}->${b}`);
          NODE
          for method in admin_peers debug_traceTransaction personal_listAccounts qbft_getValidatorsByBlockNumber; do
            CODE="$(curl -sS -o /tmp/blocked.json -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":[]}" https://rpc.kriptoaman.com)"
            test "$CODE" = '403'
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://rpc.kriptoaman.com/transport-diagnostic || true)"
          test "$code" = '405'
          echo 'kam_rpc_durable_recovery_verified=true'
