name: Temporary Lockfile Sync
on:
  push:
    branches:
      - codex/kriptoaman-3d-command-center
    paths:
      - package.json
      - .github/workflows/temp-lockfile-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/kriptoaman-3d-command-center
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Verify clean install metadata
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): synchronize patched dependency lockfile"
          git push origin HEAD:codex/kriptoaman-3d-command-center
