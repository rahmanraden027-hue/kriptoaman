name: KAM New Host Connectivity

on:
  pull_request:
    paths:
      - '.github/workflows/kam-new-host-connectivity.yml'
      - 'scripts/finalize-zvq-rpc-origin-https.sh'
      - 'scripts/zvq-rpc-allowlist-gateway.mjs'
      - 'tests/zvq-rpc-allowlist-gateway.test.mjs'
  workflow_dispatch:
    inputs:
      confirm_rpc_tls:
        description: 'I explicitly authorize installing TLS on the existing RPC sentry, after all safety checks pass'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kam-new-host-connectivity
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment script syntax
        run: bash -n scripts/finalize-zvq-rpc-origin-https.sh
      - name: Verify RPC method allowlist and deployment guard
        run: node --test tests/zvq-rpc-allowlist-gateway.test.mjs

  verify-admin-path:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_rpc_tls == true }}
    needs: validate
    runs-on: [self-hosted, linux, x64, kam-mainnet-evidence]
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Verify SSH administration path to new KAM hosts
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            "validator-02|134.209.157.125"
            "validator-03|134.199.158.210"
            "validator-04|165.227.169.128"
            "rpc-sentry|206.189.36.15"
          )
          mkdir -p artifacts
          : > artifacts/kam-new-host-connectivity.txt
          for entry in "${targets[@]}"; do
            name="${entry%%|*}"
            host="${entry##*|}"
            echo "checking=${name}" | tee -a artifacts/kam-new-host-connectivity.txt
            ssh -o BatchMode=yes                 -o ConnectTimeout=8                 -o StrictHostKeyChecking=accept-new                 root@"${host}"                 'printf "ssh_ready=true\n"; uname -srm; timedatectl show -p NTPSynchronized --value 2>/dev/null || true'                 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[redacted-ip]/g'                 | tee -a artifacts/kam-new-host-connectivity.txt
          done

      - name: Finalize isolated HTTPS on existing RPC sentry
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new \
            scripts/finalize-zvq-rpc-origin-https.sh scripts/zvq-rpc-allowlist-gateway.mjs root@206.189.36.15:/tmp/
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@206.189.36.15 \
            'env ZVQ_RPC_TLS_RUN_ID='"$GITHUB_RUN_ID"' bash /tmp/finalize-zvq-rpc-origin-https.sh'

      - name: Verify trusted direct RPC HTTPS externally
        shell: bash
        run: |
          set -euo pipefail
          origin='https://206.189.36.15'
          chain="$(curl --noproxy '*' --fail-with-body -sS --connect-timeout 6 --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$origin/" | jq -er '.result')"
          head1="$(curl --noproxy '*' --fail-with-body -sS --connect-timeout 6 --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' "$origin/" | jq -er '.result')"
          sleep 4
          head2="$(curl --noproxy '*' --fail-with-body -sS --connect-timeout 6 --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' "$origin/" | jq -er '.result')"
          test "$chain" = 0x560c
          [[ "$head1" =~ ^0x[0-9a-fA-F]+$ && "$head2" =~ ^0x[0-9a-fA-F]+$ ]]
          test $((16#${head2#0x})) -ge $((16#${head1#0x}))
          denied="$(curl --noproxy '*' -sS --connect-timeout 6 --max-time 10 -o /dev/null -w '%{http_code}' -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":4,"method":"admin_peers","params":[]}' "$origin/")"
          test "$denied" = 403
          write_denied="$(curl --noproxy '*' -sS --connect-timeout 6 --max-time 10 -o /dev/null -w '%{http_code}' -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":5,"method":"eth_sendRawTransaction","params":["0x01"]}' "$origin/")"
          test "$write_denied" = 403
          echo "rpc_origin_tls=trusted; chain_id=$chain; block_progress=verified; admin_rpc=blocked"

      - name: Upload redacted connectivity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-new-host-connectivity
          path: artifacts/kam-new-host-connectivity.txt
          if-no-files-found: error
          retention-days: 7
