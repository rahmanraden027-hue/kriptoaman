name: ZEVARYQ Landing Live Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kam-landing-live:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for production deployment
        run: sleep 35

      - name: Verify live landing bundle and ZEVARYQ isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://kriptoaman.com';

          async function get(path, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 40000);
            try {
              const response = await fetch(base + path, {
                redirect: 'follow',
                signal: controller.signal,
                headers: { 'User-Agent': 'KriptoAman-ZEVARYQ-Landing-Smoke/1.0', ...(options.headers || {}) },
              });
              const text = await response.text();
              return { response, text };
            } finally {
              clearTimeout(timer);
            }
          }

          const zevaryq = await get('/api/zevaryq/network-status', { headers: { Accept: 'application/json' } });
          if (!zevaryq.response.ok) throw new Error(`ZEVARYQ status HTTP ${zevaryq.response.status}`);
          const zevaryqPayload = JSON.parse(zevaryq.text);
          if (zevaryqPayload?.verified !== true || Number(zevaryqPayload?.chainId) !== 22028) {
            throw new Error('ZEVARYQ RPC is not independently verified with Chain ID 22028');
          }

          const publicNetworks = await get('/api/network-health', { headers: { Accept: 'application/json' } });
          if (!publicNetworks.response.ok) throw new Error(`network-health HTTP ${publicNetworks.response.status}`);
          const networkPayload = JSON.parse(publicNetworks.text);
          const online = Number(networkPayload?.summary?.online || 0);
          const total = Number(networkPayload?.summary?.total || 0);
          if (total !== 21 || online < 12) throw new Error(`public network probe set unhealthy: ${online}/${total}`);
          if ((networkPayload?.networks || []).some((item) => item?.name === 'ZEVARYQ Mainnet')) {
            throw new Error('ZEVARYQ must remain isolated from the 21-network public probe set');
          }

          const home = await get('/');
          if (!home.response.ok) throw new Error(`homepage HTTP ${home.response.status}`);
          const scriptMatches = [...home.text.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map((m) => m[1]);
          if (scriptMatches.length === 0) throw new Error('No JavaScript bundle discovered on homepage');

          let foundZevaryqNetwork = false;
          for (const src of scriptMatches.slice(0, 20)) {
            const url = src.startsWith('http') ? src : new URL(src, base).toString();
            const response = await fetch(url, { headers: { 'User-Agent': 'KriptoAman-ZEVARYQ-Landing-Smoke/1.0' } });
            if (!response.ok) continue;
            const js = await response.text();
            const hasZevaryqLabel = js.includes('ZEVARYQ Mainnet');
            const hasDirectZevaryqContract = js.includes('/api/zevaryq/network-status');
            const hasPlatformKamContract = js.includes('/api/platform-status') && js.includes('22028');
            if (hasKamLabel && (hasDirectKamContract || hasPlatformKamContract)) {
              foundZevaryqNetwork = true;
              break;
            }
          }
          if (!foundZevaryqNetwork) throw new Error('Production landing bundle does not include the current ZEVARYQ Mainnet integration contract');

          console.log(`ZEVARYQ: VERIFIED | chainId=${zevaryqPayload.chainId} block=${zevaryqPayload.blockNumber} status=${zevaryqPayload.status}`);
          console.log(`PUBLIC_NETWORKS: HEALTHY | online=${online}/${total} | ZEVARYQ isolated=true`);
          console.log('LANDING_BUNDLE: VERIFIED | ZEVARYQ Mainnet integration contract present=true');
          NODE