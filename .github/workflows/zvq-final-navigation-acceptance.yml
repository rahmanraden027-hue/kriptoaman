name: ZVQ Explorer Final Navigation Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify-zvq-final-navigation.mjs"
      - "tests/zvq-final-navigation-acceptance.test.mjs"
      - ".github/workflows/zvq-final-navigation-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-zvq-final-navigation.mjs"
      - "tests/zvq-final-navigation-acceptance.test.mjs"
      - ".github/workflows/zvq-final-navigation-acceptance.yml"
  schedule:
    - cron: '37 2 * * *'
permissions:
  contents: read
concurrency:
  group: zvq-final-navigation-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only safety contract
        run: node --test tests/zvq-final-navigation-acceptance.test.mjs
      - name: Locate isolated Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "ZVQ_CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Install isolated Playwright client
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/zvq-final-navigation" --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          echo "PLAYWRIGHT_CORE=$RUNNER_TEMP/zvq-final-navigation/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "ZVQ_NAV_EVIDENCE_DIR=$RUNNER_TEMP/zvq-final-navigation-evidence" >> "$GITHUB_ENV"
      - name: Verify live menu clicks, token routes, and mobile layout
        run: node scripts/verify-zvq-final-navigation.mjs
      - name: Save read-only navigation screenshots and JSON proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zvq-final-navigation-proof
          path: ${{ runner.temp }}/zvq-final-navigation-evidence
          if-no-files-found: warn
          retention-days: 14
