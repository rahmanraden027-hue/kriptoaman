name: sKAM Final Live Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'chain/solana-liquidity/audit-skam-live.mjs'
      - '.github/workflows/skam-final-live-audit.yml'
      - 'src/lib/skamToken2022Builder.js'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install isolated Solana audit dependencies
        working-directory: chain/solana-liquidity
        run: npm install --no-audit --no-fund

      - name: Parse final live audit
        run: node --check chain/solana-liquidity/audit-skam-live.mjs

      - name: Run read-only Solana + DEX Screener audit
        run: node chain/solana-liquidity/audit-skam-live.mjs

      - name: Upload non-secret audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skam-final-live-audit
          path: chain/solana-liquidity/artifacts/skam-final-live-audit.json
          if-no-files-found: warn
          retention-days: 30
