name: KAM RPC Readonly Diagnose

# Read-only production diagnostics. No host mutation is performed.
on:
  push:
    branches:
      - ops/kam-rpc-diagnose-20260918
    paths:
      - '.github/workflows/kam-rpc-readonly-diagnose.yml'
  pull_request:
    paths:
      - '.github/workflows/kam-rpc-readonly-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only external DNS, origin and edge diagnostics
        shell: bash
        run: |
          set +e
          RECOVERY_IP='152.42.199.82'
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "rpc_dns=$(getent ahostsv4 rpc.kriptoaman.com | awk 'NR==1{print $1}' || true)"
          echo "origin_dns=$(getent ahostsv4 kam-origin.kriptoaman.com | awk 'NR==1{print $1}' || true)"

          edge_code="$(curl -sS -o /tmp/edge.json -w '%{http_code}' --max-time 8 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            https://rpc.kriptoaman.com 2>/dev/null)"
          edge_result="$(sed -n 's/.*"result":"\([^"]*\)".*/\1/p' /tmp/edge.json | head -1)"
          echo "rpc_edge_http=${edge_code:-000} chain=${edge_result:-none}"

          explorer_code="$(curl -sS -o /tmp/blocks.json -w '%{http_code}' --max-time 8 \
            -H 'accept: application/json' https://explorer.kriptoaman.com/api/v2/blocks 2>/dev/null)"
          explorer_items="$(python3 - <<'PY'
import json
try:
    d=json.load(open('/tmp/blocks.json'))
    print(len(d.get('items') or []))
except Exception:
    print('invalid')
PY
)"
          echo "explorer_blocks_http=${explorer_code:-000} items=${explorer_items}"

          for port in 80 443 8545 8645 8646 8647 8648; do
            if timeout 3 bash -c "</dev/tcp/${RECOVERY_IP}/${port}" 2>/dev/null; then
              echo "recovery_ip_port_${port}=open"
            else
              echo "recovery_ip_port_${port}=closed_or_filtered"
            fi
          done

          origin_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 6 \
            -H 'Host: kam-origin.kriptoaman.com' "http://${RECOVERY_IP}/" 2>/dev/null)"
          rpc_host_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 6 \
            -H 'Host: rpc.kriptoaman.com' "http://${RECOVERY_IP}/" 2>/dev/null)"
          echo "recovery_origin_http=${origin_http:-000}"
          echo "recovery_rpc_host_http=${rpc_host_http:-000}"

          origin_tls="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 8 \
            --resolve "kam-origin.kriptoaman.com:443:${RECOVERY_IP}" \
            https://kam-origin.kriptoaman.com/ 2>/dev/null)"
          rpc_tls="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 8 \
            --resolve "rpc.kriptoaman.com:443:${RECOVERY_IP}" \
            https://rpc.kriptoaman.com/ 2>/dev/null)"
          echo "recovery_origin_https=${origin_tls:-000}"
          echo "recovery_rpc_host_https=${rpc_tls:-000}"
          echo "diagnostic_mode=external_read_only"

  diagnose:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 5
    steps:
      - name: Read-only host and RPC diagnostics
        shell: bash
        run: |
          set +e
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "hostname=$(hostname)"
          echo "kernel=$(uname -sr)"
          echo "disk_root=$(df -P / | awk 'NR==2{print $5}')"
          echo "service_docker=$(systemctl is-active docker 2>/dev/null || true)"
          echo "service_nginx=$(systemctl is-active nginx 2>/dev/null || true)"
          echo "service_cloudflared=$(systemctl is-active cloudflared 2>/dev/null || true)"

          probe_rpc() {
            port="$1"
            chain="$(curl -sS --max-time 3 -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              "http://127.0.0.1:${port}" 2>/dev/null | sed -n 's/.*"result":"\([^"]*\)".*/\1/p' | head -1)"
            head="$(curl -sS --max-time 3 -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' \
              "http://127.0.0.1:${port}" 2>/dev/null | sed -n 's/.*"result":"\([^"]*\)".*/\1/p' | head -1)"
            peers="$(curl -sS --max-time 3 -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":3,"method":"net_peerCount","params":[]}' \
              "http://127.0.0.1:${port}" 2>/dev/null | sed -n 's/.*"result":"\([^"]*\)".*/\1/p' | head -1)"
            if [ -n "$chain" ] || [ -n "$head" ] || [ -n "$peers" ]; then
              echo "rpc_local port=${port} chain=${chain:-none} head=${head:-none} peers=${peers:-none}"
            fi
          }

          for p in 8545 8645 8646 8647 8648; do probe_rpc "$p"; done

          if command -v docker >/dev/null 2>&1; then
            running="$(docker ps --format '{{.Names}}' 2>/dev/null | wc -l | tr -d ' ')"
            echo "docker_running_containers=${running:-unknown}"
            for name in $(docker ps --format '{{.Names}}' 2>/dev/null); do
              case "$name" in
                *besu*|*geth*|*nethermind*|*erigon*|*blockscout*|*proxy*|*nginx*)
                  echo "docker_component_detected=yes"
                  break
                  ;;
              esac
            done
          fi

          if getent ahostsv4 kam-origin.kriptoaman.com >/dev/null 2>&1; then
            echo "origin_dns_resolves=yes"
          else
            echo "origin_dns_resolves=no"
          fi

          code_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 4 \
            -H 'Host: kam-origin.kriptoaman.com' http://127.0.0.1/ 2>/dev/null)"
          echo "origin_local_http=${code_http:-000}"

          code_rpc_host="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 4 \
            -H 'Host: rpc.kriptoaman.com' http://127.0.0.1/ 2>/dev/null)"
          echo "rpc_host_local_http=${code_rpc_host:-000}"

          if command -v openssl >/dev/null 2>&1; then
            tls_subject="$(timeout 5 openssl s_client -connect 127.0.0.1:443 -servername kam-origin.kriptoaman.com </dev/null 2>/dev/null | openssl x509 -noout -subject 2>/dev/null)"
            if [ -n "$tls_subject" ]; then echo "origin_local_tls=yes"; else echo "origin_local_tls=no"; fi
          fi

          echo "diagnostic_mode=read_only"
