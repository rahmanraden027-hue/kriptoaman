name: Production Data Intelligence Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 60
      - name: Verify first-party Intelligence Graph
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --location --silent --show-error --connect-timeout 10 --max-time 35 -H 'Accept: application/json' -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "https://kriptoaman.com/api/intelligence-graph?gate=$GITHUB_RUN_ID-$attempt" || true)"
            if [ "$code" = "200" ] && node - "$body" <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p?.status!=='live'||p?.schema!=='kriptoaman.intelligence-graph.v2'||p?.chainId!==22028)process.exit(1);
          if(!Number.isInteger(Number(p?.head?.number))||Number(p.head.number)<0||!/^0x[0-9a-fA-F]{64}$/.test(String(p?.head?.hash||'')))process.exit(1);
          if(!Array.isArray(p?.graph?.nodes)||!Array.isArray(p?.graph?.edges)||!Array.isArray(p?.unavailableRelationships))process.exit(1);
          if(p?.truthPolicy?.unavailableIsZero!==false||p?.truthPolicy?.inferredRelationshipsAllowed!==false||p?.truthPolicy?.transactionSubmissionEnabled!==false)process.exit(1);
          if(p?.provenance?.ownership!=='first-party')process.exit(1);
          NODE
            then exit 0; fi
            echo "Intelligence Graph attempt $attempt failed closed: HTTP $code"; cat "$body" || true
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          exit 1
      - name: Verify first-party Genesis Radar discovery
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --location --silent --show-error --connect-timeout 10 --max-time 35 -H 'Accept: application/json' -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "https://kriptoaman.com/api/zvq-first-party-discovery?gate=$GITHUB_RUN_ID-$attempt" || true)"
            if [ "$code" = "200" ] && node - "$body" <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p?.status!=='live'||p?.chainId!==22028)process.exit(1);
          if(!Number.isInteger(Number(p?.head?.number))||Number(p.head.number)<0||!/^0x[0-9a-fA-F]{64}$/.test(String(p?.head?.hash||'')))process.exit(1);
          if(!Array.isArray(p?.observation?.scannedBlocks)||!Array.isArray(p?.observation?.contractCreations))process.exit(1);
          if(Number(p?.observation?.contractCreationCount)!==p.observation.contractCreations.length)process.exit(1);
          for(const x of p.observation.contractCreations){if(!/^0x[0-9a-fA-F]{64}$/.test(String(x?.txHash||''))||!/^0x[0-9a-fA-F]{64}$/.test(String(x?.blockHash||'')))process.exit(1);}
          if(p?.provenance?.ownership!=='first-party'||p?.provenance?.transport!=='JSON-RPC'||p?.provenance?.externalMarketProviderUsed!==false)process.exit(1);
          NODE
            then exit 0; fi
            echo "Genesis Radar attempt $attempt failed closed: HTTP $code"; cat "$body" || true
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          exit 1
      - name: Publish production data intelligence status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure; description="Production data intelligence gate failed"
          if [ "$JOB_STATUS" = "success" ]; then state=success; description="Production data intelligence gate passed"; fi
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"kriptoaman/production-data-intelligence\",\"description\":\"$description\",\"target_url\":\"$RUN_URL\"}" >/dev/null
