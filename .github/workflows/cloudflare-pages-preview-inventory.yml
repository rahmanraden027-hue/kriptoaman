name: Cloudflare Pages Preview Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory Pages deployments (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT_NAME: kriptoaman
    steps:
      - name: Validate and normalize required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CF_ACCOUNT_ID:-}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [[ -z "${CF_API_TOKEN:-}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          account_id="$(printf '%s' "${CF_ACCOUNT_ID}" | tr -d '[:space:]')"
          api_token="$(printf '%s' "${CF_API_TOKEN}" | tr -d '\r\n')"

          if [[ ! "${account_id}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not a valid 32-character hexadecimal Cloudflare Account ID."
            echo "Update the repository secret with only the Account ID value: no label, URL, spaces, or punctuation."
            exit 2
          fi

          if [[ -z "${api_token}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is empty after normalization."
            exit 2
          fi

          echo "::add-mask::${api_token}"
          printf 'CF_ACCOUNT_ID_CLEAN=%s\n' "${account_id}" >> "${GITHUB_ENV}"
          printf 'CF_API_TOKEN_CLEAN=%s\n' "${api_token}" >> "${GITHUB_ENV}"

      - name: Verify Pages project visibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-inventory
          body_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "${body_file}" \
            --write-out '%{http_code}' \
            --get \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID_CLEAN}/pages/projects" \
            --header "Authorization: Bearer ${CF_API_TOKEN_CLEAN}" \
            --header "Accept: application/json" \
            --data-urlencode "page=1" \
            --data-urlencode "per_page=100")"

          if [[ "${http_code}" != "200" ]]; then
            echo "Cloudflare Pages project-list request failed with HTTP ${http_code}."
            jq -c '{success, errors}' "${body_file}" 2>/dev/null || true
            exit 3
          fi

          if [[ "$(jq -r '.success' "${body_file}")" != "true" ]]; then
            echo "Cloudflare API returned success=false while listing Pages projects."
            jq '.errors' "${body_file}"
            exit 3
          fi

          jq -r '.result[].name' "${body_file}" > cloudflare-inventory/pages-projects.txt
          if ! grep -Fxq "${CF_PROJECT_NAME}" cloudflare-inventory/pages-projects.txt; then
            echo "Pages project '${CF_PROJECT_NAME}' is not visible to this Account ID/API token pair."
            echo "Visible Pages projects:"
            sed 's/^/- /' cloudflare-inventory/pages-projects.txt
            exit 4
          fi

          echo "Confirmed Pages project '${CF_PROJECT_NAME}' is visible to the supplied credentials."

      - name: Fetch preview deployment inventory
        shell: bash
        run: |
          set -euo pipefail
          : > cloudflare-inventory/previews.tsv
          api_url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID_CLEAN}/pages/projects/${CF_PROJECT_NAME}/deployments"

          page=1
          total_pages=1
          while (( page <= total_pages )); do
            body_file="$(mktemp)"
            http_code="$(curl --silent --show-error \
              --output "${body_file}" \
              --write-out '%{http_code}' \
              --get \
              "${api_url}" \
              --header "Authorization: Bearer ${CF_API_TOKEN_CLEAN}" \
              --header "Accept: application/json" \
              --data-urlencode "env=preview" \
              --data-urlencode "page=${page}" \
              --data-urlencode "per_page=100")"

            if [[ "${http_code}" != "200" ]]; then
              echo "Cloudflare Preview deployment request failed with HTTP ${http_code}."
              jq -c '{success, errors}' "${body_file}" 2>/dev/null || true
              exit 5
            fi

            if [[ "$(jq -r '.success' "${body_file}")" != "true" ]]; then
              echo "Cloudflare API returned success=false while reading Preview deployments."
              jq '.errors' "${body_file}"
              exit 5
            fi

            jq -r '.result[] | [
              .id,
              (.short_id // ""),
              (.created_on // ""),
              (.modified_on // ""),
              (.environment // ""),
              (.deployment_trigger.metadata.branch // ""),
              (.deployment_trigger.metadata.commit_hash // ""),
              (.url // "")
            ] | @tsv' "${body_file}" >> cloudflare-inventory/previews.tsv

            total_pages="$(jq -r '.result_info.total_pages // 1' "${body_file}")"
            page=$((page + 1))
          done

          preview_count="$(wc -l < cloudflare-inventory/previews.tsv | tr -d ' ')"
          echo "Preview deployments found: ${preview_count}"
          echo "PREVIEW_COUNT=${preview_count}" >> "$GITHUB_ENV"

      - name: Fetch recent production deployment inventory
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID_CLEAN}/pages/projects/${CF_PROJECT_NAME}/deployments"
          body_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "${body_file}" \
            --write-out '%{http_code}' \
            --get \
            "${api_url}" \
            --header "Authorization: Bearer ${CF_API_TOKEN_CLEAN}" \
            --header "Accept: application/json" \
            --data-urlencode "env=production" \
            --data-urlencode "page=1" \
            --data-urlencode "per_page=20")"

          if [[ "${http_code}" != "200" ]]; then
            echo "Cloudflare Production deployment request failed with HTTP ${http_code}."
            jq -c '{success, errors}' "${body_file}" 2>/dev/null || true
            exit 6
          fi

          if [[ "$(jq -r '.success' "${body_file}")" != "true" ]]; then
            echo "Cloudflare API returned success=false while reading Production deployments."
            jq '.errors' "${body_file}"
            exit 6
          fi

          jq -r '.result[] | [
            .id,
            (.short_id // ""),
            (.created_on // ""),
            (.modified_on // ""),
            (.environment // ""),
            (.deployment_trigger.metadata.branch // ""),
            (.deployment_trigger.metadata.commit_hash // ""),
            (.url // "")
          ] | @tsv' "${body_file}" > cloudflare-inventory/production-recent.tsv

          production_count="$(wc -l < cloudflare-inventory/production-recent.tsv | tr -d ' ')"
          echo "Recent production deployments captured: ${production_count}"
          echo "PRODUCTION_COUNT=${production_count}" >> "$GITHUB_ENV"

      - name: Write safety summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Cloudflare Pages deployment inventory"
            echo
            echo "- Project: \`${CF_PROJECT_NAME}\`"
            echo "- Preview deployments inventoried: ${PREVIEW_COUNT}"
            echo "- Recent Production deployments captured: ${PRODUCTION_COUNT}"
            echo "- Mode: **READ ONLY / NO DELETE**"
            echo
            echo "No DELETE request is issued by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-deployment-inventory
          path: cloudflare-inventory/
          retention-days: 7
