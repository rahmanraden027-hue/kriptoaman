name: ZVQ Domain Browser RPC Repair
on:
  pull_request:
    paths:
      - scripts/render_zvq_domain_rpc.py
      - scripts/repair_zvq_domain_rpc.py
      - scripts/zvq-rpc-allowlist-gateway.mjs
      - tests/test_zvq_domain_rpc_renderer.py
      - tests/zvq-rpc-allowlist-gateway.test.mjs
      - .github/workflows/zvq-domain-rpc-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Validate renderer and JSON-RPC read-only policy
        run: |
          python3 -m unittest discover -s tests -p 'test_zvq_domain_rpc_renderer.py' -v
          python3 -m py_compile scripts/render_zvq_domain_rpc.py scripts/repair_zvq_domain_rpc.py
          node --test tests/zvq-rpc-allowlist-gateway.test.mjs

  manually-authorized-origin-repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: review-contract
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Preview isolated TLS candidate without changes
        run: sudo -n env ZVQ_RPC_RUN_ID="$GITHUB_RUN_ID" python3 scripts/repair_zvq_domain_rpc.py
      - name: Apply domain-only route, verify public service and preserve rollback
        run: sudo -n env ZVQ_RPC_RUN_ID="$GITHUB_RUN_ID" python3 scripts/repair_zvq_domain_rpc.py --apply

  public-post-verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: manually-authorized-origin-repair
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify allowlist, chain identity, advancing blocks and fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          rpc() {
            local url="$1" method="$2" params="$3"
            curl -sS --retry 2 --retry-all-errors --max-time 15 -o /tmp/zvq-rpc.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" "$url"
          }
          for method in eth_chainId eth_blockNumber eth_gasPrice; do
            test "$(rpc https://explorer.kriptoaman.com/rpc "$method" '[]')" = 200
          done
          python3 -c 'import json; assert json.load(open("/tmp/zvq-rpc.json"))["result"]'
          test "$(rpc https://explorer.kriptoaman.com/rpc eth_chainId '[]')" = 200
          python3 -c 'import json; assert json.load(open("/tmp/zvq-rpc.json"))["result"]=="0x560c"'
          first="$(rpc https://explorer.kriptoaman.com/rpc eth_blockNumber '[]')"
          test "$first" = 200
          a="$(python3 -c 'import json; print(int(json.load(open("/tmp/zvq-rpc.json"))["result"],16))')"
          sleep 12
          test "$(rpc https://explorer.kriptoaman.com/rpc eth_blockNumber '[]')" = 200
          b="$(python3 -c 'import json; print(int(json.load(open("/tmp/zvq-rpc.json"))["result"],16))')"
          test "$b" -gt "$a"
          for method in eth_sendRawTransaction personal_listAccounts admin_peers debug_traceTransaction txpool_content qbft_getValidatorsByBlockNumber; do
            test "$(rpc https://explorer.kriptoaman.com/rpc "$method" '[]')" = 403
          done
          test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://146.190.93.254/rpc)" = 403
          curl -fsS --retry 2 --retry-all-errors --max-time 15 https://explorer.kriptoaman.com/api/v2/blocks \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("items"),list) and d["items"]'
          echo "ZVQ Explorer RPC allowlist=pass, chain=22028, blocks=advancing, IP fallback=/rpc 403"
