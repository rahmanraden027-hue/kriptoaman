name: CodeQL Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/zvq-codeql-sarif
      - name: Diagnostic Explorer CodeQL findings
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          for file in "${{ runner.temp }}"/zvq-codeql-sarif/*.sarif; do
            test -f "$file" || continue
            echo "DIAGNOSTIC_SARIF=$file"
            jq -r '[.runs[].results[] | {rule:.ruleId,level:(.level//"note"),msg:(.message.text//""),uri:(.locations[0].physicalLocation.artifactLocation.uri//""),line:(.locations[0].physicalLocation.region.startLine//0)} | select(.uri|test("explorer-dashboard|scripts/deploy-zevaryq|scripts/verify-zvq"))] | .[:30][] | [.rule,.level,.uri,.line,.msg] | @tsv' "$file" || true
          done
