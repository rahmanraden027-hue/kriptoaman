name: KAM Private Readiness Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kam-private-readiness-inventory.yml'

permissions:
  contents: read

concurrency:
  group: kam-private-readiness-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, linux, x64, kam-mainnet-evidence]
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Collect redacted private readiness inventory
        env:
          KAM_PRIVATE_RPC_URL: http://127.0.0.1:8648
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node chain/kam-mainnet/scripts/collect-private-evidence.mjs \
            | tee artifacts/kam-private-readiness-inventory.json

      - name: Upload redacted inventory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-private-readiness-inventory
          path: artifacts/kam-private-readiness-inventory.json
          if-no-files-found: error
          retention-days: 30
