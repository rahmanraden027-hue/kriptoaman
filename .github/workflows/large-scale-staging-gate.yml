name: Large Scale Staging Gate

on:
  workflow_dispatch:
    inputs:
      staging_origin:
        description: 'Dedicated isolated staging HTTPS origin (must not be *.kriptoaman.com)'
        required: true
        type: string
      profile:
        description: 'Progressive concurrent-user profile'
        required: true
        default: '1000'
        type: choice
        options:
          - '1000'
          - '2500'
          - '5000'
          - '10000'
      isolation_verified:
        description: 'I verified staging AUTH_DB/session/email/KYC/wallet isolation and synthetic data only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: large-scale-staging-${{ inputs.staging_origin }}
  cancel-in-progress: false

jobs:
  staging-certification:
    if: ${{ inputs.isolation_verified == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reject production and company hostnames
        env:
          TARGET: ${{ inputs.staging_origin }}
        run: |
          node - <<'NODE'
          const target = process.env.TARGET;
          const url = new URL(target);
          const host = url.hostname.toLowerCase();
          if (url.protocol !== 'https:') throw new Error('Staging target must use HTTPS');
          if (host === 'kriptoaman.com' || host.endsWith('.kriptoaman.com')) {
            throw new Error(`Refusing company/production hostname: ${host}`);
          }
          console.log(`Accepted isolated staging hostname: ${host}`);
          NODE

      - name: Require staging isolation attestation
        env:
          TARGET: ${{ inputs.staging_origin }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "${TARGET}/api/staging-readiness" -o staging-readiness.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('staging-readiness.json', 'utf8'));
          if (report.ready !== true) throw new Error('Staging readiness attestation is not ready');
          if (report.environment !== 'staging') throw new Error('Target does not attest staging environment');
          const checks = report.checks || {};
          for (const key of ['capacityTestsExplicitlyAllowed','writesDisabled','syntheticDataOnly','emailIsolated','kycIsolated','databaseMarkerPresent','sessionMarkerPresent']) {
            if (checks[key] !== true) throw new Error(`Staging isolation check failed: ${key}`);
          }
          if (!report.fingerprints?.database || !report.fingerprints?.session) throw new Error('Missing redacted staging isolation fingerprints');
          console.log('Staging isolation attestation accepted');
          NODE

      - name: Verify staging read-only contract
        env:
          TARGET: ${{ inputs.staging_origin }}
        run: |
          set -euo pipefail
          for path in / /login /api/auth/readiness /api/market-hot /api/network-health; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 15 "${TARGET}${path}")
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "${path} failed with HTTP ${code}"
              exit 1
            fi
          done

      - name: Run guarded k6 concurrent-user profile
        env:
          TARGET: ${{ inputs.staging_origin }}
          PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            -e BASE_URL="$TARGET" \
            -e KA_LOAD_STAGE="$PROFILE" \
            -e ALLOW_PRODUCTION_LOAD_TEST=NO \
            -e KA_INCLUDE_HOT_MARKET=YES \
            grafana/k6:latest run --summary-export=/tmp/k6-summary.json - < load/k6-production-readonly.js | tee staging-k6-output.txt

      - name: Record staging evidence metadata
        env:
          PROFILE: ${{ inputs.profile }}
          TARGET: ${{ inputs.staging_origin }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('staging-load-evidence.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            profile: process.env.PROFILE,
            target: new URL(process.env.TARGET).origin,
            writesDisabled: true,
            syntheticDataRequired: true,
            productionHostRejected: true,
            resultSource: 'k6-console-and-thresholds',
          }, null, 2));
          NODE

      - name: Upload redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: large-scale-staging-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            staging-readiness.json
            staging-load-evidence.json
            staging-k6-output.txt
          if-no-files-found: error
          retention-days: 30
