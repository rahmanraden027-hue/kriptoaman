name: KAM Explorer Origin Cutover

on:
  pull_request:
    paths:
      - 'chain/kam-mainnet/explorer-cutover-worker/**'
      - '.github/workflows/kam-explorer-origin-cutover.yml'
  push:
    branches: [main]
    paths:
      - 'chain/kam-mainnet/explorer-cutover-worker/**'
      - '.github/workflows/kam-explorer-origin-cutover.yml'

permissions:
  contents: read

concurrency:
  group: kam-explorer-origin-cutover
  cancel-in-progress: false

jobs:
  validate:
    name: Validate explorer cutover
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Worker syntax
        run: node --check chain/kam-mainnet/explorer-cutover-worker/worker.js

      - name: Verify explorer-new routes and KAM RPC identity
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://explorer-new.kriptoaman.com'

          for path in / /blocks /txs /api-docs /status; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 2 --retry-all-errors --max-time 25 "${ORIGIN}${path}")"
            echo "${path} -> HTTP ${code}"
            test "${code}" = "200"
          done

          chain_id="$(curl -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'             "${ORIGIN}/rpc" | jq -r '.result // empty')"
          block_hex="$(curl -fsS --retry 4 --retry-delay 2 --retry-all-errors --max-time 20             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}'             "${ORIGIN}/rpc" | jq -r '.result // empty')"

          echo "chain_id=${chain_id}"
          echo "block_head=${block_hex}"
          test "${chain_id}" = "0x560c"
          [[ "${block_hex}" =~ ^0x[0-9a-fA-F]+$ ]]

          block_dec="$((16#${block_hex#0x}))"
          test "${block_dec}" -ge 17296

  cutover:
    name: Cut over production Explorer
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: kriptoaman.com
      ROUTE_PATTERN: explorer.kriptoaman.com/*
      API_ROUTE_PATTERN: explorer.kriptoaman.com/api/v2/*
      NEW_WORKER: kam-mainnet-explorer-cutover
      EXPECTED_OLD_WORKER: kam-mainnet-explorer-gateway
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${CF_API_TOKEN:-}"
          echo "::add-mask::${CF_API_TOKEN}"

      - name: Snapshot current production route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          zones="$(curl --fail-with-body -sS --get             'https://api.cloudflare.com/client/v4/zones'             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H 'Accept: application/json'             --data-urlencode "name=${ZONE_NAME}"             --data-urlencode "account.id=${CF_ACCOUNT_ID}")"
          jq . <<<"${zones}" > artifacts/zones.json
          test "$(jq -r '.success' <<<"${zones}")" = "true"

          zone_count="$(jq '[.result[]] | length' <<<"${zones}")"
          test "${zone_count}" -eq 1
          zone_id="$(jq -r '.result[0].id' <<<"${zones}")"
          echo "ZONE_ID=${zone_id}" >> "${GITHUB_ENV}"

          routes="$(curl --fail-with-body -sS             "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H 'Accept: application/json')"
          jq . <<<"${routes}" > artifacts/routes-before.json
          test "$(jq -r '.success' <<<"${routes}")" = "true"

          route_count="$(jq --arg p "${ROUTE_PATTERN}" '[.result[] | select(.pattern == $p)] | length' <<<"${routes}")"
          test "${route_count}" -eq 1

          route_id="$(jq -r --arg p "${ROUTE_PATTERN}" '.result[] | select(.pattern == $p) | .id' <<<"${routes}")"
          old_worker="$(jq -r --arg p "${ROUTE_PATTERN}" '.result[] | select(.pattern == $p) | (.script // "")' <<<"${routes}")"

          echo "route_id=${route_id}"
          echo "current_worker=${old_worker}"
          echo "ROUTE_ID=${route_id}" >> "${GITHUB_ENV}"
          echo "OLD_WORKER=${old_worker}" >> "${GITHUB_ENV}"

          api_route_count="$(jq --arg p "${API_ROUTE_PATTERN}" '[.result[] | select(.pattern == $p)] | length' <<<"${routes}")"
          test "${api_route_count}" -le 1
          if [[ "${api_route_count}" -eq 1 ]]; then
            api_route_id="$(jq -r --arg p "${API_ROUTE_PATTERN}" '.result[] | select(.pattern == $p) | .id' <<<"${routes}")"
            api_old_worker="$(jq -r --arg p "${API_ROUTE_PATTERN}" '.result[] | select(.pattern == $p) | (.script // "")' <<<"${routes}")"
            echo "API_ROUTE_EXISTED=true" >> "${GITHUB_ENV}"
            echo "API_ROUTE_ID=${api_route_id}" >> "${GITHUB_ENV}"
            echo "API_OLD_WORKER=${api_old_worker}" >> "${GITHUB_ENV}"
          else
            echo "API_ROUTE_EXISTED=false" >> "${GITHUB_ENV}"
            echo "API_ROUTE_ID=" >> "${GITHUB_ENV}"
            echo "API_OLD_WORKER=" >> "${GITHUB_ENV}"
          fi

          if [[ "${old_worker}" != "${EXPECTED_OLD_WORKER}" && "${old_worker}" != "${NEW_WORKER}" ]]; then
            echo "Unexpected Worker currently owns the production route: ${old_worker}" >&2
            exit 1
          fi

          scripts="$(curl --fail-with-body -sS             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H 'Accept: application/json')"
          jq . <<<"${scripts}" > artifacts/workers-before.json
          test "$(jq -r '.success' <<<"${scripts}")" = "true"
          jq -e --arg id "${EXPECTED_OLD_WORKER}" '.result[] | select(.id == $id)' <<<"${scripts}" >/dev/null

      - name: Deploy cutover proxy Worker without changing route
        working-directory: chain/kam-mainnet/explorer-cutover-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.36.0 deploy

      - name: Replace production Worker route
        id: swap
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${OLD_WORKER}" = "${NEW_WORKER}" ]]; then
            echo "Production route already points to ${NEW_WORKER}; no route mutation needed."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          payload="$(jq -nc --arg pattern "${ROUTE_PATTERN}" --arg script "${NEW_WORKER}" '{pattern:$pattern,script:$script}')"
          response="$(curl --fail-with-body -sS -X PUT             "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H 'Content-Type: application/json'             --data "${payload}")"
          jq . <<<"${response}" > artifacts/route-cutover.json
          test "$(jq -r '.success' <<<"${response}")" = "true"
          test "$(jq -r '.result.script' <<<"${response}")" = "${NEW_WORKER}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Route Blockscout API v2 to preserved Explorer gateway
        id: api_route
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${API_ROUTE_EXISTED}" = "true" ]]; then
            if [[ "${API_OLD_WORKER}" = "${EXPECTED_OLD_WORKER}" ]]; then
              echo "API v2 route already points to ${EXPECTED_OLD_WORKER}; no mutation needed."
              echo "API_ROUTE_ID_EFFECTIVE=${API_ROUTE_ID}" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${API_OLD_WORKER}" != "${NEW_WORKER}" ]]; then
              echo "Unexpected Worker owns API v2 route: ${API_OLD_WORKER}" >&2
              exit 1
            fi
            payload="$(jq -nc --arg pattern "${API_ROUTE_PATTERN}" --arg script "${EXPECTED_OLD_WORKER}" '{pattern:$pattern,script:$script}')"
            response="$(curl --fail-with-body -sS -X PUT               "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${API_ROUTE_ID}"               -H "Authorization: Bearer ${CF_API_TOKEN}"               -H 'Content-Type: application/json'               --data "${payload}")"
            jq . <<<"${response}" > artifacts/api-route-cutover.json
            test "$(jq -r '.success' <<<"${response}")" = "true"
            test "$(jq -r '.result.script' <<<"${response}")" = "${EXPECTED_OLD_WORKER}"
            echo "API_ROUTE_ID_EFFECTIVE=${API_ROUTE_ID}" >> "${GITHUB_ENV}"
          else
            payload="$(jq -nc --arg pattern "${API_ROUTE_PATTERN}" --arg script "${EXPECTED_OLD_WORKER}" '{pattern:$pattern,script:$script}')"
            response="$(curl --fail-with-body -sS -X POST               "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes"               -H "Authorization: Bearer ${CF_API_TOKEN}"               -H 'Content-Type: application/json'               --data "${payload}")"
            jq . <<<"${response}" > artifacts/api-route-create.json
            test "$(jq -r '.success' <<<"${response}")" = "true"
            created_id="$(jq -r '.result.id' <<<"${response}")"
            test -n "${created_id}"
            echo "API_ROUTE_ID_EFFECTIVE=${created_id}" >> "${GITHUB_ENV}"
          fi

      - name: Verify production is served by explorer-new
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          PUBLIC='https://explorer.kriptoaman.com'
          ORIGIN='https://explorer-new.kriptoaman.com'

          for path in / /blocks /txs /api-docs /status; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 2 --retry-all-errors --max-time 25 "${PUBLIC}${path}")"
            echo "${path} -> HTTP ${code}"
            test "${code}" = "200"
          done

          headers="$(curl -sSI --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 "${PUBLIC}/" | tr -d '\r')"
          grep -qi '^x-kam-explorer-cutover: explorer-new$' <<<"${headers}"
          grep -qi '^x-kam-explorer-origin: explorer-new\.kriptoaman\.com$' <<<"${headers}"

          public_chain="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":3,"method":"eth_chainId","params":[]}'             "${PUBLIC}/rpc" | jq -r '.result // empty')"
          origin_head="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":4,"method":"eth_blockNumber","params":[]}'             "${ORIGIN}/rpc" | jq -r '.result // empty')"
          public_head="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":5,"method":"eth_blockNumber","params":[]}'             "${PUBLIC}/rpc" | jq -r '.result // empty')"

          echo "public_chain_id=${public_chain}"
          echo "origin_head=${origin_head}"
          echo "public_head=${public_head}"

          test "${public_chain}" = "0x560c"
          [[ "${origin_head}" =~ ^0x[0-9a-fA-F]+$ ]]
          [[ "${public_head}" =~ ^0x[0-9a-fA-F]+$ ]]

          origin_dec="$((16#${origin_head#0x}))"
          public_dec="$((16#${public_head#0x}))"
          test "${public_dec}" -ge "${origin_dec}"

          blocks_json="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 "${PUBLIC}/api/v2/blocks")"
          stats_json="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 "${PUBLIC}/api/v2/stats")"
          test "$(jq -r '(.items | type == "array") and (.items | length > 0)' <<<"${blocks_json}")" = "true"
          test "$(jq -r '(.total_transactions != null) or (.total_transactions_number != null) or (.transactions_count != null)' <<<"${stats_json}")" = "true"

      - name: Roll back production route on verification failure
        if: ${{ steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Post-cutover verification failed. Restoring ${EXPECTED_OLD_WORKER}."
          payload="$(jq -nc --arg pattern "${ROUTE_PATTERN}" --arg script "${EXPECTED_OLD_WORKER}" '{pattern:$pattern,script:$script}')"
          response="$(curl --fail-with-body -sS -X PUT             "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H 'Content-Type: application/json'             --data "${payload}")"
          jq . <<<"${response}" > artifacts/route-rollback.json
          test "$(jq -r '.success' <<<"${response}")" = "true"
          test "$(jq -r '.result.script' <<<"${response}")" = "${EXPECTED_OLD_WORKER}"

          if [[ "${API_ROUTE_EXISTED}" = "true" ]]; then
            api_payload="$(jq -nc --arg pattern "${API_ROUTE_PATTERN}" --arg script "${API_OLD_WORKER}" '{pattern:$pattern,script:$script}')"
            api_response="$(curl --fail-with-body -sS -X PUT               "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${API_ROUTE_ID}"               -H "Authorization: Bearer ${CF_API_TOKEN}"               -H 'Content-Type: application/json'               --data "${api_payload}")"
            jq . <<<"${api_response}" > artifacts/api-route-rollback.json
            test "$(jq -r '.success' <<<"${api_response}")" = "true"
          elif [[ -n "${API_ROUTE_ID_EFFECTIVE:-}" ]]; then
            api_response="$(curl --fail-with-body -sS -X DELETE               "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${API_ROUTE_ID_EFFECTIVE}"               -H "Authorization: Bearer ${CF_API_TOKEN}"               -H 'Accept: application/json')"
            jq . <<<"${api_response}" > artifacts/api-route-delete-rollback.json
            test "$(jq -r '.success' <<<"${api_response}")" = "true"
          fi

      - name: Capture final route state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ZONE_ID:-}" ]]; then exit 0; fi
          curl --fail-with-body -sS             "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H 'Accept: application/json' | jq . > artifacts/routes-after.json

      - name: Upload cutover evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-explorer-origin-cutover-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce successful production verification
        if: ${{ steps.verify.outcome == 'failure' }}
        run: |
          echo "Production verification failed and rollback was executed." >&2
          exit 1
