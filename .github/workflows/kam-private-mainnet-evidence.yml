name: KAM Private Mainnet Evidence

on:
  workflow_dispatch:
  # Evidence refresh only. No change to validator, genesis, DNS, or chain state.
  schedule:
    - cron: '23 1,13 * * *'
  # One guarded read-only refresh when this workflow is merged on main.
  # Never run unreviewed PR code on a protected validator runner.
  push:
    branches: [main]
    paths:
      - '.github/workflows/kam-private-mainnet-evidence.yml'

permissions:
  contents: read

concurrency:
  group: kam-private-mainnet-evidence
  cancel-in-progress: false

jobs:
  collect-private-evidence:
    runs-on: [self-hosted, linux, x64, kam-mainnet-evidence]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Collect private QBFT evidence
        id: qbft
        continue-on-error: true
        shell: bash
        env:
          KAM_PRIVATE_RPC_URL: http://127.0.0.1:8648
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node chain/kam-mainnet/scripts/collect-private-evidence.mjs | tee artifacts/kam-private-mainnet-evidence.json

      - name: Probe finalized-tag support and independently verify canonical hash
        id: finality
        continue-on-error: true
        shell: bash
        env:
          KAM_PRIVATE_RPC_URL: http://127.0.0.1:8648
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/probe-zvq-private-finality.mjs | tee artifacts/zvq-private-finality-evidence.json
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('artifacts/zvq-private-finality-evidence.json','utf8'));if(p.status!=='verified'){console.error('Finality proof unavailable: '+(p.reason||p.status));process.exit(1)}"

      - name: Verify independent four-host validator topology
        id: topology
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -f /var/lib/kam-evidence/four-host-topology-evidence.json
          node chain/kam-mainnet/scripts/verify-four-host-topology.mjs \
            /var/lib/kam-evidence/four-host-topology-evidence.json \
            | tee artifacts/kam-four-host-topology-verification.json

      - name: Verify dedicated protected RPC origin
        id: protected_origin
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -f /var/lib/kam-evidence/protected-rpc-origin-input.json
          node chain/kam-mainnet/scripts/verify-protected-rpc-origin.mjs \
            /var/lib/kam-evidence/protected-rpc-origin-input.json \
            /var/lib/kam-evidence/four-host-topology-evidence.json \
            | tee artifacts/kam-protected-origin-verification.json

      - name: Verify backup and isolated restore evidence
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node chain/kam-mainnet/scripts/verify-backup-restore-evidence.mjs \
            /var/lib/kam-evidence/backup-restore-evidence.json \
            | tee artifacts/kam-backup-restore-verification.json

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-private-mainnet-evidence
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce independent private-evidence gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          results=(
            'QBFT=${{ steps.qbft.outcome }}'
            'FINALITY=${{ steps.finality.outcome }}'
            'FOUR_HOST_TOPOLOGY=${{ steps.topology.outcome }}'
            'PROTECTED_RPC_ORIGIN=${{ steps.protected_origin.outcome }}'
            'ISOLATED_RESTORE=${{ steps.restore.outcome }}'
          )
          failed=0
          for item in "${results[@]}"; do
            echo "PRIVATE_EVIDENCE_GATE=${item}"
            [[ "${item}" == *=success ]] || failed=1
          done
          if (( failed )); then
            echo '::error::At least one independently verified private-mainnet evidence gate is not satisfied. Keep candidate-not-public.'
            exit 1
          fi
