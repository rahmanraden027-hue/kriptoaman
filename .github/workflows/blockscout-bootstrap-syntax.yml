name: Blockscout Bootstrap Syntax

on:
  push:
    branches:
      - fix/blockscout-source-build-clean-20260918
    paths:
      - 'scripts/bootstrap-kam-blockscout-vps.sh'
      - '.github/workflows/blockscout-bootstrap-syntax.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap-kam-blockscout-vps.sh
      - name: Validate embedded Python syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/bootstrap-kam-blockscout-vps.sh')
          lines=p.read_text().splitlines()
          blocks=[]
          i=0
          while i < len(lines):
              if "<<'PY'" in lines[i]:
                  buf=[]
                  i+=1
                  while i < len(lines) and lines[i] != 'PY':
                      buf.append(lines[i]); i+=1
                  blocks.append('\n'.join(buf))
              i+=1
          assert blocks, 'no embedded Python blocks found'
          for n,src in enumerate(blocks,1):
              compile(src, f'<embedded-{n}>', 'exec')
          print(f'embedded_python_blocks={len(blocks)}')
          PY
