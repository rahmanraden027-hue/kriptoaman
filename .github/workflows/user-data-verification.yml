name: Production User Data Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/user-data-verification.yml'

permissions:
  contents: read

jobs:
  verify-production-users:
    name: Verify production user aggregates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query deployed aggregate-only verification endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://kriptoaman.com/api/internal-verification-20260916'
          mkdir -p verification

          response=''
          status='000'
          for attempt in $(seq 1 18); do
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --output "${body_file}" --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "${endpoint}?t=$(date +%s)-${attempt}" || true)"
            response="$(cat "${body_file}")"
            rm -f "${body_file}"

            if [[ "${status}" == '200' ]] && jq -e '.source == "production AUTH_DB" and (.stats.totalUsers | type == "number")' >/dev/null 2>&1 <<<"${response}"; then
              break
            fi
            echo "Verification endpoint not ready yet (attempt ${attempt}, HTTP ${status})."
            sleep 10
          done

          if [[ "${status}" != '200' ]]; then
            echo "Production verification endpoint never returned HTTP 200."
            exit 1
          fi
          if ! jq -e '.source == "production AUTH_DB"' >/dev/null 2>&1 <<<"${response}"; then
            echo "Unexpected verification source."
            exit 2
          fi

          printf '%s\n' "${response}" | jq '.' | tee verification/user-data-verification.json

          verified="$(jq -r '.verified' <<<"${response}")"
          total="$(jq -r '.stats.totalUsers' <<<"${response}")"
          regular="$(jq -r '.stats.regularUsers' <<<"${response}")"
          admins="$(jq -r '.stats.adminUsers' <<<"${response}")"
          email_verified="$(jq -r '.stats.emailVerifiedUsers' <<<"${response}")"
          kyc_none="$(jq -r '.stats.kyc.none' <<<"${response}")"
          kyc_pending="$(jq -r '.stats.kyc.pending' <<<"${response}")"
          kyc_approved="$(jq -r '.stats.kyc.approved' <<<"${response}")"
          kyc_rejected="$(jq -r '.stats.kyc.rejected' <<<"${response}")"
          kyc_other="$(jq -r '.stats.kyc.other' <<<"${response}")"
          missing_id="$(jq -r '.stats.missingId' <<<"${response}")"
          missing_email="$(jq -r '.stats.missingEmail' <<<"${response}")"
          duplicate_email="$(jq -r '.stats.duplicateEmailRows' <<<"${response}")"
          invalid_verified="$(jq -r '.stats.invalidEmailVerified' <<<"${response}")"
          as_of="$(jq -r '.asOf' <<<"${response}")"

          {
            echo '# Production user data verification'
            echo
            echo '- Source: **production AUTH_DB binding**'
            echo "- Total users: **${total}**"
            echo "- Regular users: **${regular}**"
            echo "- Admin users: **${admins}**"
            echo "- Email verified: **${email_verified}**"
            echo "- KYC none/pending/approved/rejected/other: **${kyc_none}/${kyc_pending}/${kyc_approved}/${kyc_rejected}/${kyc_other}**"
            echo "- Missing ID: **${missing_id}**"
            echo "- Missing email: **${missing_email}**"
            echo "- Duplicate email rows: **${duplicate_email}**"
            echo "- Invalid email_verified values: **${invalid_verified}**"
            echo "- Aggregate integrity: **${verified}**"
            echo "- Verified at: **${as_of}**"
            echo
            echo 'No individual email, ID, name, phone number, or other user PII is returned.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${verified}" != 'true' ]]; then
            echo 'Production user aggregate integrity verification failed.'
            exit 3
          fi

          echo "PRODUCTION_USER_TOTAL=${total}"
          echo 'Production user dataset aggregate verification passed.'

      - name: Upload aggregate verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-user-data-verification
          path: verification/
          if-no-files-found: ignore
          retention-days: 7
