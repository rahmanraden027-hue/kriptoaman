name: sKAM Temporary Remove Legacy SPL Dependency

on:
  push:
    branches:
      - feature/skam-onchain-mint-20260905

permissions:
  contents: write

jobs:
  remove-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/skam-onchain-mint-20260905
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Remove legacy SPL Token dependency cleanly
        run: npm uninstall --save @solana/spl-token --ignore-scripts

      - name: Commit package files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency already removed.'
            exit 0
          fi
          git commit -m 'Deps: remove vulnerable legacy SPL Token client'
          git push origin HEAD:feature/skam-onchain-mint-20260905
