name: ZEVARYQ Explorer Public Route Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zevaryq-explorer-public-route-proof.yml
      - explorer-dashboard/zevaryq-production.html
      - tests/zevaryq-explorer-public-route-proof.test.mjs
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: read
concurrency:
  group: zevaryq-public-route-proof
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public DNS, default URL, and cache bypass
        shell: bash
        run: |
          set -euo pipefail
          getent ahostsv4 explorer.kriptoaman.com | awk '{print "public_dns=" $1}' | sort -u || true
          probe() {
            label="$1"; url="$2"; shift 2
            headers="$(mktemp)"; body="$(mktemp)"
            status="$(curl -LsS --connect-timeout 6 --max-time 25 -D "$headers" -o "$body" -w '%{http_code}' "$@" "$url" || true)"
            release="$(grep -o 'data-zevaryq-explorer-version="[^"]*"' "$body" | head -1 || true)"
            logo=0; globe=0; legacy=0; feature=0
            grep -Fq 'class="logo logo-zvq"' "$body" && logo=1 || true
            grep -Fq 'class="earth-brandmark"' "$body" && globe=1 || true
            grep -Fq 'class="earth-logo"' "$body" && legacy=1 || true
            if grep -Fq 'data-zevaryq-features="immune-token-v1"' "$body" \
              && grep -Fq 'id="immune-monitor"' "$body" \
              && grep -Fq 'id="token-discovery"' "$body"; then feature=1; fi
            echo "$label http=$status release=$release header_zvq=$logo globe_zvq=$globe legacy_img=$legacy immune_token_v1=$feature"
            grep -iE '^(cache-control|age|cf-cache-status|server|location|etag|via):' "$headers" || true
            if [[ "$label" == default && "$status" == 200 && ( "$logo" != 1 || "$globe" != 1 ) ]]; then
              echo "PUBLIC_DEFAULT_STALE=1" >> "$GITHUB_ENV"
            fi
            if [[ "$status" == 200 && "$feature" != 1 ]]; then
              echo "PUBLIC_FEATURE_MISSING=1" >> "$GITHUB_ENV"
            fi
            rm -f "$headers" "$body"
          }
          probe default 'https://explorer.kriptoaman.com/'
          probe bypass "https://explorer.kriptoaman.com/?zvq_feature=immune-token-v1-$GITHUB_RUN_ID" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache'
      - name: Diagnose read-only Blockscout data availability
        shell: bash
        run: |
          set -euo pipefail
          for route in 'blocks' 'transactions?type=token_creation'; do
            body="$(mktemp)"
            status="$(curl -LsS --connect-timeout 6 --max-time 20 -o "$body" -w '%{http_code}' "https://explorer.kriptoaman.com/api/v2/$route" || true)"
            if [[ "$status" == 200 ]]; then
              if node - "$body" <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(payload?.items))process.exit(2);
          console.log('indexed_items='+payload.items.length);
          NODE
              then echo "blockscout_route=$route http=200 json_items=verified"
              else echo "::warning::Blockscout route $route returned an unexpected payload"; fi
            else
              echo "::warning::Blockscout route $route returned HTTP $status; Explorer must display unavailable, not synthetic data"
            fi
            rm -f "$body"
          done
      - name: Gate stale HTTP 200 public presentation
        shell: bash
        run: |
          if [[ "$PUBLIC_DEFAULT_STALE" == 1 ]]; then
            echo "::error::Public Explorer still returns old ZV interface"
            exit 1
          fi
          if [[ "$PUBLIC_FEATURE_MISSING" == 1 ]]; then
            echo "::error::One or more publicly accessible HTTP 200 Explorer paths lack the merged immune/token feature marker"
            exit 1
          fi
      - name: Verify approved blue-gold orbital visual plus public RPC and indexed Blockscout
        shell: bash
        run: |
          set -euo pipefail
          visual='blue-gold-orbital-20260924'
          for label in default bypass; do
            if [[ "$label" == default ]]; then url='https://explorer.kriptoaman.com/'
            else url="https://explorer.kriptoaman.com/?zvq_visual_proof=$visual-$GITHUB_RUN_ID"; fi
            headers="$(mktemp)"; body="$(mktemp)"
            http="$(curl -LsS --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 8 --max-time 30 \
              -H 'Cache-Control: no-cache' -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            marker="data-zvq-reference-visual=\"$visual\""
            test "$http" = 200
            grep -Fq "$marker" "$body"
            grep -Fq 'data-zevaryq-features="immune-token-v1"' "$body"
            grep -Fq 'class="triad"' "$body"
            grep -Fq 'class="satellite-row"' "$body"
            grep -Fq 'id="token-discovery"' "$body"
            grep -Fq "EXPECTED_CHAIN='0x560c'" "$body"
            grep -iq "^x-zevaryq-explorer-design: $visual" "$headers"
            grep -iq '^x-zevaryq-explorer-release: 1\.1\.2' "$headers"
            echo "verified_public_$label: http=200 design=$visual immune_token=present rpc_guard=0x560c"
            rm -f "$headers" "$body"
          done
          for asset in zevaryq-emblem.webp zevaryq-favicon.png; do
            status="$(curl -LsS --retry 2 --connect-timeout 8 --max-time 20 -o /dev/null \
              -w '%{http_code}' "https://explorer.kriptoaman.com/zevaryq-assets/$asset")"
            test "$status" = 200
            echo "verified_asset_$asset=http_$status"
          done
          chain="$(curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            'https://explorer.kriptoaman.com/rpc')"
          test "$(jq -er '.result' <<<"$chain")" = '0x560c'
          blocks="$(curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
            'https://explorer.kriptoaman.com/api/v2/blocks')"
          jq -e '(.items | type == "array") and (.items | length > 0)' <<<"$blocks" >/dev/null
          tip="$(jq -r '.items[0].height // "unavailable"' <<<"$blocks")"
          echo "verified_rpc_chain=0x560c; blockscout_indexed_tip=$tip; public_visual=$visual"
    env:
      PUBLIC_DEFAULT_STALE: '0'
      PUBLIC_FEATURE_MISSING: '0'
  origin:
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 5
    steps:
      - name: Compare local, dedicated TLS, and public DNS routes
        shell: bash
        run: |
          set -uo pipefail
          getent ahostsv4 explorer.kriptoaman.com | awk '{print "host_dns=" $1}' | sort -u || true
          probe() {
            label="$1"; url="$2"; shift 2
            headers="$(mktemp)"; body="$(mktemp)"
            status="$(curl -LsS --connect-timeout 5 --max-time 22 -D "$headers" -o "$body" -w '%{http_code}' "$@" "$url" || true)"
            release="$(grep -o 'data-zevaryq-explorer-version="[^"]*"' "$body" | head -1 || true)"
            logo=0; legacy=0; feature=0; design=0
            grep -Fq 'class="logo logo-zvq"' "$body" && logo=1 || true
            grep -Fq 'class="earth-logo"' "$body" && legacy=1 || true
            grep -Fq 'data-zvq-reference-visual="blue-gold-orbital-20260924"' "$body" && design=1 || true
            if grep -Fq 'data-zevaryq-features="immune-token-v1"' "$body" \
              && grep -Fq 'id="immune-monitor"' "$body" \
              && grep -Fq 'id="token-discovery"' "$body"; then feature=1; fi
            echo "$label http=$status release=$release header_zvq=$logo legacy_img=$legacy immune_token_v1=$feature visual_approved=$design"
            if [[ "$label" == local-http && ( "$status" != 200 || "$feature" != 1 || "$design" != 1 ) ]]; then
              echo '::error::Dedicated Explorer origin is missing the merged evidence panels'; exit 1
            fi
            grep -iE '^(cache-control|age|cf-cache-status|server|location|etag|via):' "$headers" || true
            rm -f "$headers" "$body"
          }
          probe local-http 'http://127.0.0.1/'
          probe origin-tls 'https://explorer.kriptoaman.com/' --resolve 'explorer.kriptoaman.com:443:146.190.93.254'
          probe public-dns 'https://explorer.kriptoaman.com/'
          echo "ROUTE_PROOF_COMPLETE: read-only; chain, DNS, and VPS unchanged"
