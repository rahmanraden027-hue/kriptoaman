name: ZVQ Final Origin Preflight
on:
  pull_request:
    paths: ['.github/workflows/zvq-final-origin-preflight.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/zvq-final-origin-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only public DNS and independent origin TLS / RPC
        shell: bash
        run: |
          set -uo pipefail
          for host in explorer.kriptoaman.com rpc.kriptoaman.com; do
            echo "dns_${host}_A=$(dig +short A "$host" | tr '\n' ',' )"
            curl --silent --show-error --connect-timeout 5 --max-time 12 --output /dev/null --write-out "public_${host}_tls_verify=%{ssl_verify_result} code=%{http_code} remote_ip=%{remote_ip}\n" "https://$host/" || true
          done
          for spec in 'explorer.kriptoaman.com 146.190.93.254' 'rpc.kriptoaman.com 206.189.36.15'; do
            read -r domain ip <<<"$spec"
            curl --noproxy '*' --silent --show-error --connect-timeout 5 --max-time 12 --output /dev/null --write-out "direct_${domain}_tls_verify=%{ssl_verify_result} code=%{http_code}\n" --resolve "$domain:443:$ip" "https://$domain/" || true
            curl --noproxy '*' --silent --show-error --connect-timeout 5 --max-time 12 --output /dev/null --write-out "direct_${domain}_http_code=%{http_code}\n" --resolve "$domain:80:$ip" "http://$domain/" || true
          done
          for url in https://rpc.kriptoaman.com https://206.189.36.15; do
            echo "rpc_target=$url"
            curl --noproxy '*' --silent --show-error --connect-timeout 5 --max-time 12 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' "$url/" -o /tmp/zvq-rpc-preflight.json -w 'rpc_https_code=%{http_code} verify=%{ssl_verify_result}\n' || true
            if jq -e '.result == "0x560c"' /tmp/zvq-rpc-preflight.json >/dev/null 2>&1; then echo 'rpc_chain=0x560c'; else echo 'rpc_chain=not_yet_verified'; fi
          done
          echo 'external_read_only_preflight=completed'
  cloudflare-read:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only DNS records and Worker routes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_TOKEN:-}" ]]; then echo 'cloudflare_token=unavailable'; exit 0; fi
          echo "::add-mask::$CF_TOKEN"
          response="$(curl --fail-with-body -sS --connect-timeout 5 --max-time 15 -G 'https://api.cloudflare.com/client/v4/zones' -H "Authorization: Bearer $CF_TOKEN" --data-urlencode 'name=kriptoaman.com' || true)"
          if ! jq -e '.success == true and (.result|length)==1' <<<"$response" >/dev/null 2>&1; then echo 'cloudflare_zone_read=denied_or_unavailable'; exit 0; fi
          zone="$(jq -r '.result[0].id' <<<"$response")"
          echo 'cloudflare_zone_read=ok'
          for host in explorer.kriptoaman.com rpc.kriptoaman.com; do
            response="$(curl --fail-with-body -sS --connect-timeout 5 --max-time 12 -G "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" -H "Authorization: Bearer $CF_TOKEN" --data-urlencode "name=$host" || true)"
            if jq -e '.success == true' <<<"$response" >/dev/null 2>&1; then
              jq -r --arg host "$host" '.result[] | select(.name==$host) | "dns_name=\(.name) type=\(.type) content=\(.content) proxied=\(.proxied) ttl=\(.ttl)"' <<<"$response"
            else echo "dns_${host}_read=denied_or_unavailable"; fi
          done
          response="$(curl -sS --connect-timeout 5 --max-time 12 "https://api.cloudflare.com/client/v4/zones/$zone/workers/routes" -H "Authorization: Bearer $CF_TOKEN" || true)"
          if jq -e '.success == true' <<<"$response" >/dev/null 2>&1; then
            jq -r '.result[] | select(.pattern|test("rpc|explorer")) | "worker_route=\(.pattern) script=\(.script // "none")"' <<<"$response"
          else echo 'worker_route_read=denied_or_unavailable'; fi
          echo 'cloudflare_read_only_preflight=completed'
  explorer-host:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 4
    steps:
      - name: Inspect existing TLS listener and renewal without mutations
        shell: bash
        run: |
          set -uo pipefail
          echo "listener_443=$(ss -H -ltn '( sport = :443 )' | wc -l)"
          echo "tls_container=$(docker inspect -f '{{.State.Status}}' zvq-origin-ip-tls 2>/dev/null || echo missing)"
          echo "renew_timer=$(systemctl is-active zvq-origin-ip-renew.timer 2>/dev/null || true)"
          cert='/etc/letsencrypt/live/zvq-origin-ip/fullchain.pem'
          if sudo -n test -r "$cert"; then sudo -n openssl x509 -in "$cert" -noout -enddate -ext subjectAltName; else echo 'ip_certificate=unreadable'; fi
          echo "rpc_private_tcp_8545=$(timeout 3 bash -c 'cat < /dev/null > /dev/tcp/10.104.0.2/8545' 2>/dev/null && echo reachable || echo unavailable)"
          echo 'explorer_host_read_only_preflight=completed'
