name: KAM Four-Host Redundancy Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kam-four-host-redundancy-gate
  cancel-in-progress: false

jobs:
  verify-topology:
    runs-on: [self-hosted, linux, x64, kam-mainnet-evidence]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify four-host validator topology and RPC sentry separation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node chain/kam-mainnet/scripts/verify-four-host-topology.mjs \
            /var/lib/kam-evidence/four-host-topology-evidence.json \
            | tee artifacts/kam-four-host-redundancy-evidence.json

      - name: Upload redacted redundancy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-four-host-redundancy-evidence
          path: artifacts/kam-four-host-redundancy-evidence.json
          if-no-files-found: error
          retention-days: 30
