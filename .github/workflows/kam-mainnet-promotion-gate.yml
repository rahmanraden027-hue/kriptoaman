name: KAM Mainnet Promotion Gate

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail the run unless all public-mainnet evidence gates pass'
        required: false
        default: false
        type: boolean
  schedule:
    # Redundant probes reduce false continuity resets when GitHub delays/skips one cron.
    # Promotion readiness still requires at least one real ready=true evidence probe per UTC hour.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kam-mainnet-promotion-gate.yml'
      - 'chain/kam-mainnet/**'

permissions:
  contents: read

concurrency:
  group: kam-mainnet-promotion-gate
  cancel-in-progress: false

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify candidate status is not prematurely promoted
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(node -e "const p=require('./chain/kam-mainnet/network-profile.json'); process.stdout.write(p.status)")
          test "$STATUS" = "mainnet-candidate-not-public"
          echo "KAM_NETWORK_STATUS=$STATUS"

      - name: Verify public RPC and explorer
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node chain/kam-mainnet/scripts/verify-public-endpoints.mjs 2>&1 | tee artifacts/kam-mainnet-public-readiness.json

      - name: Evaluate full promotion readiness manifest
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = './chain/kam-mainnet/promotion-readiness.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (Number(p.chainId) !== 22028) throw new Error('promotion-readiness chainId must remain 22028');
          if (p.status !== 'mainnet-candidate-not-public') throw new Error('promotion-readiness status must remain candidate until all gates pass');
          const required = [
            'publicRpcExplorer',
            'validatorSet4of4',
            'backupRestore',
            'hourlyMonitoring',
            'fourDistinctValidatorHosts',
            'dedicatedProtectedRpcOrigin',
            'continuity24h',
            'finalChainIdCollisionCheck',
            'finalDocsLogoVerificationChannels'
          ];
          const missing = required.filter((key) => p.gates?.[key] !== true);
          const allReady = missing.length === 0;
          console.log(JSON.stringify({ allReady, missing, status: p.status, chainId: p.chainId }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `all_ready=${allReady}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing=${missing.join(',')}\n`);
          NODE

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kam-mainnet-public-readiness
          path: artifacts/kam-mainnet-public-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate-not-ready status
        if: steps.verify.outcome != 'success' || steps.readiness.outputs.all_ready != 'true'
        run: |
          echo 'KAM_PUBLIC_MAINNET_GATE=NOT_READY'
          echo "Missing reviewed gates: ${{ steps.readiness.outputs.missing }}"
          echo 'KAM Mainnet remains mainnet-candidate-not-public. No public-mainnet promotion is authorized by endpoint health alone.'

      - name: Enforce strict manual promotion gate
        if: github.event_name == 'workflow_dispatch' && inputs.strict == true && (steps.verify.outcome != 'success' || steps.readiness.outputs.all_ready != 'true')
        run: |
          echo 'Strict promotion gate failed.'
          echo "Missing reviewed gates: ${{ steps.readiness.outputs.missing }}"
          exit 1

      - name: Promotion endpoint gate passed
        if: steps.verify.outcome == 'success'
        run: |
          echo 'KAM_PUBLIC_ENDPOINT_GATE=PASS'
          echo 'Hourly continuity is counted from validated artifact checkedAt timestamps: at least one ready=true probe must exist in every consecutive UTC hour bucket. Redundant :17/:47 schedules improve evidence continuity but do not waive any missing-hour or failed-probe requirement.'

      - name: Full public-mainnet evidence gate passed
        if: steps.verify.outcome == 'success' && steps.readiness.outputs.all_ready == 'true'
        run: |
          echo 'KAM_PUBLIC_MAINNET_EVIDENCE_GATE=PASS'
          echo 'All repository-tracked evidence gates are marked reviewed and current. A separate reviewed status-change commit is still required before public-mainnet promotion.'
