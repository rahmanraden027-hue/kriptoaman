name: KAM Self-hosted Origin Diagnostics

on:
  push:
    branches: [ops/kam-readonly-20260918]
    paths:
      - '.github/workflows/kam-selfhosted-origin-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, kam-mainnet-evidence]
    timeout-minutes: 5
    steps:
      - name: Non-destructive host identity and KAM checks
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname=$(hostname)"
          echo "kernel=$(uname -srmo)"
          echo "runner_user=$(id -un)"
          echo "public_ip=$(curl -fsS --max-time 10 https://api.ipify.org || true)"
          for url in http://127.0.0.1/health http://127.0.0.1:8648 http://127.0.0.1:8545; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 5 "$url" || true)"
            echo "probe=$url http=$code body=$(head -c 240 /tmp/body 2>/dev/null || true)"
          done
          if command -v docker >/dev/null 2>&1; then
            echo 'docker_present=true'
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}' 2>/dev/null | sed -n '1,25p' || true
          else
            echo 'docker_present=false'
          fi
          echo 'diagnostic_complete=true'
