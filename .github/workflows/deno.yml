name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-auth-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Auth security regression tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Lint first-party auth
        run: >-
          npx eslint server/auth/*.js functions/api/auth/*.js
          functions/api/auth/google/*.js src/lib/kriptoAuth.js
          src/lib/AuthContext.jsx src/api/base44Client.js src/pages/KYC.jsx
          src/pages/EnglishLanding.jsx src/pages/SystemStatus.jsx
          src/components/market/TradingViewModal.jsx public/sw.js --quiet
