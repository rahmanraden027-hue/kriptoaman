name: ZVQ Origin Asset Read-Only Diagnosis
on:
  pull_request:
    paths:
      - ".github/workflows/zvq-origin-asset-diagnostic.yml"
      - "scripts/deploy-zevaryq-explorer.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'ops/zvq-assets-http-fallback-20260924' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, kam-explorer-host]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare approved assets, host disk, NGINX mounts, and public HTTP responses
        shell: bash
        run: |
          set -uo pipefail
          echo 'APPROVED_REPO_ASSETS'
          sha256sum explorer-dashboard/assets/zevaryq-emblem.webp explorer-dashboard/assets/zevaryq-favicon.png
          host_dir=/opt/blockscout/docker-compose/proxy/kam-dashboard/zevaryq-assets
          echo 'HOST_DISK_ASSETS'
          for asset in zevaryq-emblem.webp zevaryq-favicon.png; do
            if [[ -r "$host_dir/$asset" ]]; then
              stat -c '%n bytes=%s' "$host_dir/$asset"
              sha256sum "$host_dir/$asset"
            else echo "MISSING_ON_HOST=$asset"; fi
          done
          cd /opt/blockscout/docker-compose
          proxy="$(docker compose ps -q proxy)"
          echo "PROXY_CONTAINER_PRESENT=$([[ -n "$proxy" ]] && echo yes || echo no)"
          if [[ -n "$proxy" ]]; then
            docker inspect "$proxy" --format '{{range .Mounts}}{{printf "%s -> %s\n" .Source .Destination}}{{end}}'
            docker exec "$proxy" sh -c 'grep -hE "location |root |alias |try_files" /etc/nginx/conf.d/*.conf 2>/dev/null | head -60' || true
          fi
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for route in local public; do
            for asset in zevaryq-emblem.webp zevaryq-favicon.png; do
              if [[ "$route" == local ]]; then url="http://127.0.0.1/zevaryq-assets/$asset"; else url="https://explorer.kriptoaman.com/zevaryq-assets/$asset"; fi
              code="$(curl --noproxy '*' -LsS --connect-timeout 5 --max-time 15 -D "$scratch/$route-$asset.headers" -o "$scratch/$route-$asset" -w '%{http_code}' "$url?v=20260924-goldblue-zvq" || true)"
              echo "ASSET_HTTP_ROUTE=$route FILE=$asset HTTP=$code"
              grep -iE '^(content-type|content-length|cache-control):' "$scratch/$route-$asset.headers" || true
              sha256sum "$scratch/$route-$asset" 2>/dev/null || true
              head -c 48 "$scratch/$route-$asset" 2>/dev/null | od -An -tx1 || true
            done
          done
          curl --noproxy '*' -LsS --connect-timeout 5 --max-time 15 'http://127.0.0.1/' -o "$scratch/local-index.html" || true
          sha256sum "$scratch/local-index.html" 2>/dev/null || true
          echo 'READ_ONLY_PROBE_COMPLETE'

      - name: Compare canonical V2 logo and V3 browser assets across origin and public edge
        shell: bash
        run: |
          # Read-only verification. All requests are GET; no Docker mutation.
          set -uo pipefail
          repo_assets="explorer-dashboard/assets"
          host_assets="/opt/blockscout/docker-compose/proxy/kam-dashboard/zevaryq-assets"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for asset in zevaryq-master-v2.svg zvq-v2.css zvq-v2.js; do
            if [[ ! -s "$repo_assets/$asset" ]]; then
              echo "::warning::Missing approved repository asset: $asset"
              continue
            fi
            expected="$(sha256sum "$repo_assets/$asset" | awk '{print $1}')"
            echo "APPROVED_ASSET=$asset SHA256=$expected"
            if [[ -r "$host_assets/$asset" ]]; then
              host_hash="$(sha256sum "$host_assets/$asset" | awk '{print $1}')"
              echo "HOST_ASSET=$asset SHA256=$host_hash"
              if [[ "$host_hash" != "$expected" ]]; then
                echo "::warning::Origin disk asset differs from approved repo: $asset"
              fi
            else
              echo "::warning::Origin disk asset missing or unreadable: $asset"
            fi
            for route in local public; do
              if [[ "$route" == local ]]; then
                url="http://127.0.0.1/zevaryq-assets/$asset"
              else
                url="https://explorer.kriptoaman.com/zevaryq-assets/$asset"
              fi
              : > "$scratch/headers"
              : > "$scratch/body"
              code="$(curl --noproxy '*' -LsS --connect-timeout 5 --max-time 20 -D "$scratch/headers" -o "$scratch/body" -w '%{http_code}' "$url?v=20261008-evidence-v3" || true)"
              mime="$(grep -i '^content-type:' "$scratch/headers" | tail -1 | tr -d '\r' || true)"
              echo "ASSET_ROUTE=$route FILE=$asset HTTP=$code MIME=$mime"
              if [[ "$code" != 200 ]]; then
                echo "::warning::Unverified $route response for $asset (HTTP $code); edge failures do not prove an origin failure."
                continue
              fi
              if head -c 256 "$scratch/body" | grep -Eiq '<!doctype html|<html'; then
                echo "::warning::HTML fallback served instead of $asset at $route route."
                continue
              fi
              observed="$(sha256sum "$scratch/body" | awk '{print $1}')"
              echo "ASSET_SHA256_ROUTE=$route FILE=$asset OBSERVED=$observed EXPECTED=$expected"
              if [[ "$observed" != "$expected" ]]; then
                echo "::warning::Asset drift on $route for $asset; verify proxy/cache before claiming release."
              else
                echo "ASSET_MATCH_ROUTE=$route FILE=$asset"
              fi
            done
          done
          for route in local public; do
            if [[ "$route" == local ]]; then
              url="http://127.0.0.1/"
            else
              url="https://explorer.kriptoaman.com/"
            fi
            : > "$scratch/home"
            code="$(curl --noproxy '*' -LsS --connect-timeout 5 --max-time 20 -o "$scratch/home" -w '%{http_code}' "$url?v=20261008-evidence-v3" || true)"
            if [[ "$code" != 200 ]]; then
              echo "::warning::Homepage $route HTTP $code; no release assertion."
            elif grep -Fq 'data-zvq-network-telemetry="production-v3"' "$scratch/home"; then
              echo "V3_HTML_MARKER_ROUTE=$route PRESENT"
            else
              echo "::warning::V3 HTML marker not present on $route homepage."
            fi
          done
          echo 'CANONICAL_V2_V3_READ_ONLY_DIAGNOSIS_COMPLETE'
