name: Zevaryq Cloudflare Route Probe

on:
  push:
    branches:
      - feature/zevaryq-explorer-production
    paths:
      - '.github/workflows/zevaryq-cloudflare-route-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: kriptoaman.com
    steps:
      - name: Read Explorer Cloudflare route state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${CF_API_TOKEN:-}"
          echo "::add-mask::${CF_API_TOKEN}"
          zones="$(curl --fail-with-body -sS --get \
            'https://api.cloudflare.com/client/v4/zones' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Accept: application/json' \
            --data-urlencode "name=${ZONE_NAME}" \
            --data-urlencode "account.id=${CF_ACCOUNT_ID}")"
          test "$(jq -r '.success' <<<"${zones}")" = "true"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zones}")"
          test -n "${zone_id}"
          routes="$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Accept: application/json')"
          test "$(jq -r '.success' <<<"${routes}")" = "true"
          jq -r '.result[] | select(.pattern | startswith("explorer.kriptoaman.com")) | [.pattern, (.script // "")] | @tsv' <<<"${routes}"
