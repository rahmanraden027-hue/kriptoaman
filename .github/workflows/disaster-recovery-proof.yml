name: Disaster Recovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/market-hot.js'
      - 'functions/api/market-snapshot.js'
      - 'functions/api/market-snapshot-page.js'
      - 'functions/api/market-benchmark-history.js'
      - 'functions/api/market-history.js'
      - 'functions/api/network-health.js'
      - 'functions/_shared/d1-session.js'
      - 'functions/_shared/market-timeseries.js'
      - 'src/components/home/HomeMarketMovers.jsx'
      - 'src/components/home/HomePortfolioPerformance.jsx'
      - 'src/components/home/WhaleAlertCard.jsx'
      - 'src/components/market/MarketOverviewWidget.jsx'
      - 'src/components/market/marketDataService.jsx'
      - 'src/components/charting/AdvancedPriceChart.jsx'
      - 'src/components/wallet/MiniPriceChart.jsx'
      - 'src/components/wallet/useMarketData.jsx'
      - 'src/lib/readOnlyMarketPrices.js'
      - 'src/lib/aiIntelligence.js'
      - 'src/components/home/AIInsightCard.jsx'
      - 'tests/disaster-recovery-simulation.test.mjs'
      - 'tests/data-resilience-v3.test.mjs'
      - 'tests/data-resilience-v3-phase2.test.mjs'
      - 'tests/data-resilience-v3-phase3.test.mjs'
      - 'tests/market-timeseries.test.mjs'
      - 'docs/DATA_RESILIENCE_V3.md'
      - 'docs/MARKET_TIMESERIES_POLICY.md'
      - '.github/workflows/disaster-recovery-proof.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/market-hot.js'
      - 'functions/api/market-snapshot.js'
      - 'functions/api/market-snapshot-page.js'
      - 'functions/api/market-benchmark-history.js'
      - 'functions/api/market-history.js'
      - 'functions/api/network-health.js'
      - 'functions/_shared/d1-session.js'
      - 'functions/_shared/market-timeseries.js'
      - 'src/components/home/HomeMarketMovers.jsx'
      - 'src/components/home/HomePortfolioPerformance.jsx'
      - 'src/components/home/WhaleAlertCard.jsx'
      - 'src/components/market/MarketOverviewWidget.jsx'
      - 'src/components/market/marketDataService.jsx'
      - 'src/components/charting/AdvancedPriceChart.jsx'
      - 'src/components/wallet/MiniPriceChart.jsx'
      - 'src/components/wallet/useMarketData.jsx'
      - 'src/lib/readOnlyMarketPrices.js'
      - 'src/lib/aiIntelligence.js'
      - 'src/components/home/AIInsightCard.jsx'
      - 'tests/disaster-recovery-simulation.test.mjs'
      - 'tests/data-resilience-v3.test.mjs'
      - 'tests/data-resilience-v3-phase2.test.mjs'
      - 'tests/data-resilience-v3-phase3.test.mjs'
      - 'tests/market-timeseries.test.mjs'
      - 'docs/DATA_RESILIENCE_V3.md'
      - 'docs/MARKET_TIMESERIES_POLICY.md'
      - '.github/workflows/disaster-recovery-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-failure-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate provider RPC AI and long-duration market failures
        run: node --test tests/disaster-recovery-simulation.test.mjs tests/data-resilience-v3.test.mjs tests/data-resilience-v3-phase2.test.mjs tests/data-resilience-v3-phase3.test.mjs tests/market-timeseries.test.mjs
      - name: Verify production remains read-only healthy
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/market-hot /api/network-health /api/kam/network-status; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 15 "https://kriptoaman.com${path}")
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "Live read-only check failed: ${path} HTTP ${code}" >&2
              cat /tmp/body || true
              exit 1
            fi
          done
