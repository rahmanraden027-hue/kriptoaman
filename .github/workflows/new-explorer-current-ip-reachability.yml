name: New Explorer Current IP Reachability

on:
  push:
    branches:
      - audit/new-explorer-ip-20260918
    paths:
      - '.github/workflows/new-explorer-current-ip-reachability.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe current Explorer VPS ports
        shell: bash
        run: |
          set -euo pipefail
          host=146.190.93.254
          for p in 22 80 443; do
            if timeout 5 bash -c "echo >/dev/tcp/$host/$p" 2>/dev/null; then
              echo "port_$p=open"
            else
              echo "port_$p=closed"
            fi
          done
