name: Blockscout Live Origin Probe

on:
  push:
    branches:
      - audit/blockscout-live-origin-20260918
    paths:
      - '.github/workflows/blockscout-live-origin-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe new Blockscout origin
        shell: bash
        run: |
          set -u
          host=blockscout-origin.kriptoaman.com
          for p in 22 80 443; do
            if timeout 5 bash -c "echo >/dev/tcp/$host/$p" 2>/dev/null; then
              echo "port_$p=open"
            else
              echo "port_$p=closed"
            fi
          done
          echo "=== healthz ==="
          curl -sS -i --max-time 10 "http://$host/healthz" || true
          echo
          echo "=== blocks ==="
          curl -sS -i --max-time 15 "http://$host/api/v2/blocks" | head -c 2000 || true
          echo
          echo "=== stats ==="
          curl -sS -i --max-time 15 "http://$host/api/v2/stats" | head -c 2000 || true


