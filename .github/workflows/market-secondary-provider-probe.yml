name: Market Secondary Provider Probe

on:
  push:
    branches:
      - audit/market-secondary-provider-20260918
    paths:
      - '.github/workflows/market-secondary-provider-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe CoinGecko and CryptoCompare
        shell: bash
        run: |
          set -u
          probe_get() {
            label="$1"; url="$2"
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15               -H 'accept: application/json'               -H 'user-agent: KriptoAman-Market-Probe/1.0'               "$url" || true)"
            ok="FAIL"
            if [[ "$code" = 200 ]]; then ok="PASS"; fi
            size="$(wc -c < "$body" | tr -d ' ')"
            echo "$label status=$ok code=$code bytes=$size"
            head -c 400 "$body" | tr '\n' ' '; echo
            rm -f "$body"
          }

          probe_get coingecko_ping 'https://api.coingecko.com/api/v3/ping'
          probe_get coingecko_simple 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'
          probe_get coingecko_markets 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=1&page=1&sparkline=false'
          probe_get cryptocompare_top 'https://min-api.cryptocompare.com/data/top/totalvolfull?limit=1&page=0&tsym=USD'
