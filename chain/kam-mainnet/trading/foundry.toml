[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 2048
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
kam = "${KAM_RPC_URL}"
